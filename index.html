<script id="meta" type="application/json">{"eras":[{"id":"archaic","name":"Archaic","from":-9999,"to":-480},{"id":"classical","name":"Classical","from":-480,"to":-323},{"id":"hellenistic","name":"Hellenistic (Koine)","from":-323,"to":-31},{"id":"imperial","name":"Roman Imperial (Koine)","from":-31,"to":330},{"id":"lateantique","name":"Late Antique","from":330,"to":620},{"id":"byzantine","name":"Byzantine (Medieval Greek)","from":620,"to":1453},{"id":"postbyz","name":"Post-Byzantine","from":1453,"to":9999}],"authors":{"tlg0532":{"name":"Achilles Tatius","grc":"Ἀχιλλεὺς Τάτιος","birth":null,"death":null,"floruit":175,"year":175,"era":"imperial","desc":"Greek novelist, author of Leucippe and Clitophon (2nd century CE)","wiki":"https://en.wikipedia.org/wiki/Achilles_Tatius","q":"Q221951","place":"Alexandria","occ":["writer"],"nworks":1,"core":{"summary":"Achilles Tatius (Ἀχιλλεὺς Τάτιος, Achilleus Tatios, 2nd century CE) was, according to the Byzantine Suda, from Alexandria. The Suda's further claims, that he became a Christian and a bishop and wrote on astronomy, are probably later confusions. Papyri show that his novel was being read in Egypt by the late second century CE.\n\nLeucippe and Clitophon (Τὰ κατὰ Λευκίππην καὶ Κλειτοφῶντα, Ta kata Leukippēn kai Kleitophōnta), in eight books, is told in the first person by Clitophon, whom the author meets at Sidon in front of a painting of Europa and the bull. Clitophon falls in love with his cousin Leucippe, elopes with her, and suffers shipwreck, bandits, apparent deaths (Leucippe 'dies' three times), a rival marriage and a trial before the lovers are reunited at Ephesus. The tone is often knowing and comic. The narrator is no model of fidelity, and the novel plays with the conventions that Chariton and Xenophon took seriously.\n\nAchilles Tatius is a writer of the Second Sophistic, and his Greek is polished Attic. He fills the story with learned digressions on love, animals, painting and natural wonders, and with ecphrases (ἔκφρασις, ekphrasis, \"description\") of works of art. His prose, full of balanced antitheses and short rhythmic clauses, was much admired in Byzantium, although Photius disapproved of its indecency.","timeline":[[175,"Leucippe and Clitophon written (2nd century CE)"],[200,"Papyri show the novel circulating in Egypt (late 2nd century)"],[870,"Photius praises the style but condemns the morals of the novel (9th century)"],[1000,"The Suda makes him a Christian and a bishop, probably a later confusion (10th century)"],[1554,"Annibale della Croce's Latin translation of the whole novel"],[1601,"Editio princeps of the Greek text (Heidelberg, Commelinus)"]],"manuscripts":"Leucippe and Clitophon survives in some twenty manuscripts, far more than Chariton or Xenophon, a sign of its popularity in Byzantium. They fall into two main families. Several papyri of the second to fourth centuries, including one that arranges the text in a different order, show that the ancient text was already somewhat fluid.","variants":"Editors must choose between the two manuscript families, which differ in many small details. One papyrus places a passage from Book 2 earlier in the story, and scholars debate whether this reflects an earlier version or an error. The date of the novel was once put much later, until the papyri fixed it in the second century.","editions":["R. Hercher, Erotici Scriptores Graeci, vol. 1 (Teubner, 1858) — the Greek text used here","E. Vilborg, Achilles Tatius: Leucippe and Clitophon (Stockholm, 1955–62), with commentary","J.-P. Garnaud, Achille Tatius: Le Roman de Leucippé et Clitophon (Budé, 1991)","S. Gaselee, Achilles Tatius (Loeb Classical Library, 1917; revised 1969)","T. Whitmarsh, Achilles Tatius: Leucippe and Clitophon (Oxford World's Classics, 2001)"]}},"tlg2949":{"name":"Acta Barnabae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"apocryphal Acts of Barnabas, a Christian narrative (probably 5th century) presented as the account of John Mark","wiki":"https://en.wikipedia.org/wiki/Acts_of_Barnabas","q":"Q3629160","place":null,"occ":[],"nworks":1},"tlg0317":{"name":"Acta Joannis","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"apocryphal Acts of John, an early Christian narrative of the apostle's travels (2nd–3rd century)","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg2948":{"name":"Acta Philippi","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"apocryphal Acts of Philip, a Christian narrative of the apostle's missions (probably late 4th century)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2038":{"name":"Acta Thomae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"apocryphal Acts of Thomas, recounting the apostle's mission to India (early 3rd century, probably composed in Syriac)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0731":{"name":"Adamantius Judaeus","grc":null,"birth":400,"death":500,"floruit":null,"year":450,"era":"lateantique","desc":"Jewish-born physician and teacher of medicine (iatrosophist) who left Alexandria in 415 and became a Christian at Constantinople; author of a Physiognomonica","wiki":"https://en.wikipedia.org/wiki/Adamantius_(physician)","q":"Q351469","place":"Alexandria","occ":["writer","physician","iatrosophist"],"nworks":2},"tlg0666":{"name":"Adrianus of Tyre","grc":null,"birth":113,"death":193,"floruit":null,"year":153,"era":"imperial","desc":"sophist during the reigns of Marcus Aurelius and Commodus","wiki":"https://en.wikipedia.org/wiki/Adrianus","q":"Q1271013","place":"Tyre","occ":["rhetorician","sophist","philosopher"],"nworks":1},"tlg0545":{"name":"Aelian","grc":null,"birth":null,"death":235,"floruit":null,"year":205,"era":"imperial","desc":"Roman author and teacher (c.175–c.235)","wiki":"https://en.wikipedia.org/wiki/Claudius_Aelianus","q":"Q313782","place":"Praeneste","occ":["writer","teacher","poet","historian","zoologist","orator"],"nworks":4},"tlg0087":{"name":"Aelius Herodianus","grc":null,"birth":180,"death":250,"floruit":null,"year":215,"era":"imperial","desc":"2nd-century Roman-Egyptian grammarian and writer","wiki":"https://en.wikipedia.org/wiki/Aelius_Herodianus","q":"Q380826","place":"Alexandria","occ":["writer","grammarian"],"nworks":34},"tlg0607":{"name":"Aelius Theon","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"1st century AD Greek sophist and author","wiki":"https://en.wikipedia.org/wiki/Aelius_Theon","q":"Q405173","place":"Alexandria","occ":["writer","teacher","rhetorician","orator"],"nworks":1},"tlg0058":{"name":"Aeneas Tacticus","grc":null,"birth":-500,"death":-400,"floruit":-350,"year":-350,"era":"classical","desc":"4th century BC Greek writer","wiki":"https://en.wikipedia.org/wiki/Aeneas_Tacticus","q":"Q405969","place":null,"occ":["military leader","military writer"],"nworks":1},"tlg0026":{"name":"Aeschines","grc":"Αἰσχίνης","birth":-390,"death":-314,"floruit":null,"year":-356,"era":"classical","desc":"Greek orator and statesman (4th century BCE)","wiki":"https://en.wikipedia.org/wiki/Aeschines","q":"Q317089","place":"Athens","occ":["writer","politician","diplomat","orator"],"nworks":4,"core":{"summary":"Aeschines (Αἰσχίνης, Aischinēs, c. 390–c. 314 BCE) rose from modest beginnings to become one of the leading politicians of Athens. According to Demosthenes' hostile portrait, his father kept a school and he himself worked as a clerk and as a minor tragic actor before entering politics; he also served as a soldier. In 346 he went with Demosthenes on the embassies that negotiated the Peace of Philocrates with Philip II of Macedon, and he became the chief spokesman for accommodation with Macedon, and Demosthenes' bitterest rival.\n\nOnly three of his speeches survive, which ancient critics called 'the Graces'. Each belongs to his long duel with Demosthenes. Against Timarchus (346/5) destroyed one of Demosthenes' allies by accusing him of prostitution in his youth. On the Embassy (343) was his successful defence against Demosthenes' charge that he had betrayed Athens on the embassy to Philip; he was acquitted by a narrow margin. Against Ctesiphon (330) attacked the proposal to crown Demosthenes. Demosthenes answered with On the Crown, and Aeschines won less than a fifth of the votes, left Athens, and taught rhetoric on Rhodes. He is said to have died on Samos. The twelve letters under his name are later forgeries.\n\nAncient critics admired his natural fluency, clarity and vivid narrative. His Greek is clear, lively Attic, with long quotations of laws, decrees and poetry and a showman's ear for effect. Read alongside Demosthenes, the speeches give both sides of the great political argument of fourth-century Athens.","timeline":[[-390,"Born in Athens (c. 390)"],[-348,"Serves as a soldier and begins his political career"],[-346,"Serves with Demosthenes on the embassies to Philip; the Peace of Philocrates"],[-345,"Against Timarchus (346/5)"],[-343,"On the Embassy; narrowly acquitted of treason"],[-330,"Against Ctesiphon fails; Aeschines leaves Athens for Rhodes"],[-314,"Dies, reportedly on Samos (c. 314)"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"The three speeches survive in a good number of medieval manuscripts, which editors divide into several families, with ancient commentaries (scholia) in the margins. Papyri from Egypt add early evidence. The letters survive in a separate tradition.","variants":"As with Demosthenes, the documents quoted in the speeches (laws and decrees) are often later insertions rather than the texts Aeschines had read out. The manuscript families differ in many small readings, and some passages have been expanded by later hands. The twelve letters are not authentic.","editions":["C. D. Adams, The Speeches of Aeschines (Loeb Classical Library, 1919) — the Greek text and translation used here","F. Blass, Aeschinis Orationes (Teubner, 1896) — one of the texts used here","M. R. Dilts, Aeschinis Orationes (Teubner, 1997), the standard text","C. Carey, Aeschines (Austin, 2000), translation","N. Fisher, Aeschines: Against Timarchos (Oxford, 2001), with commentary"]}},"tlg0085":{"name":"Aeschylus","grc":"Αἰσχύλος","birth":-525,"death":-456,"floruit":null,"year":-470,"era":"classical","desc":"ancient Athenian playwright","wiki":"https://en.wikipedia.org/wiki/Aeschylus","q":"Q40939","place":"Eleusis","occ":["writer","playwright","warrior","tragedy writer"],"nworks":7,"core":{"summary":"Aeschylus (Αἰσχύλος, Aischylos, c. 525–456 BCE) is the earliest of the three great Athenian tragedians and the first whose plays survive. He fought against the Persians at Marathon, and by some ancient accounts at Salamis too. The epitaph that tradition attributes to him remembers Marathon, not his plays. He wrote between seventy and ninety plays (the ancient sources differ) and, according to the ancient Life, won thirteen victories in his lifetime. Seven tragedies survive under his name, one of them, Prometheus Bound, of disputed authorship.\n\nAristotle (Poetics 1449a) credits him with adding a second actor, which made real dialogue and conflict possible on stage; by the Oresteia he was also using the third actor introduced by Sophocles. His Persians (472 BCE) is the earliest surviving tragedy that can be dated securely, and the only surviving one about a recent historical event. The Suppliants was long thought older still, until a papyrus published in 1952 showed that it was probably produced in the 460s. The Oresteia (458 BCE), made up of Agamemnon, Libation Bearers and Eumenides, is the only complete trilogy to survive (its satyr play, Proteus, is lost). It follows a cycle of murder and revenge in the house of Atreus to its end in a court of law at Athens.\n\nHis language is dense, bold and full of striking images and coinages. In Aristophanes' Frogs (405 BCE) Euripides mocks his \"ox-sized words\" (ῥήματα βόεια, rhēmata boeia), and a single sentence of the Agamemnon can call Helen \"ship-destroying, man-destroying, city-destroying\" (ἑλέναυς, ἕλανδρος, ἑλέπτολις, helenaus, helandros, heleptolis, 689–90), a pun on her name. Like all tragedians he gives his choral songs a Doric colouring, with ᾱ where Attic has η (μάτηρ, matēr, for μήτηρ, \"mother\"). This makes him rewarding but demanding to read in Greek.","timeline":[[-525,"Born at Eleusis (525/4 BCE)"],[-499,"First competes at the City Dionysia, c. 499 BCE"],[-490,"Fights at Marathon"],[-484,"First victory at the Dionysia"],[-472,"Persians, the earliest securely dated surviving tragedy, wins first prize; the young Pericles pays for the production"],[-468,"Defeated by Sophocles in the younger poet's first victory (Plutarch, Cimon 8)"],[-467,"Seven against Thebes, the last play of a trilogy on the house of Laius"],[-458,"Oresteia (Agamemnon, Libation Bearers, Eumenides) wins first prize"],[-456,"Dies at Gela in Sicily (456/5 BCE); the story that an eagle dropped a tortoise on his head is a later anecdote"],[-330,"Lycurgus has official copies of the three tragedians' plays deposited in Athens, c. 330 BCE, to curb actors' alterations"],[1518,"Aldine editio princeps (Venice), which runs the surviving parts of Agamemnon and Libation Bearers together as one play"]],"manuscripts":"Galen tells a story that Ptolemy III borrowed the official Athenian copies of the tragedians against a deposit of fifteen talents and simply kept them; whatever its truth, our texts descend from the editions of the Alexandrian scholars. After that almost everything depends on one book: the Medicean manuscript in Florence (Laurentianus 32.9, called M), copied in the late tenth century, which also contains Sophocles and Apollonius of Rhodes. For the Suppliants and the Libation Bearers it is the only independent witness, and it has lost the opening of the Libation Bearers, some of which is recovered from quotations in Aristophanes' Frogs.\n\nM has also lost large parts of the Agamemnon (lines 311–1066, and from 1160 to the end). For those passages editors depend on manuscripts connected with the fourteenth-century edition of the Byzantine scholar Demetrius Triclinius: Laurentianus 31.8 (F), Marcianus gr. 616 in Venice (G), and Triclinius' own copy in Naples (T). Three plays, Prometheus, Seven against Thebes and Persians, were read in Byzantine schools as the 'Byzantine triad' and survive in many manuscripts, with Byzantine commentaries. The other four are much more thinly attested.","variants":"Aeschylus' text is among the most corrupt in Greek literature, and his choral lyrics in particular are full of passages that editors have had to repair by conjecture. Because M is missing so much of the Agamemnon, nearly half of that play rests on the Triclinian manuscripts alone, which all go back to a single late source.\n\nWhether Prometheus Bound is really by Aeschylus has been questioned since the nineteenth century on grounds of metre, style and staging. Many scholars now doubt it, and some suggest that it was completed or staged after his death, perhaps by his son Euphorion, but the question is still open. The end of the Seven against Thebes, where Antigone resolves to bury her brother against the city's decree (1005–78), is widely thought to have been added later, probably under the influence of Sophocles' Antigone. After Aeschylus' death Athens allowed his plays to be restaged, and actors' changes in these revivals are one reason Lycurgus had an official text made.","editions":["A. Sidgwick, Aeschyli Tragoediae (Oxford Classical Texts, 1902) — one of the Greek texts used here","H. W. Smyth, Aeschylus, 2 vols (Loeb Classical Library, 1922–26) — the other Greek text and the main translation used here","Robert Browning, The Agamemnon of Aeschylus (1877) — the verse translation of the Agamemnon used here","M. L. West, Aeschyli Tragoediae (Teubner, 1990; 2nd ed. 1998)","D. L. Page, Aeschyli Septem Quae Supersunt Tragoedias (OCT, 1972)","A. H. Sommerstein, Aeschylus, 3 vols (Loeb Classical Library, 2008), the third volume containing the fragments","S. Radt, Tragicorum Graecorum Fragmenta III: Aeschylus (1985) — the standard edition of the fragments","E. Fraenkel, Aeschylus: Agamemnon, 3 vols (Oxford, 1950), the landmark commentary"]}},"tlg0096":{"name":"Aesop","grc":null,"birth":-620,"death":-564,"floruit":-570,"year":-570,"era":"archaic","desc":"legendary teller of fables, said to have lived in the 6th century BCE","wiki":"https://en.wikipedia.org/wiki/Aesop","q":"Q43423","place":null,"occ":["fabulist"],"nworks":1},"tlg0067":{"name":"Agatharchides","grc":null,"birth":-208,"death":null,"floruit":-150,"year":-150,"era":"hellenistic","desc":"Greek historian and geographer of Cnidus, at the Ptolemaic court in Alexandria (2nd century BCE)","wiki":"https://en.wikipedia.org/wiki/Agatharchides","q":"Q391216","place":"Cnidus","occ":["naturalist","historian","geographer","philosopher"],"nworks":1},"tlg0090":{"name":"Agathemerus","grc":null,"birth":null,"death":null,"floruit":250,"year":250,"era":"imperial","desc":"ancient Greek geographer","wiki":"https://en.wikipedia.org/wiki/Agathemerus","q":"Q515542","place":"Alexandria","occ":["geographer"],"nworks":1},"tlg4024":{"name":"Agathias Scholasticus","grc":null,"birth":536,"death":582,"floruit":570,"year":570,"era":"lateantique","desc":"Byzantine poet and historian","wiki":"https://en.wikipedia.org/wiki/Agathias","q":"Q233136","place":"Myrina","occ":["writer","lawyer","historian","epigrammatist"],"nworks":2},"tlg4086":{"name":"Agathodaemon","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"alchemist","wiki":"https://en.wikipedia.org/wiki/Agathodaemon_(alchemist)","q":"Q19666011","place":null,"occ":["alchemist"],"nworks":2},"tlg0676":{"name":"Aglaias, Byzantius","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"ancient Greek physician and elegiac poet","wiki":null,"q":"Q26427827","place":null,"occ":["poet"],"nworks":1},"tlg0693":{"name":"Albinus","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"Middle Platonist philosopher (2nd century CE); the Handbook of Platonism long credited to him is now usually assigned to Alcinous","wiki":"https://en.wikipedia.org/wiki/Albinus_(philosopher)","q":"Q657941","place":null,"occ":["philosopher"],"nworks":2},"tlg0610":{"name":"Alcidamas","grc":null,"birth":null,"death":null,"floruit":-380,"year":-380,"era":"classical","desc":"4th century BC Greek sophist and rhetorician","wiki":"https://en.wikipedia.org/wiki/Alcidamas","q":"Q444459","place":"Elaea","occ":["rhetorician","philosopher","orator"],"nworks":2},"tlg0640":{"name":"Alciphron","grc":null,"birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"Greek sophist, author of fictional letters of fishermen, farmers, parasites and courtesans (2nd–3rd century CE)","wiki":"https://en.wikipedia.org/wiki/Alciphron","q":"Q559866","place":null,"occ":["writer","rhetorician"],"nworks":1},"tlg0594":{"name":"Alexander Numenius","grc":null,"birth":100,"death":200,"floruit":null,"year":150,"era":"imperial","desc":"ancient Greek rhetorician","wiki":"https://en.wikipedia.org/wiki/Alexander_Numenius","q":"Q622258","place":null,"occ":["rhetorician"],"nworks":1},"tlg0732":{"name":"Alexander of Aphrodisias","grc":"Ἀλέξανδρος ὁ Ἀφροδισιεύς","birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"2nd-3rd century Greek peripatetic philosopher and commentator on Aristotle","wiki":"https://en.wikipedia.org/wiki/Alexander_of_Aphrodisias","q":"Q317146","place":"Aphrodisias","occ":["philosopher"],"nworks":13,"core":{"summary":"Alexander of Aphrodisias (Ἀλέξανδρος ὁ Ἀφροδισιεύς, Alexandros ho Aphrodisieus, fl. c. 200 CE) was the most important ancient commentator on Aristotle, called by later writers simply 'the Commentator' (ὁ ἐξηγητής, ho exēgētēs). He came from Aphrodisias in Caria, where an inscription honouring his father, also a philosopher, has been found. In the dedication of his treatise On Fate he thanks the emperors Septimius Severus and Caracalla for appointing him to a chair of Aristotelian philosophy, probably at Athens, between 198 and 209.\n\nHis commentaries survive on the first books of the Metaphysics, the first book of the Prior Analytics, the Topics, the Meteorology and On Sense and Sensibles. He also wrote independent treatises: On the Soul, which developed an influential theory of the intellect; On Fate, a defence of human responsibility against Stoic determinism; On Mixture; and several collections of short Questions. His interpretations shaped the reading of Aristotle for more than a thousand years, among Greek Neoplatonists, Arabic philosophers such as al-Farabi and Averroes, and Latin scholastics.\n\nAlexander's Greek is the precise, economical prose of the philosophical schools, closely following Aristotle's terminology. It rewards readers who already know Aristotle.","timeline":[[198,"Appointed to a chair of Aristotelian philosophy by Septimius Severus and Caracalla (198–209)"],[200,"Writes his commentaries and treatises, including On Fate (c. 200)"],[850,"Many of his works are translated into Arabic (9th century)"],[1891,"Commentaria in Aristotelem Graeca publishes his commentaries (from 1891)"]],"manuscripts":"Each of Alexander's works has its own tradition, and several survive in only one or two Greek manuscripts. Some works lost in Greek survive in Arabic or Latin translations, and the Arabic versions are important for his theory of the intellect.","variants":"A number of works under his name are not his, including the commentary on the later books of the Metaphysics (probably by the Byzantine scholar Michael of Ephesus), the commentary on the Sophistical Refutations, the Ethical Problems and the treatise On Fevers. The Mantissa and the Questions are collections of short pieces, and scholars debate which of them come from Alexander and which from his school.","editions":["I. Bruns, Alexandri Aphrodisiensis praeter commentaria scripta minora (Supplementum Aristotelicum II.1–2, Berlin, 1887–92) — the text used here for the treatises","M. Hayduck, M. Wallies and P. Wendland, commentaries in Commentaria in Aristotelem Graeca I–III (Berlin, 1891–1901) — the text used here for the commentaries","R. W. Sharples, Alexander of Aphrodisias on Fate (London, 1983)","The Ancient Commentators on Aristotle, ed. R. Sorabji (London, 1987–), English translations"]}},"tlg2135":{"name":"Alypius","grc":null,"birth":null,"death":null,"floruit":350,"year":350,"era":"lateantique","desc":"ancient Greek writer, musicologist and music theorist","wiki":"https://en.wikipedia.org/wiki/Alypius_of_Alexandria","q":"Q450311","place":"Alexandria","occ":["writer","musician","musicologist","music theorist"],"nworks":1},"tlg4016":{"name":"Ammonius","grc":null,"birth":435,"death":517,"floruit":null,"year":476,"era":"lateantique","desc":"5th-century Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Ammonius_Hermiae","q":"Q123147","place":"Alexandria","occ":["astronomer","writer","philosopher"],"nworks":5},"tlg0708":{"name":"Ammonius Grammaticus","grc":null,"birth":null,"death":null,"floruit":350,"year":350,"era":"lateantique","desc":"grammarian to whom a lexicon of easily confused words, largely drawn from Herennius Philo, is attributed; perhaps the Alexandrian priest of the 4th century","wiki":"https://en.wikipedia.org/wiki/Ammonius_Grammaticus","q":"Q695923","place":"Alexandria","occ":["priest","grammarian"],"nworks":1},"tlg0037":{"name":"Anacharsis","grc":null,"birth":null,"death":null,"floruit":-590,"year":-590,"era":"archaic","desc":"Scythian sage of the 6th century BCE, counted by some among the Seven Sages; the letters under his name are later Cynic works","wiki":"https://en.wikipedia.org/wiki/Anacharsis","q":"Q325026","place":"Scythia","occ":["politician","philosopher"],"nworks":1},"tlg0027":{"name":"Andocides","grc":"Ἀνδοκίδης","birth":-440,"death":null,"floruit":null,"year":-415,"era":"classical","desc":"Greek logographer and orator (c.440–c.390 BC)","wiki":"https://en.wikipedia.org/wiki/Andocides","q":"Q391654","place":"Athens","occ":["orator"],"nworks":4,"core":{"summary":"Andocides (Ἀνδοκίδης, Andokidēs, c. 440–after 391 BCE) was an Athenian aristocrat whose life was shaped by a single scandal. In 415, as the great expedition to Sicily was about to sail, the herms, sacred pillars that stood throughout the city, were mutilated in one night, and the Eleusinian Mysteries were said to have been profaned in private houses. Andocides was arrested and, to save himself and his family, gave information naming others, in exchange for immunity. A decree barring those guilty of impiety from the temples and the marketplace drove him into exile, and he spent years as a merchant around the Aegean.\n\nHe returned under the amnesty of 403. His speech On the Mysteries (400/399), his defence when his enemies tried to prosecute him for impiety again, is a vivid, first-hand account of the scandal of 415 and of Athenian law after the restoration of democracy; he was acquitted. On His Return is an earlier, unsuccessful plea to be allowed home. On the Peace with Sparta (392/1) urged the Athenians to accept a treaty he had helped negotiate; its rejection sent him into exile again, and nothing is known of him afterwards. A fourth speech in the collection, Against Alcibiades, is a later rhetorical exercise.\n\nAndocides was an amateur, not a professional speechwriter, and ancient critics ranked him low among the ten Attic orators. His Greek is plain and conversational, sometimes loose in construction, but his narrative is lively and personal, and he is an important historical source.","timeline":[[-440,"Born in Athens to an aristocratic family (c. 440)"],[-415,"Mutilation of the herms and profanation of the Mysteries; Andocides informs to save himself"],[-408,"On His Return, an unsuccessful plea to come home (c. 410–405)"],[-403,"Returns to Athens under the amnesty"],[-400,"On the Mysteries (400/399); acquitted"],[-391,"On the Peace with Sparta (392/1); exiled again"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"Andocides survives mainly in the early fourteenth-century Codex Crippsianus in the British Library (Burney 95, A), the most important manuscript of the minor Attic orators, and in manuscripts related to it. The Crippsianus was copied at Constantinople by a known scribe, Michael Klostomalles.","variants":"The text depends on a narrow tradition, so many corruptions have to be corrected by conjecture. The authenticity of Against Alcibiades has long been rejected; it presents itself as a speech of 415 but is generally regarded as a later composition. The documents quoted in On the Mysteries may include later insertions, though some are probably genuine.","editions":["K. J. Maidment, Minor Attic Orators I: Antiphon, Andocides (Loeb Classical Library, 1941) — the Greek text and translation used here","D. M. MacDowell, Andokides: On the Mysteries (Oxford, 1962), with commentary","M. Edwards, Andocides (Warminster, 1995), with translation and commentary","M. R. Dilts and D. J. Murphy, Antiphontis et Andocidis Orationes (OCT, 2018), the standard text"]}},"tlg2703":{"name":"Anna Comnena","grc":"Ἄννα Κομνηνή","birth":1083,"death":1153,"floruit":null,"year":1118,"era":"byzantine","desc":"Byzantine princess and historian","wiki":"https://en.wikipedia.org/wiki/Anna_Komnene","q":"Q179284","place":"Constantinople","occ":["writer","historian"],"nworks":1,"core":{"summary":"Anna Komnene (Ἄννα Κομνηνή, Anna Komnēnē, 1083–c. 1153) was the eldest child of the emperor Alexios I Komnenos. She was born 'in the purple' (πορφυρογέννητος, porphyrogennētos), in the palace chamber reserved for imperial births, and received an exceptional education in literature, philosophy and medicine. She married the soldier and historian Nikephoros Bryennios. After her father's death in 1118 she was implicated in a failed plot against her brother, John II, and spent her later years in the convent of the Theotokos Kecharitomene in Constantinople, which her mother had founded.\n\nThe Alexiad (Ἀλεξιάς), in fifteen books, completed around 1148, is a history of her father's life and reign (1081–1118), begun, she says, to complete the unfinished work of her husband. It describes Alexios' wars against the Normans, Pechenegs and Seljuk Turks, and it is our only Byzantine account of the First Crusade by an eyewitness of its arrival in Constantinople. Anna writes as a devoted daughter, and her portrait of her father is openly admiring; she is sharp about the crusaders and the Normans.\n\nHer Greek is a learned, Atticising literary language far removed from the Greek spoken in her day, full of quotations from Homer and allusions to classical authors. She often apologises for having to use barbarous foreign names and calls the western crusaders by the ancient name Κελτοί (Keltoi, \"Celts\"). The Alexiad is one of the landmarks of Byzantine literature and one of the few major historical works by a woman before modern times.","timeline":[[1081,"Her father Alexios I Komnenos becomes emperor"],[1083,"Born in the Porphyra of the palace at Constantinople (1 December 1083)"],[1097,"The First Crusade passes through Constantinople"],[1118,"Death of Alexios; her plot against her brother John II fails"],[1137,"Death of her husband Nikephoros Bryennios (c. 1137)"],[1148,"Completes the Alexiad (c. 1148)"],[1153,"Dies (c. 1153)"],[1610,"First printed, in part, by David Hoeschel at Augsburg"]],"manuscripts":"The Alexiad survives in a small number of manuscripts. The most important are two of the twelfth century: Coislinianus 311 in Paris and Laurentianus 70.2 in Florence. There is also an abridgement made in the thirteenth century. Some leaves are lost, so there are gaps in the narrative.","variants":"Scholars debate how far the Alexiad is Anna's own work, how much it draws on the notes and memoirs of her husband and of veterans of her father's campaigns, and when its parts were written. A minority view assigns much of it to Bryennios' materials; most scholars treat Anna as a genuine and highly personal author. Her chronology is sometimes confused.","editions":["L. Schopen and A. Reifferscheid, Annae Comnenae Alexiadis libri XV, 2 vols (Corpus Scriptorum Historiae Byzantinae, Bonn, 1839–78), with Latin translation — one of the texts used here","A. Reifferscheid, Annae Comnenae Porphyrogenitae Alexias, 2 vols (Teubner, 1884) — the other text used here","D. R. Reinsch and A. Kambylis, Annae Comnenae Alexias, 2 vols (Corpus Fontium Historiae Byzantinae 40, Berlin, 2001), the standard edition","B. Leib, Anne Comnène: Alexiade, 4 vols (Budé, 1937–76)","E. R. A. Sewter, The Alexiad of Anna Comnena (Harmondsworth, 1969; revised by P. Frankopan, 2009)"]}},"tlg1129":{"name":"Anonymi de Barbarismo et Soloecismo","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous grammatical treatise on barbarism and solecism","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2972":{"name":"Anonymi de Terrae Motibus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous treatise on earthquakes","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg3156":{"name":"Anonymi Exegesis in Hesiodi Theogoniam","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous commentary (exegesis) on Hesiod's Theogony","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0092":{"name":"Anonymi Geographiae Expositio Compendiaria","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous short summary of geography","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg4026":{"name":"Anonymi in Aristotelis Artem Rhetoricam","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era :null,"place":null,"occ":[],"nworks":1},"tlg1134":{"name":"Anonymous Iamblichi","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous sophistic text of c. 400 BCE preserved in Iamblichus' Protrepticus","wiki":null,"q":"Q3618227","place":null,"occ":[],"nworks":1},"tlg1131":{"name":"Anonymus Ad Avircium Marcellum contra Cataphrygas","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous anti-Montanist Christian writer of the late 2nd century, addressing Avircius Marcellus, quoted by Eusebius (5.16–17)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0643":{"name":"Anonymus Londinensis","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"papyrus of the 1st century CE in the British Library containing a medical treatise with a history of earlier medical theories","wiki":null,"q":"Q107676132","place":null,"occ":["physician"],"nworks":5},"tlg0618":{"name":"Antigoni Epistula","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letter of King Antigonus Gonatas of Macedon inviting the Stoic Zeno to his court, preserved by Diogenes Laertius","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0044":{"name":"Antiochus Epistolographus","grc":null,"birth":-242,"death":-187,"floruit":null,"year":-214,"era":"hellenistic","desc":"Antiochus III the Great, Seleucid king (reigned 223–187 BCE); letters to his officials about the Jews of Jerusalem, preserved by Josephus","wiki":"https://en.wikipedia.org/wiki/Antiochus_III_the_Great","q":"Q3365","place":"Susa","occ":["sovereign"],"nworks":1},"tlg1146":{"name":"Antipater Tarsensis","grc":null,"birth":-200,"death":-129,"floruit":null,"year":-164,"era":"hellenistic","desc":"Stoic philosopher","wiki":"https://en.wikipedia.org/wiki/Antipater_of_Tarsus","q":"Q581732","place":"Tarsus","occ":["philosopher"],"nworks":1},"tlg0028":{"name":"Antiphon","grc":"Ἀντιφῶν","birth":-480,"death":-411,"floruit":null,"year":-445,"era":"classical","desc":"5th century BC Athenian orator","wiki":"https://en.wikipedia.org/wiki/Antiphon_(orator)","q":"Q335560","place":"Rhamnous","occ":["politician","orator"],"nworks":6,"core":{"summary":"Antiphon of Rhamnus (Ἀντιφῶν, Antiphōn, c. 480–411 BCE) was the first Athenian to write speeches for others to deliver in court and to publish them, and later tradition made him the teacher of Thucydides. Thucydides himself describes him as the brains behind the oligarchic coup of 411 that set up the regime of the Four Hundred: a man second to none in ability, who preferred to work behind the scenes. When the oligarchy fell, Antiphon was tried for treason and executed. Thucydides calls his defence speech the finest ever made by a man on trial for his life, and papyrus fragments of it survive.\n\nThree of his court speeches survive: Against the Stepmother, a son's prosecution of his stepmother for poisoning his father; On the Murder of Herodes; and On the Choreutes, about a boy who died while training for a festival chorus. Three Tetralogies, sets of four model speeches (two for each side) on imaginary homicide cases, show how arguments from probability could be built on both sides. Their authorship is disputed. Whether this Antiphon is the same man as Antiphon the Sophist, whose philosophical fragments are listed separately, is also debated.\n\nAntiphon's Greek is austere and old-fashioned, with the -σσ- spellings of older Attic (θάλασσα, not θάλαττα), poetic words and heavy, formal antitheses. He is the earliest Attic prose writer whose speeches survive, and his work shows Athenian rhetoric in the making.","timeline":[[-480,"Born at Rhamnus in Attica (c. 480)"],[-430,"Active as a teacher of rhetoric and the first professional speechwriter"],[-419,"On the Choreutes (c. 419)"],[-411,"Leads the oligarchic coup of the Four Hundred; after its fall he is tried for treason and executed"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"The speeches survive mainly in the early fourteenth-century Codex Crippsianus in the British Library (Burney 95, A) and related manuscripts. Papyrus fragments of his defence speech of 411 (On the Revolution) and of works attributed to Antiphon the Sophist come from Egypt.","variants":"The chief questions are ones of authorship. The Tetralogies contain features of language and law that some scholars think un-Athenian or later, and others defend as Antiphon's. There has been a long debate over whether the orator and the sophist are one person or two. Most scholars now incline to two, though the question is open.","editions":["K. J. Maidment, Minor Attic Orators I: Antiphon, Andocides (Loeb Classical Library, 1941) — the Greek text and translation used here","T. Thalheim, Antiphontis Orationes et Fragmenta (Teubner, 1914)","M. Gagarin, Antiphon: The Speeches (Cambridge, 1997), with commentary","M. R. Dilts and D. J. Murphy, Antiphontis et Andocidis Orationes (OCT, 2018), the standard text"]}},"tlg1147":{"name":"Antiphon of Athens","grc":null,"birth":null,"death":null,"floruit":-430,"year":-430,"era":"classical","desc":"Antiphon the Sophist, Athenian thinker of the late 5th century BCE; whether he is the orator Antiphon is debated","wiki":"https://en.wikipedia.org/wiki/Sophistic_works_of_Antiphon","q":"Q15078686","place":"Athens","occ":["writer","mathematician","philosopher"],"nworks":1},"tlg0591":{"name":"Antisthenes","grc":null,"birth":-445,"death":-365,"floruit":null,"year":-405,"era":"classical","desc":"Greek philosopher, founder of Cynicism (c.446–c.366 BCE)","wiki":"https://en.wikipedia.org/wiki/Antisthenes","q":"Q179149","place":"Athens","occ":["philosopher"],"nworks":2},"tlg1126":{"name":"Anubion, Poeta Astrologus","grc":null,"birth":100,"death":null,"floruit":null,"year":140,"era":"imperial","desc":"Greek astrologer and poet","wiki":null,"q":"Q612245","place":null,"occ":["writer","poet","astrologer"],"nworks":1},"tlg0548":{"name":"Apollodorus","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"ancient mythographer, purported author of the Bibliotheca","wiki":"https://en.wikipedia.org/wiki/Pseudo-Apollodorus","q":"Q12506564","place":null,"occ":["writer","historian","mythographer"],"nworks":2},"tlg0082":{"name":"Apollonius Dyscolus","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"2nd-century Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Apollonius_Dyscolus","q":"Q472809","place":"Alexandria","occ":["grammarian","dialectologist"],"nworks":4},"tlg0550":{"name":"Apollonius of Perga","grc":null,"birth":-262,"death":-190,"floruit":-200,"year":-200,"era":"hellenistic","desc":"ancient Greek geometer and astronomer noted for his writings on conic sections","wiki":"https://en.wikipedia.org/wiki/Apollonius_of_Perga","q":"Q180109","place":"Perge","occ":["astronomer","mathematician"],"nworks":1},"tlg0001":{"name":"Apollonius Rhodius","grc":"Ἀπολλώνιος Ῥόδιος","birth":null,"death":null,"floruit":-260,"year":-260,"era":"hellenistic","desc":"3rd century BC Greek epic poet","wiki":"https://en.wikipedia.org/wiki/Apollonius_of_Rhodes","q":"Q192638","place":"Alexandria","occ":["writer","poet","librarian","grammarian","scholar","mythographer"],"nworks":1,"core":{"summary":"Apollonius of Rhodes (Ἀπολλώνιος Ῥόδιος, Apollōnios Rhodios, 3rd century BCE) was an Alexandrian scholar and poet. An ancient list of the heads of the Library of Alexandria places him between Zenodotus and Eratosthenes, and he is said to have tutored the future Ptolemy III. His ancient Lives say that he was a pupil of Callimachus, that an early recital of his poem failed, and that he withdrew to Rhodes, which gave him his name. Much of this looks like later storytelling, including the tale of a bitter quarrel with Callimachus.\n\nHis Argonautica (Ἀργοναυτικά), in four books of about 5,800 lines, is the only Greek epic to survive from the long gap between Homer and the Roman empire. It tells how Jason and the Argonauts sailed to Colchis for the Golden Fleece and back. Its heart is Book 3, where Medea falls in love with Jason and betrays her father to help him. This is one of the first great studies of love in European literature, and Virgil drew on it for Dido in the Aeneid. Apollonius' Jason is an uncertain, modern sort of hero, and the poem is full of learned explanations of places, cults and customs.\n\nApollonius writes in Homer's language, but not as Homer did. He uses rare Homeric words in carefully chosen new senses, reshapes formulas, and avoids the repetitions of oral epic. The poem opens with an address to Apollo: Ἀρχόμενος σέο, Φοῖβε, παλαιγενέων κλέα φωτῶν / μνήσομαι (Archomenos seo, Phoibe, palaigeneōn klea phōtōn / mnēsomai, \"Beginning with you, Phoebus, I will recall the famous deeds of men of old\").","timeline":[[-295,"Born, perhaps c. 295 BCE; ancient sources call him Alexandrian or Naucratite"],[-265,"Head of the Library of Alexandria after Zenodotus (date uncertain)"],[-60,"Varro of Atax adapts the Argonautica in Latin"],[-19,"Virgil's Aeneid, whose Dido owes much to Apollonius' Medea"],[75,"Valerius Flaccus writes a new Latin Argonautica"],[1496,"Editio princeps, with the scholia, printed in capitals at Florence by Janus Lascaris"]],"manuscripts":"The chief manuscript is the same tenth-century Florentine codex that preserves Aeschylus and Sophocles, Laurentianus 32.9 (L). The other medieval manuscripts, mostly of the thirteenth to fifteenth centuries, form a few related groups. The poem comes with a large body of ancient commentary (scholia), which a note in L says was drawn from the commentaries of Lucillus of Tarrha, Sophocleus and Theon. It preserves much learned information on myth and geography. Papyri of the Roman period add early evidence.","variants":"The scholia quote readings from an 'earlier edition' (προέκδοσις, proekdosis) of Book 1 that differ from our text, which suggests that Apollonius revised his poem, or that ancient scholars believed he had. Otherwise the text is fairly sound. Editors disagree mainly over Homeric forms, which scribes tended to normalize, and over some obscure geographical passages in Book 4.","editions":["G. W. Mooney, The Argonautica of Apollonius Rhodius (London, 1912), with commentary — the text used here","H. Fränkel, Apollonii Rhodii Argonautica (OCT, 1961)","F. Vian and É. Delage, Apollonios de Rhodes: Argonautiques, 3 vols (Budé, 1974–81)","W. H. Race, Apollonius Rhodius: Argonautica (Loeb Classical Library, 2008)","R. L. Hunter, Apollonius of Rhodes: Argonautica Book III (Cambridge, 1989), with commentary"]}},"tlg9007":{"name":"Appendix Proverbiorum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"appendix to the collections of the Greek paroemiographers (compilers of proverbs)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0551":{"name":"Appianus of Alexandria","grc":"Ἀππιανός","birth":95,"death":165,"floruit":null,"year":130,"era":"imperial","desc":"Greco-Roman historian (c. 95 – c.165)","wiki":"https://en.wikipedia.org/wiki/Appian","q":"Q190368","place":"Alexandria","occ":["writer","lawyer","historian","civil servant"],"nworks":15,"core":{"summary":"Appian (Ἀππιανός, Appianos, c. 95–c. 165 CE) was a Greek of Alexandria, where he lived through the Jewish revolt of 115–117. He moved to Rome, practised as an advocate, and became a Roman citizen. His friend Fronto, the tutor of Marcus Aurelius, wrote to the emperor Antoninus Pius (between 147 and 161) asking that the elderly Appian be given the honorary rank of procurator. The preface to his history describes his career.\n\nHis Roman History (Ῥωμαϊκά, Rhōmaika), in twenty-four books, was arranged not by date but by region: each book tells the story of Rome's wars with one people or area, from the kings and the conquest of Italy to Spain, Carthage, Macedonia, Syria and Mithridates, followed by five books on the Civil Wars from the Gracchi (133 BCE) to 35 BCE. The books on Spain, Hannibal, Carthage, Illyria, Syria, Mithridates and the Civil Wars survive; the others are known from excerpts. The Civil Wars are our only continuous ancient narrative of the Roman revolution, and an English translation of 1578 was probably among Shakespeare's sources for Julius Caesar.\n\nAppian writes plain, clear Koine, with little rhetorical ornament. He is interested in why Rome came to rule the world and in the dangers of civil strife, and he relies heavily on earlier sources, now lost, which makes him valuable even where he is uncritical.","timeline":[[95,"Born at Alexandria (c. 95)"],[116,"Experiences the Jewish revolt in Egypt (115–117)"],[120,"Moves to Rome and practises as an advocate"],[150,"Fronto asks Antoninus Pius to make him an honorary procurator (between 147 and 161)"],[160,"Writes the Roman History (c. 150–165)"],[165,"Dies (c. 165)"],[1472,"Pier Candido Decembrio's Latin translation printed in Venice"],[1551,"Editio princeps of the Greek text (Paris)"]],"manuscripts":"The surviving books come down in a limited number of medieval manuscripts, and each group of books has its own tradition. The lost books survive mainly through excerpts made for the emperor Constantine VII and through summaries by Photius, who read the complete work.","variants":"Appian's accounts sometimes contradict other sources because he compresses and rearranges material from several predecessors, and his chronology can be confused. Scholars debate which lost historians he followed, especially for the Civil Wars. The book called Parthian Wars in older editions is not by Appian but a later compilation from Plutarch.","editions":["L. Mendelssohn, Appiani Historia Romana, 2 vols (Teubner, 1879–81) — the Greek text used here","H. White, The Roman History of Appian of Alexandria, 2 vols (London and New York, 1899) — the translation used here","P. Viereck, A. G. Roos and E. Gabba, Appiani Historia Romana (Teubner, 1939–62)","B. McGing, Appian: Roman History, 6 vols (Loeb Classical Library, 2019–20)","P. Goukowsky and others, Appien: Histoire romaine (Budé, 1997–)"]}},"tlg0653":{"name":"Aratus Solensis","grc":"Ἄρατος","birth":-315,"death":-240,"floruit":null,"year":-277,"era":"hellenistic","desc":"Greek didactic poet (c. 315/310–240 BC)","wiki":"https://en.wikipedia.org/wiki/Aratus","q":"Q180671","place":"Soli","occ":["astronomer","writer","poet"],"nworks":1,"core":{"summary":"Aratus of Soli (Ἄρατος, Aratos, c. 315–c. 240 BCE) came from Cilicia, studied in Athens, where he came to know the Stoic Zeno, and in about 276 was invited to the court of King Antigonus Gonatas at Pella in Macedonia. There he wrote the Phaenomena (Φαινόμενα, \"Appearances\"), a poem of 1,154 hexameters that sets out in verse the constellations described in prose by the astronomer Eudoxus, followed by a section on weather signs.\n\nThe poem opens with a hymn to Zeus, Ἐκ Διὸς ἀρχώμεσθα (Ek Dios archōmestha, \"Let us begin from Zeus\"), and a phrase from its fifth line, \"for we are also his offspring\", is quoted by Paul in his speech at Athens (Acts 17:28). Callimachus praised Aratus' refined art, and he hid in his description of the crescent moon an acrostic, in which the first letters of lines 783–787 spell ΛΕΠΤΗ (leptē, \"slender, refined\"), the watchword of the new poetics. The Phaenomena became one of the most widely read poems of antiquity. It was translated into Latin by Cicero, Germanicus and Avienus, commented on by the astronomer Hipparchus, and copied throughout the Middle Ages.\n\nAratus writes in Homeric and Hesiodic language, polished and allusive, with a Stoic vision of a universe ordered by Zeus for the good of mankind.","timeline":[[-315,"Born at Soli in Cilicia (c. 315)"],[-290,"Studies at Athens"],[-276,"Invited to the court of Antigonus Gonatas at Pella (c. 276)"],[-270,"Writes the Phaenomena (c. 270s)"],[-240,"Dies (c. 240)"],[-150,"Hipparchus writes his commentary criticising Aratus' astronomy (2nd century BCE)"],[-80,"Cicero translates the Phaenomena into Latin as a young man"],[50,"Paul quotes the Phaenomena at Athens (Acts 17:28)"]],"manuscripts":"The Phaenomena survives in many medieval manuscripts, often with extensive ancient commentaries (scholia) and illustrations of the constellations. The poem was part of the basic education in astronomy in Byzantium and was copied very widely.","variants":"The text is generally sound. The main problems concern the scholia and the ancient Lives of Aratus, which are contradictory. Scholars also discuss the relation between the poem's astronomy, which follows Eudoxus closely, and the actual sky of Aratus' day, as Hipparchus already noted.","editions":["G. R. Mair, Callimachus, Lycophron, Aratus (Loeb Classical Library, 1921) — the Greek text and translation used here","E. Maass, Arati Phaenomena (Berlin, 1893)","D. Kidd, Aratus: Phaenomena (Cambridge, 1997), with commentary","J. Martin, Aratos: Phénomènes (Budé, 1998)"]}},"tlg0552":{"name":"Archimedes","grc":"Ἀρχιμήδης","birth":-287,"death":-212,"floruit":null,"year":-249,"era":"hellenistic","desc":"Greek mathematician and physicist (c. 287 – c. 212 BC)","wiki":"https://en.wikipedia.org/wiki/Archimedes","q":"Q8739","place":"Syracuse","occ":["astronomer","engineer","military engineer","mathematician","inventor"],"nworks":13,"core":{"summary":"Archimedes of Syracuse (Ἀρχιμήδης, Archimēdēs, c. 287–212 BCE) was the greatest mathematician of antiquity. He was the son of an astronomer, Phidias, and according to Plutarch a friend and perhaps a relative of King Hieron II. He sent his discoveries as letters to mathematicians at Alexandria, among them Conon, Dositheus and Eratosthenes. During the Roman siege of Syracuse (214–212) his war machines held off the attackers for many months, and he was killed when the city fell. Cicero, as quaestor in Sicily, found his neglected tomb, marked as he had wished with a sphere inside a cylinder. The story of \"Eureka!\" in the bath comes from Vitruvius, two centuries later.\n\nHis surviving works include On the Sphere and Cylinder, which proves that a sphere has two-thirds the volume of its circumscribing cylinder, Measurement of a Circle (with its famous bounds for π), On Spirals, On Plane Equilibria, On Floating Bodies and The Sand-Reckoner. In the Sand-Reckoner he builds a number system large enough to count the grains of sand that would fill the universe, and reports Aristarchus' theory that the earth moves round the sun. The Method, in which he explains how he found results by imagined weighing before proving them rigorously, was lost until the twentieth century.\n\nArchimedes wrote in his native Doric, the dialect of Syracuse, though later copyists turned much of it into the standard Koine of mathematics. His proofs are demanding, using a rigorous method of exhaustion and double reductio ad absurdum, but his prefaces, addressed to friends, are personal and lively.","timeline":[[-287,"Born at Syracuse (c. 287)"],[-214,"Roman siege of Syracuse begins; his machines defend the city"],[-212,"Killed when Syracuse falls to Marcellus"],[-75,"Cicero, as quaestor in Sicily, rediscovers his tomb"],[530,"Eutocius of Ascalon writes commentaries on several of his works"],[950,"A manuscript of his works (Codex C) is copied at Constantinople (c. 950)"],[1229,"Codex C is scraped and reused for a prayer book, becoming the Archimedes Palimpsest"],[1269,"William of Moerbeke translates his works into Latin from two Greek manuscripts since lost"],[1544,"Editio princeps of the Greek text (Basel)"],[1906,"J. L. Heiberg identifies the palimpsest in Constantinople, recovering the Method"],[1998,"The palimpsest is sold at auction; imaging over the following decade recovers much more of the text"]],"manuscripts":"Three Byzantine manuscripts carried Archimedes to the Renaissance, and only one survives. Codex A, owned by the humanist Giorgio Valla, was lost in the sixteenth century after many copies had been made from it. Codex B, used by William of Moerbeke for his Latin translation of 1269, was lost soon after. Codex C, copied around 950, was scraped in 1229 and its leaves reused for a prayer book. J. L. Heiberg identified the faint lower text in 1906. This Archimedes Palimpsest is our only source for the Method and the Stomachion and for the Greek of On Floating Bodies, and modern multispectral imaging has recovered much of it.","variants":"Because A is lost, its text must be reconstructed from its Renaissance copies, from Moerbeke's Latin and, where it overlaps, from the palimpsest. The copyists' conversion of Archimedes' Doric into Koine means that editors must decide how far to restore his dialect. Some works in the collection are not by Archimedes in their present form: the Book of Lemmas (Liber assumptorum) survives only through an Arabic version, and the Cattle Problem is a verse puzzle attributed to him.","editions":["C. Mugler, Archimède, 4 vols (Budé, 1970–72) — the Greek text used here, with French translation","J. L. Heiberg, Archimedis Opera Omnia, 3 vols (Teubner, 2nd ed. 1910–15)","T. L. Heath, The Works of Archimedes (Cambridge, 1897; supplement on the Method, 1912)","R. Netz, The Works of Archimedes (Cambridge, 2004–), translation and commentary"]}},"tlg0620":{"name":"Archytas of Tarentum","grc":null,"birth":-430,"death":-345,"floruit":null,"year":-387,"era":"classical","desc":"4th-century BC Greek philosopher, mathematician, astronomer and statesman","wiki":"https://en.wikipedia.org/wiki/Archytas","q":"Q202001","place":"Tarentum","occ":["engineer","politician","mathematician","philosopher"],"nworks":1},"tlg0719":{"name":"Aretaeus of Cappadocia","grc":null,"birth":100,"death":200,"floruit":null,"year":150,"era":"imperial","desc":"2nd century Greek physician","wiki":"https://en.wikipedia.org/wiki/Aretaeus_of_Cappadocia","q":"Q505931","place":"Cappadocia","occ":["physician"],"nworks":4},"tlg1181":{"name":"Aristarchus of Samos","grc":null,"birth":-310,"death":-230,"floruit":null,"year":-270,"era":"hellenistic","desc":"Greek astronomer and mathematician (c.310–c.230 BC)","wiki":"https://en.wikipedia.org/wiki/Aristarchus_of_Samos","q":"Q140188","place":"Samos","occ":["astronomer"],"nworks":1},"tlg0284":{"name":"Aristides, Aelius","grc":"Αἴλιος Ἀριστείδης","birth":117,"death":null,"floruit":null,"year":153,"era":"imperial","desc":"2nd century Greek rhetorician and author","wiki":"https://en.wikipedia.org/wiki/Aelius_Aristides","q":"Q354431","place":"Hadrianoi","occ":["writer","orator"],"nworks":56,"core":{"summary":"Aelius Aristides (Αἴλιος Ἀριστείδης, Ailios Aristeidēs, 117–after 180 CE) was born into a wealthy family at Hadrianoi in Mysia, in north-western Asia Minor, and trained as an orator at Smyrna and Athens. In 143/4, on a journey to Rome, he fell seriously ill. For the rest of his life he suffered from a series of illnesses and spent long periods at the sanctuary of the healing god Asclepius at Pergamum. His Sacred Tales (Ἱεροὶ λόγοι, Hieroi logoi), begun around 171, record the dreams, treatments and revelations he received from the god. They are one of the most personal documents of ancient religion.\n\nAristides was the most admired orator of his age and, for Byzantine readers, a classic second only to Demosthenes. His speech To Rome (Oration 26) is the fullest praise of the Roman empire written by a Greek, and his Panathenaic Oration (1) celebrates the history and culture of Athens. When Smyrna was destroyed by an earthquake in 177, his appeal to Marcus Aurelius helped win imperial help for its rebuilding, and Philostratus wrote that it was no exaggeration to call Aristides Smyrna's founder. Other speeches defend oratory against Plato's attacks in the Gorgias, or were written for festivals and cities.\n\nHis Greek is strict, polished Attic, with long, elaborately balanced periods in the manner of Demosthenes and Plato. Its richness makes him demanding, but he was a model of style throughout the Byzantine centuries.","timeline":[[117,"Born at Hadrianoi in Mysia (26 November 117)"],[143,"Falls seriously ill on a journey to Rome (143/4)"],[145,"Begins long stays at the Asclepieion of Pergamum"],[155,"To Rome (Oration 26), his praise of the empire (c. 143–155)"],[171,"Begins writing the Sacred Tales"],[177,"Appeals to Marcus Aurelius after the earthquake at Smyrna"],[181,"Dies, some time after 180"],[1517,"Editio princeps (Florence, Giunta)"]],"manuscripts":"Aristides was a school author in Byzantium and survives in a very large number of manuscripts, many with scholia. The corpus is divided into several groups of speeches with different traditions, and some manuscripts go back to the tenth century. A few speeches under his name, such as the Art of Rhetoric, are not his.","variants":"The numbering of the speeches differs between the old edition of Dindorf and the modern ones of Keil and of Lenz and Behr, so references need care. The authenticity of a few speeches, including some addressed to cities, is disputed. The Art of Rhetoric printed in Spengel's Rhetores Graeci is spurious.","editions":["W. Dindorf, Aristides, 3 vols (Leipzig, 1829) — the Greek text used here for the speeches","L. Spengel, Rhetores Graeci II (Teubner, 1854) — the text of the Art of Rhetoric used here","B. Keil, Aelii Aristidis quae supersunt omnia II: Orationes XVII–LIII (Berlin, 1898)","F. W. Lenz and C. A. Behr, P. Aelii Aristidis Opera quae exstant omnia I (Leiden, 1976–80)","C. A. Behr, P. Aelius Aristides: The Complete Works, 2 vols (Leiden, 1981–86), translation","M. Trapp, Aelius Aristides: Orations (Loeb Classical Library, 2017–)"]}},"tlg1188":{"name":"Aristocles of Messene","grc":null,"birth":200,"death":null,"floruit":null,"year":240,"era":"imperial","desc":"1st-century AD Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Aristocles_of_Messene","q":"Q666667","place":"Messana","occ":["philosopher"],"nworks":1},"tlg1193":{"name":"Ariston of Chios","grc":null,"birth":null,"death":null,"floruit":-260,"year":-260,"era":"hellenistic","desc":"ancient Greek stoic philosopher","wiki":"https://en.wikipedia.org/wiki/Aristo_of_Chios","q":"Q646951","place":"Chios","occ":["writer","philosopher"],"nworks":1},"tlg1194":{"name":"Aristonicus of Alexandria","grc":null,"birth":null,"death":null,"floruit":-20,"year":-20,"era":"imperial","desc":"ancient Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Aristonicus_of_Alexandria","q":"Q3622711","place":"Alexandria","occ":["grammarian"],"nworks":1},"tlg0019":{"name":"Aristophanes","grc":"Ἀριστοφάνης","birth":-446,"death":-386,"floruit":null,"year":-415,"era":"classical","desc":"Classical Athenian comic playwright (c. 446 – c. 386 BC)","wiki":"https://en.wikipedia.org/wiki/Aristophanes","q":"Q43353","place":"Athens","occ":["writer","poet","playwright","comedy writer"],"nworks":11,"core":{"summary":"Aristophanes (Ἀριστοφάνης, Aristophanēs, c. 446–c. 386 BCE) is the only poet of Athenian Old Comedy whose plays survive whole. He wrote about forty comedies, and eleven survive, from the Acharnians (425 BCE) to Wealth (388 BCE). His first plays were produced through other men, and his attack on the demagogue Cleon in the lost Babylonians (426) led Cleon to denounce him before the Council. Plato gives him a memorable speech in the Symposium: the myth of the split humans who spend their lives looking for their other halves.\n\nOld Comedy was a public, political art. Aristophanes' plays mix fantastic plots (a private peace treaty, a city in the clouds built by birds, a sex strike to end the war, a journey to the underworld to bring back a tragedian) with personal abuse of living Athenians, obscenity, parody of tragedy, and choral lyric of real beauty. At the centre of most plays stands the parabasis (παράβασις, parabasis, \"stepping forward\"), where the chorus turns to address the audience directly, often in the poet's own voice. The Clouds' portrait of Socrates as a sophist and star-gazer is one of the prejudices Plato's Socrates says he must answer at his trial (Apology 19c).\n\nHis Greek is the living Attic of the Athenian street, turned in an instant into mock-tragic grandeur or lyric. He coins words freely: the birds' city is Νεφελοκοκκυγία (Nephelokokkygia, \"Cloudcuckooland\", Birds 819), and the frogs sing βρεκεκεκὲξ κοὰξ κοάξ (brekekekex koax koax, Frogs 209). The constant jokes about contemporaries make a commentary essential, and the rewards are great.","timeline":[[-446,"Born in Athens (c. 446 BCE), of the deme Cydathenaeum"],[-427,"Banqueters, his first play, produced through Callistratus; second prize"],[-426,"Babylonians (lost); Cleon denounces him before the Council"],[-425,"Acharnians wins first prize at the Lenaia"],[-424,"Knights, an attack on Cleon and his first play produced in his own name; first prize"],[-423,"Clouds places third; the version we read is a partial revision"],[-421,"Peace, staged just before the Peace of Nicias"],[-414,"Birds"],[-411,"Lysistrata and Women at the Thesmophoria"],[-405,"Frogs wins first prize and, uniquely, is performed a second time because of its parabasis"],[-391,"Assemblywomen (c. 391)"],[-388,"Wealth, his last surviving play"],[-386,"Dies (c. 386)"],[1498,"Aldine editio princeps of nine plays, edited by Marcus Musurus"],[1516,"Giunta prints Lysistrata and Women at the Thesmophoria for the first time"]],"manuscripts":"All eleven plays survive together in only one medieval manuscript, the Ravenna codex (Ravennas 429, R, mid-tenth century). It is also our only medieval witness for Women at the Thesmophoria and for about a quarter of Lysistrata. The Venetus (Marcianus gr. 474, V, eleventh or twelfth century) contains seven plays. Wealth, Clouds and Frogs formed the Byzantine school 'triad' and survive in a great many copies.\n\nThe plays come with rich ancient commentaries (scholia), which go back to Alexandrian scholarship and to later commentators such as Didymus and Symmachus. Papyri add fragments of the lost plays.","variants":"Many of the problems are practical. Ancient copies marked a change of speaker only with a dash or a double point, so editors must decide who says which line, and editions often differ. The Clouds we have is a partial revision of the play that failed in 423; an ancient summary (hypothesis) says the revision was never finished, which explains some inconsistencies. Several dates and prizes are known only from these summaries. Nearly a thousand fragments of the lost plays survive in quotations and papyri.","editions":["F. W. Hall and W. M. Geldart, Aristophanis Comoediae, 2 vols (OCT, 1906–07) — the Greek text used here","W. J. Hickie, The Comedies of Aristophanes (Bohn, 1853), and an anonymous version in The Complete Greek Drama (1938) — the translations used here for the Clouds and the Birds","N. G. Wilson, Aristophanis Fabulae, 2 vols (OCT, 2007)","J. Henderson, Aristophanes, 5 vols (Loeb Classical Library, 1998–2007), including the fragments","R. Kassel and C. Austin, Poetae Comici Graeci III.2: Aristophanes (1984), the standard edition of the fragments","K. J. Dover's commentaries on the Clouds (1968) and Frogs (1993); A. H. Sommerstein's editions with translation and commentary (1980–2002)"]}},"tlg0644":{"name":"Aristophanes of Byzantium","grc":null,"birth":-257,"death":-180,"floruit":null,"year":-218,"era":"hellenistic","desc":"third-century BC Greek literary scholar and grammarian in Alexandria","wiki":"https://en.wikipedia.org/wiki/Aristophanes_of_Byzantium","q":"Q313018","place":"Byzantium","occ":["librarian","editor","linguist","lexicographer","grammarian"],"nworks":1},"tlg0086":{"name":"Aristotle","grc":"Ἀριστοτέλης","birth":-384,"death":-322,"floruit":null,"year":-352,"era":"classical","desc":"Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Aristotle","q":"Q868","place":"Stagira","occ":["philosopher"],"nworks":48,"core":{"summary":"Aristotle (Ἀριστοτέλης, Aristotelēs, 384–322 BCE) came from Stagira in Chalcidice, in northern Greece; his father Nicomachus was physician to the king of Macedon. He studied and taught in Plato's Academy for twenty years, served as tutor to the young Alexander the Great, and then taught at Athens in the Lyceum, a public gymnasium, where his school (later called the Peripatetic) took shape. Few thinkers have ranged so widely. He wrote on logic, physics, biology, the soul, metaphysics, ethics, politics, rhetoric and poetry, and in many of these fields his work was the starting point for everyone who came after.\n\nWhat survives is mostly his teaching material: compressed, technical treatises written for use in the school. The polished dialogues that ancient readers admired, and that Cicero praised for their \"golden stream of speech\", are lost except for fragments. His Greek can therefore feel abrupt, but it is precise, and he builds technical terms out of ordinary words: τὸ τί ἦν εἶναι (to ti ēn einai, literally \"the what-it-was-to-be\") is his phrase for a thing's essence. His vocabulary, ἐνέργεια (energeia, \"activity, actuality\"), οὐσία (ousia, \"being, substance\"), τέλος (telos, \"end, goal\") and many more, became the working language of philosophy for two thousand years, first in Greek and then, through Syriac, Arabic and Latin translations, across the medieval world.","timeline":[[-384,"Born at Stagira in Chalcidice"],[-367,"Enters Plato's Academy at seventeen"],[-347,"Leaves Athens around the time of Plato's death; years at Assos and on Lesbos, where much of his biological research was done"],[-343,"Tutor to Alexander at the Macedonian court"],[-335,"Returns to Athens and teaches at the Lyceum"],[-323,"Death of Alexander; facing hostility in Athens, Aristotle withdraws to Chalcis"],[-322,"Dies at Chalcis"],[-60,"Andronicus of Rhodes (active in the first century BCE; his exact date is disputed) arranges the school treatises in an edition that shaped the corpus as we have it"],[850,"Ninth and tenth centuries: many of the treatises are translated into Arabic in Baghdad, often by way of Syriac"],[1495,"Aldine editio princeps of the Greek Aristotle, 5 vols (1495–98)"],[1831,"Immanuel Bekker's Berlin Academy edition; its page, column and line numbers are the standard citation system"],[1891,"F. G. Kenyon publishes the Constitution of the Athenians from a newly identified British Museum papyrus"]],"manuscripts":"According to Strabo and Plutarch, Aristotle's own library passed to his successor Theophrastus and then to Neleus of Scepsis, whose heirs hid it in a cellar; it was rediscovered in the first century BCE and taken to Rome by Sulla. There Andronicus of Rhodes edited the school treatises and gave the corpus the shape it still has. The story is dramatic and probably simplified: some of the treatises were known in the Hellenistic period, and another tradition says Neleus sold his books to the library at Alexandria.\n\nOver a thousand medieval manuscripts of Aristotle survive, the oldest from the ninth and tenth centuries. For the Nicomachean Ethics, the work most readers start with, the main witnesses are a tenth-century manuscript in Florence (Laurentianus 81.11, Kb), a twelfth-century one in Paris (Parisinus gr. 1854, Lb) and a fifteenth-century one in Venice (Marcianus gr. 213, Mb). Robert Grosseteste's Latin translation (around 1246) is also valuable, because it was made from a Greek manuscript older than most of those that survive. The Poetics hangs by a thinner thread: one Greek manuscript of the tenth or eleventh century (Parisinus gr. 1741), a second, later one, William of Moerbeke's Latin translation (1278) and a tenth-century Arabic version made from a Syriac one, which is included in this collection.","variants":"Three books of the Nicomachean Ethics (5–7) are word for word the same as three books of the Eudemian Ethics (4–6), and scholars still disagree about which work they first belonged to. The Nicomachean Ethics also discusses pleasure twice, in 7.11–14 and again in 10.1–5, which some take as a sign that it combines separate courses of lectures. The Constitution of the Athenians, a work of Aristotle's school whether or not he wrote it himself, was lost until a papyrus copy was identified in the British Museum in 1890.\n\nNot everything under Aristotle's name is his. Among the works in this collection, the Mechanica, Problemata, Physiognomonica, De coloribus, De audibilibus, Mirabilium auscultationes, Economics, the Letters and the Divisiones are generally regarded as the work of his school or of later writers, and the Magna Moralia is disputed. The Greek De plantis is a curiosity: it is a medieval translation back into Greek of a Latin version, itself made from Arabic, of a work by Nicolaus of Damascus. Bekker's Berlin edition has long been superseded as a text, but its page, column and line numbers (such as 1094a1, the opening of the Nicomachean Ethics) are still how every passage of Aristotle is cited.","editions":["I. Bywater, Aristotelis Ethica Nicomachea (OCT, 1894) — the Nicomachean Ethics text used here","H. Rackham, Aristotle: Nicomachean Ethics (Loeb Classical Library, 1926; rev. 1934) — the translation used here","W. D. Ross's Oxford texts of the Metaphysics (1924), Physics, De anima, Politics, Rhetoric and Analytics, and R. Kassel's Poetics (OCT, 1965) — the texts used here for those works","I. Bekker, Aristotelis Opera, 5 vols (Berlin, 1831–70); its Oxford reprint (1837) supplies many of the other texts here","R. A. Gauthier and J. Y. Jolif, L'Éthique à Nicomaque, 2nd ed. (Louvain, 1970), with commentary","J. Barnes (ed.), The Complete Works of Aristotle: The Revised Oxford Translation, 2 vols (Princeton, 1984)"]}},"tlg0088":{"name":"Aristoxenus","grc":null,"birth":-360,"death":-300,"floruit":null,"year":-330,"era":"classical","desc":"4th century BC Greek Peripatetic philosopher and musicologist","wiki":"https://en.wikipedia.org/wiki/Aristoxenus","q":"Q335156","place":"Tarentum","occ":["mathematician","philosopher","musicologist","music theorist"],"nworks":1},"tlg0529":{"name":"Arius Didymus","grc":null,"birth":-83,"death":null,"floruit":null,"year":-43,"era":"hellenistic","desc":"1st century BCE Greek Stoic philosopher","wiki":"https://en.wikipedia.org/wiki/Arius_Didymus","q":"Q641051","place":"Alexandria","occ":["philosopher"],"nworks":1},"tlg0074":{"name":"Arrian","grc":"Ἀρριανός","birth":86,"death":160,"floruit":null,"year":137,"era":"imperial","desc":"Greek historian of Alexander, Roman senator and governor, and pupil of the Stoic Epictetus","wiki":"https://en.wikipedia.org/wiki/Arrian","q":"Q31845","place":"Nicomedia","occ":["writer","priest","military personnel","politician","historian","philosopher"],"nworks":7,"core":{"summary":"Arrian (Ἀρριανός, Arrianos; Lucius Flavius Arrianus, c. 86/89–after 145/6 CE) came from a leading family of Nicomedia in Bithynia and had a full Roman career. As a young man he studied with Epictetus at Nicopolis and took down his lectures. He entered the Roman senate, was consul around 130, and governed Cappadocia for Hadrian from about 131 to 137, where he drove back an invasion of the Alans. Late in life he lived in Athens, where he was archon in 145/6.\n\nHis Anabasis of Alexander (Ἀλεξάνδρου ἀνάβασις), in seven books, is the best surviving account of Alexander's campaigns. In the preface Arrian explains that he follows Ptolemy and Aristobulus, two officers who marched with Alexander, and that he adds other stories only as 'what is said' (λεγόμενα, legomena). His Indica, a companion piece, describes India and Nearchus' voyage home. He also published the Discourses of Epictetus and the Handbook, and wrote on hunting, tactics and a coastal survey of the Black Sea addressed to Hadrian. His histories of Alexander's successors, of Bithynia and of Parthia are lost.\n\nArrian modelled himself on Xenophon, whom he admired as soldier, philosopher and historian; the title Anabasis echoes Xenophon's, and his own writings call him a \"new Xenophon\". His Greek is clear Atticising prose in Xenophon's manner. The Indica, by contrast, is written in Ionic in imitation of Herodotus.","timeline":[[86,"Born at Nicomedia in Bithynia (c. 86/89)"],[108,"Studies with Epictetus at Nicopolis (c. 108)"],[130,"Suffect consul at Rome (c. 129/130)"],[131,"Governor of Cappadocia (c. 131–137); writes the Periplus of the Black Sea for Hadrian"],[135,"Repels the invasion of the Alans; his Order of Battle against the Alans survives"],[145,"Archon at Athens (145/6)"],[160,"Dies, some time after 145/6 (perhaps c. 160)"],[1535,"Editio princeps of the Anabasis (Venice)"],[1904,"A. G. Roos shows that all manuscripts of the Anabasis and Indica descend from one Vienna codex"]],"manuscripts":"All manuscripts of the Anabasis and the Indica descend from a single codex in Vienna (Vindobonensis hist. gr. 4, A, c. 1200), as A. G. Roos showed in 1904. It was damaged by damp in the fifteenth century, and leaves carrying part of the beginning of the Anabasis and the end of the Indica were lost; they survive only in copies made before the damage. There is also a gap in Book 7 of the Anabasis. The shorter works have separate traditions.","variants":"With one surviving archetype, gaps and corruptions in the Anabasis can be repaired only by conjecture or from the copies of A made before it was damaged. The lacuna in Book 7 has swallowed part of the narrative of Alexander's last months. Some shorter works under Arrian's name, such as the Periplus of the Erythraean Sea, are not his (see Pseudo-Arrianus).","editions":["A. G. Roos, Flavii Arriani Quae Exstant Omnia, 2 vols (Teubner, 1907–10; revised by G. Wirth, 1967–68) — the Greek text used here for the Anabasis and some minor works","R. Hercher and A. Eberhard, Arriani Nicomediensis Scripta Minora (Teubner, 1885) — the text used here for most of the minor works","P. A. Brunt, Arrian, 2 vols (Loeb Classical Library, 1976–83)","A. B. Bosworth, A Historical Commentary on Arrian's History of Alexander (Oxford, 1980–95)"]}},"tlg0045":{"name":"Artaxerxis Epistulae","grc":null,"birth":null,"death":null,"floruit":-100,"year":-100,"era":"hellenistic","desc":"royal decrees of the Persian king 'Artaxerxes' from the Greek Additions to the biblical Book of Esther (2nd–1st century BCE)","wiki":"https://en.wikipedia.org/wiki/Additions_to_Esther","q":"Q5615312","place":null,"occ":[],"nworks":1},"tlg0553":{"name":"Artemidorus","grc":null,"birth":null,"death":null,"floruit":175,"year":175,"era":"imperial","desc":"Greek professional diviner (2nd century)","wiki":"https://en.wikipedia.org/wiki/Artemidorus_of_Daldis","q":"Q445848","place":"Ephesus","occ":["writer"],"nworks":1},"tlg0556":{"name":"Asclepiodotus","grc":null,"birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"ancient Greek writer and philosopher","wiki":"https://en.wikipedia.org/wiki/Asclepiodotus_(philosopher)","q":"Q261224","place":null,"occ":["writer","philosopher","non-fiction writer"],"nworks":1},"tlg4018":{"name":"Asclepius","grc":null,"birth":null,"death":null,"floruit":540,"year":540,"era":"lateantique","desc":"Asclepius of Tralles, 6th-century Neoplatonist, pupil of Ammonius and commentator on Aristotle and Nicomachus","wiki":"https://en.wikipedia.org/wiki/Asclepius_of_Tralles","q":"Q732098","place":"Tralles","occ":["philosopher","mathematician"],"nworks":1},"tlg0615":{"name":"Aspasius","grc":null,"birth":80,"death":150,"floruit":null,"year":115,"era":"imperial","desc":"2nd-century Greek philosopher and author","wiki":"https://en.wikipedia.org/wiki/Aspasius","q":"Q735515","place":null,"occ":["philosopher"],"nworks":1},"tlg2035":{"name":"Athanasius of Alexandria","grc":"Ἀθανάσιος","birth":296,"death":373,"floruit":null,"year":334,"era":"lateantique","desc":"bishop of Alexandria (328–373), theologian and opponent of Arianism","wiki":"https://en.wikipedia.org/wiki/Athanasius_of_Alexandria","q":"Q44024","place":"Alexandria","occ":["bishop","theologian","writer"],"nworks":6,"core":{"summary":"Athanasius of Alexandria (Ἀθανάσιος, Athanasios, c. 296–373 CE) attended the Council of Nicaea in 325 as a deacon and secretary to his bishop, Alexander, and succeeded him as bishop of Alexandria in 328. For the next forty-five years he was the leading champion of the Nicene creed against Arius and his followers, who held that the Son was a created being. His opponents were powerful, and he was exiled five times, under Constantine, Constantius II, Julian and Valens, spending some seventeen years away from his see, at one point hidden among the monks of the Egyptian desert.\n\nHis early double treatise Against the Pagans and On the Incarnation of the Word explains why God became man. The Orations against the Arians (the fourth, included here, is not his) and On the Decrees of the Council of Nicaea defend the Nicene faith. His Life of Antony, the story of the Egyptian hermit, became one of the most influential books of the Christian world and a model for all later saints' lives. His Festal Letter of 367 is the first surviving list of the twenty-seven books of the New Testament.\n\nAthanasius writes a clear, direct Greek, forceful in argument and sparing in rhetoric. On the Incarnation is short, accessible and a good introduction to the theological language of the fourth century.","timeline":[[296,"Born at Alexandria (c. 296–298)"],[325,"Attends the Council of Nicaea as a deacon"],[328,"Becomes bishop of Alexandria"],[335,"First exile, to Trier, under Constantine"],[339,"Second exile, in Rome (339–346)"],[356,"Third exile, hiding among the monks of Egypt (356–362)"],[357,"Life of Antony (c. 357)"],[362,"Fourth exile, under Julian"],[367,"Festal Letter 39 lists the 27 books of the New Testament"],[373,"Dies at Alexandria"]],"manuscripts":"Athanasius' works survive in many manuscripts, gathered into several ancient and Byzantine collections that differ in content and order. Some works were preserved because they were included in collections of documents on the Arian controversy. Many works falsely attributed to him also circulated under his name.","variants":"The date of Against the Pagans and On the Incarnation is disputed, some placing it before 325 and others in the 330s. The fourth Oration against the Arians and many smaller works in the corpus are not his. The documents he quotes in his apologetic works raise questions of their own, since he selected them to support his case.","editions":["A. Robertson, St Athanasius on the Incarnation (London, 1893), and W. Bright, The Orations of St Athanasius against the Arians (Oxford, 1884) — the Greek texts used here","G. Loeschcke and M. Heinemann, Gelasius Kirchengeschichte (Leipzig, 1918) — the source of one text used here","H.-G. Opitz and others, Athanasius Werke (Berlin, 1934–)","R. W. Thomson, Athanasius: Contra Gentes and De Incarnatione (Oxford, 1971)"]}},"tlg0008":{"name":"Athenaeus of Naucratis","grc":"Ἀθήναιος","birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"late 2nd/early 3rd century Greek rhetorician and grammarian","wiki":"https://en.wikipedia.org/wiki/Athenaeus","q":"Q294923","place":"Naucratis","occ":["writer","grammarian"],"nworks":1,"core":{"summary":"Athenaeus of Naucratis (Ἀθήναιος, Athēnaios, fl. c. 200 CE) came from a Greek city in the Nile Delta and lived in Rome. His one surviving work, the Deipnosophistae (Δειπνοσοφισταί, Deipnosophistai, \"The Learned Banqueters\"), was written soon after the death of Commodus in 192. It survives in fifteen books, some only in an abridged form.\n\nThe work describes a series of dinners given by a wealthy Roman, Larensis, for a company of scholars, poets, philosophers, lawyers and doctors, among them a character named Galen. The guests discuss everything that appears at a Greek banquet: fish, bread, wine, cups, cooks, music, dancing, courtesans, parasites and luxury. Every point is supported by quotations from earlier literature. Athenaeus quotes more than a thousand authors and many thousands of lines of verse, most of them from works now lost, especially Middle and
