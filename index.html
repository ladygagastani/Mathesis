s three books can be recovered in any detail.","editions":["W. C. Wright, The Works of the Emperor Julian, 3 vols (Loeb Classical Library, 1913–23) — the Greek text and translation used here","J. Bidez, G. Rochefort and C. Lacombrade, L'Empereur Julien: Œuvres complètes (Budé, 1924–64)","J. Bidez and F. Cumont, Imp. Caesaris Flavii Claudii Iuliani Epistulae, Leges, Poematia, Fragmenta Varia (Paris, 1922)","E. Masaracchia, Giuliano Imperatore: Contra Galilaeos (Rome, 1990)"]}},"tlg0542":{"name":"Julius Pollux","grc":null,"birth":null,"death":238,"floruit":180,"year":180,"era":"imperial","desc":"2nd century Greek grammarian and sophist","wiki":"https://en.wikipedia.org/wiki/Julius_Pollux","q":"Q548104","place":"Naucratis","occ":["writer","sophist","philosopher","orator","philologist","lexicographer"],"nworks":1},"tlg0645":{"name":"Justin Martyr","grc":"Ἰουστῖνος","birth":100,"death":165,"floruit":null,"year":132,"era":"imperial","desc":"2nd century CE Christian apologist and martyr","wiki":"https://en.wikipedia.org/wiki/Justin_Martyr","q":"Q185117","place":"Flavia Neapolis","occ":["apologist","theologian","philosopher"],"nworks":3,"core":{"summary":"Justin Martyr (Ἰουστῖνος, Ioustinos, c. 100–c. 165 CE) was born at Flavia Neapolis in Samaria, in a pagan family. In the opening of his Dialogue with Trypho he describes his search for truth among Stoic, Peripatetic, Pythagorean and Platonist teachers, and his conversion after a conversation with an old man by the sea. He taught Christianity as a philosophy in Rome, wearing the philosopher's cloak. Around 165 he was tried with several of his students before the city prefect Junius Rusticus, a Stoic and a teacher of Marcus Aurelius, and executed. An account of the trial survives.\n\nHis First Apology (c. 150–155), addressed to the emperor Antoninus Pius and his sons, defends Christians against popular charges and argues that the divine Word (λόγος, logos) had been partly known to all people through the 'seeds of the Word' (λόγος σπερματικός, logos spermatikos), and fully revealed in Christ. It contains the earliest detailed description of Christian worship and baptism. The shorter Second Apology responds to a particular case of persecution. The Dialogue with Trypho, an argument with a Jewish teacher, is the earliest surviving Christian work written in dialogue with Judaism.\n\nJustin's Greek is plain and sometimes awkward Koine, the language of an educated convert rather than a trained stylist. He is a key figure in the meeting of Christianity and Greek philosophy.","timeline":[[100,"Born at Flavia Neapolis in Samaria (c. 100)"],[130,"Converts to Christianity (c. 130)"],[150,"First Apology, addressed to Antoninus Pius (c. 150–155)"],[160,"Dialogue with Trypho (c. 155–160)"],[165,"Tried before Junius Rusticus and executed at Rome (c. 165)"],[1364,"The only surviving manuscript of his works is copied (Parisinus gr. 450)"],[1551,"Editio princeps (Paris, Robert Estienne)"]],"manuscripts":"The Apologies and the Dialogue survive in a single manuscript, Parisinus gr. 450, completed on 11 September 1364. All other copies derive from it. The Dialogue has a large gap, and the text of all three works is often corrupt.","variants":"With one late manuscript, editors have had to correct many passages by conjecture. The relation of the two Apologies is debated: the Second may be an appendix to the First rather than a separate work. Several works transmitted under Justin's name, such as the Letter to Diognetus and the Exhortation to the Greeks, are not his.","editions":["G. Rauschen, S. Iustini Apologiae duae (Bonn, 1911), and G. Archambault, Justin: Dialogue avec Tryphon (Paris, 1909) — the Greek texts used here","M. Marcovich, Iustini Martyris Apologiae pro Christianis (Berlin, 1994) and Dialogus cum Tryphone (1997)","D. Minns and P. Parvis, Justin, Philosopher and Martyr: Apologies (Oxford, 2009)","C. Munier, Justin: Apologie pour les chrétiens (Sources Chrétiennes 507, 2006)"]}},"tlg0649":{"name":"Lesbonax (Rhetorician)","grc":null,"birth":null,"death":200,"floruit":null,"year":170,"era":"imperial","desc":"Greek rhetor","wiki":"https://en.wikipedia.org/wiki/Lesbonax","q":"Q1129405","place":"Mytilene","occ":["philosopher","orator"],"nworks":2},"tlg2200":{"name":"Libanius","grc":"Λιβάνιος","birth":314,"death":393,"floruit":null,"year":353,"era":"lateantique","desc":"Greek rhetorician (4th century AD)","wiki":"https://en.wikipedia.org/wiki/Libanius","q":"Q263892","place":"Antioch","occ":["writer","rhetorician"],"nworks":103,"core":{"summary":"Libanius (Λιβάνιος, Libanios, 314–c. 393 CE) was born at Antioch in Syria to a wealthy family. He studied at Athens (336–340), taught with great success at Constantinople and Nicomedia, and in 354 returned to Antioch as the city's official sophist, the head of its school of rhetoric. He held the post for the rest of his life. A committed pagan in an increasingly Christian empire, he admired the emperor Julian, whom he never met as a pupil but influenced through his writings, and he mourned Julian's death in a series of speeches. Among his students, according to later tradition, were Christian leaders such as John Chrysostom.\n\nMore of Libanius' work survives than of almost any other ancient Greek author. There are sixty-four speeches, including an Autobiography (Oration 1), the funeral speech for Julian (18) and a plea to the emperor Theodosius to protect the temples (30). There are also fifty-one declamations (model speeches on historical and mythical themes), a set of rhetorical exercises, summaries of Demosthenes' speeches, and more than 1,500 letters, the largest collection of letters to survive from antiquity. Together they give an unrivalled picture of a Greek city, its schools, its council and its politics in the fourth century.\n\nLibanius wrote pure Attic modelled on Demosthenes and the classical authors, avoiding the language of his own day. His letters are short, elegant and allusive, and his school texts were read and imitated in Byzantium for a thousand years.","timeline":[[314,"Born at Antioch"],[336,"Studies at Athens (336–340)"],[340,"Teaches at Constantinople and Nicomedia"],[354,"Returns to Antioch as its official sophist"],[362,"Meets the emperor Julian at Antioch"],[363,"Julian's death; Libanius writes speeches of mourning, including the Funeral Oration (18)"],[374,"Writes the first version of his Autobiography (Oration 1)"],[386,"For the Temples (Oration 30), addressed to Theodosius (c. 386)"],[393,"Dies (c. 393)"]],"manuscripts":"Libanius was a Byzantine school author and survives in a very large number of manuscripts. The speeches, declamations, exercises and letters each have their own traditions. The letters come down in several collections that preserve them in different orders.","variants":"Many works transmitted under his name are not his, especially among the declamations and exercises, which attracted imitations. The correspondence with Basil of Caesarea is partly of doubtful authenticity. Dating the letters, which are essential for the history of the period, depends on reconstructing their order from the collections.","editions":["R. Foerster, Libanii Opera, 12 vols (Teubner, 1903–27) — the Greek text used here","A. F. Norman, Libanius: Selected Orations and Autobiography, 4 vols (Loeb Classical Library, 1969–92)","A. F. Norman, Libanius' Autobiography (Oration I) (Oxford, 1965)","S. Bradbury, Selected Letters of Libanius from the Age of Constantius and Julian (Liverpool, 2004)","R. Cribiore, The School of Libanius in Late Antique Antioch (Princeton, 2007)"]}},"tlg1463":{"name":"Liber Enoch","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Greek fragments of 1 Enoch, a Jewish apocalyptic work (3rd–1st century BCE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0560":{"name":"Longinus","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"unknown author of the treatise On the Sublime, probably 1st century CE","wiki":null,"q":"Q744540","place":null,"occ":["writer","literary critic"],"nworks":1},"tlg0561":{"name":"Longus","grc":"Λόγγος","birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"Greek novelist, author of Daphnis and Chloe (2nd or 3rd century CE)","wiki":"https://en.wikipedia.org/wiki/Longus","q":"Q314949","place":"Lesbos","occ":["writer"],"nworks":1,"core":{"summary":"Longus (Λόγγος, Longos, probably late 2nd or early 3rd century CE) is known only from his novel. His name is Roman, and inscriptions show that it was used on Lesbos, where the novel is set; that is all we can say about him.\n\nDaphnis and Chloe (Ποιμενικὰ τὰ κατὰ Δάφνιν καὶ Χλόην, Poimenika ta kata Daphnin kai Chloēn, \"Pastoral Tales of Daphnis and Chloe\"), in four books, begins with the narrator seeing a painting in a grove of the Nymphs on Lesbos and deciding to write a story to match it. Two foundlings, raised by a goatherd and a shepherd, grow up together in the countryside and slowly discover love through the cycle of the seasons, without understanding what it is. After pirates, a war between cities and the lessons of an older neighbour, they are recognised by their wealthy parents and married. Unlike the other Greek novels, it keeps to a single small world, and its charm is in its landscape and its gently ironic narrator.\n\nLongus writes a deliberately 'simple' style (ἀφέλεια, apheleia, \"simplicity\"): short, balanced, rhythmic clauses with frequent echoes of sound. The simplicity is highly artful and full of allusions to Theocritus and the pastoral poets. Jacques Amyot's French translation (1559) made the novel famous in Europe, and it has inspired painters, Goethe, and Ravel's ballet (1912).","timeline":[[200,"Daphnis and Chloe written (probably late 2nd or early 3rd century)"],[1250,"The Florentine manuscript, which alone preserves a passage of Book 1, is copied (13th century)"],[1559,"Jacques Amyot's French translation"],[1598,"Editio princeps of the Greek text (Florence)"],[1809,"Paul-Louis Courier finds the missing passage in the Florentine manuscript and spills ink over it"],[1810,"Courier publishes the first complete text"],[1912,"Ravel's ballet Daphnis et Chloé"]],"manuscripts":"Daphnis and Chloe survives in two independent manuscripts, the thirteenth-century Laurentianus Conventi Soppressi 627 in Florence (F) and a later Vatican manuscript (V), and in copies of the latter. All the other copies share a gap in Book 1 (1.12.4–1.17.4). The missing lines are preserved only in F, where Paul-Louis Courier found them in 1809. While copying them he upset an inkstand over the page, and the resulting quarrel with the librarian forced him to leave Tuscany.","variants":"Where F and the Vatican manuscript disagree, editors must choose between them, and they sometimes differ significantly. The passage recovered by Courier can now be read only through his transcription and what remains visible beneath the ink. The date of the novel is uncertain within the late second and early third centuries.","editions":["R. Hercher, Erotici Scriptores Graeci, vol. 1 (Teubner, 1858) — the Greek text used here","M. D. Reeve, Longus: Daphnis et Chloe (Teubner, 1982; 3rd ed. 1994)","J.-R. Vieillefond, Longus: Pastorales (Budé, 1987)","J. Henderson, Longus: Daphnis and Chloe; Xenophon of Ephesus: Anthia and Habrocomes (Loeb Classical Library, 2009)","J. R. Morgan, Longus: Daphnis and Chloe (Oxford, 2004), with translation and commentary"]}},"tlg0062":{"name":"Lucian of Samosata","grc":"Λουκιανός","birth":125,"death":null,"floruit":null,"year":150,"era":"imperial","desc":"2nd-century satirist and rhetorician from Roman Syria, writing in Greek","wiki":"https://en.wikipedia.org/wiki/Lucian","q":"Q177847","place":"Samosata","occ":["writer","poet","biographer","philosopher","satirist"],"nworks":71,"core":{"summary":"Lucian (Λουκιανός, Loukianos, c. 125–after 180 CE) came from Samosata on the Euphrates, in Roman Syria. Greek was probably not his first language: in The Double Indictment he has Rhetoric recall that she found him still \"a barbarian in speech\", dressed in the Assyrian manner. He mastered Greek so completely that he became one of the most elegant writers of his age, working first as a travelling lecturer and later settling in Athens.\n\nHe wrote some eighty works: satirical dialogues, essays, parodies and comic fantasies. The Dialogues of the Dead and Dialogues of the Gods poke fun at myth; Philosophies for Sale auctions off the great philosophers as slaves; and the True History, a mock travel tale that visits the Moon and the inside of a whale, is one of the ancestors of science fiction. His targets are pretension of every kind: pompous philosophers, credulous believers, fake prophets (Alexander the False Prophet) and bad historians (How to Write History).\n\nHe belongs to the Second Sophistic, when educated Greeks wrote in the Attic of five centuries before, and he both practised and mocked this fashion. In the Lexiphanes he ridicules a show-off crammed with obsolete words, and in the Judgement of the Vowels the letter Sigma sues Tau for stealing words like θάλασσα (thalassa, \"sea\"), which Attic spells θάλαττα. His clear, witty Attic kept him on school reading lists into the twentieth century.","timeline":[[125,"Born at Samosata on the Euphrates, c. 125"],[150,"Career as a travelling rhetorician in Ionia, Greece, Italy and Gaul"],[165,"Settles in Athens; the great dialogues"],[165,"Watches the Cynic Peregrinus burn himself to death at the Olympic Games, later the subject of a satire"],[175,"Takes an administrative post in Roman Egypt"],[180,"Dies after this date"],[1496,"Editio princeps (Florence)"],[1506,"Erasmus and Thomas More publish Latin translations of several dialogues, making Lucian a favourite of Renaissance humanists"]],"manuscripts":"Well over a hundred manuscripts survive, in two families: the γ family, led by Vaticanus gr. 90 (Γ, tenth century) and Harleianus 5694 in the British Library (E, tenth century, written for the scholar Arethas of Caesarea and annotated by him), and the β family, led by Vindobonensis phil. gr. 123 in Vienna (B, eleventh century). Papyri are few, but they confirm that the collection is ancient.","variants":"Several works in the collection are not by Lucian: the Amores; Lucius or the Ass, a summary of the lost Greek story that also lies behind Apuleius' Golden Ass; the Philopatris, a Byzantine work of the tenth century; and others. The differences between the two families are mostly small, but scribes sometimes 'corrected' Lucian's deliberate Atticisms.","editions":["A. M. Harmon, K. Kilburn, M. D. Macleod, Lucian, 8 vols (Loeb Classical Library, 1913–67) — the main Greek text and translation used here","K. Jacobitz, Luciani Samosatensis Opera (Teubner) — the Greek text used here for other works","H. W. and F. G. Fowler, The Works of Lucian of Samosata, 4 vols (Oxford, 1905), and E. J. Smith, Selections from Lucian (1892) — other translations used here","M. D. Macleod, Luciani Opera, 4 vols (OCT, 1972–87), the standard critical text","J. Bompaire and others, Lucien: Œuvres (Budé, 1993–)"]}},"tlg0341":{"name":"Lycophron","grc":null,"birth":-320,"death":-280,"floruit":null,"year":-300,"era":"hellenistic","desc":"Hellenistic poet to whom the Alexandra is attributed; traditionally 3rd century BCE, though some date the poem c. 190 BCE","wiki":"https://en.wikipedia.org/wiki/Lycophron","q":"Q432737","place":"Chalcis","occ":["writer","poet","tragedy writer"],"nworks":1},"tlg0034":{"name":"Lycurgus","grc":"Λυκοῦργος","birth":-390,"death":-324,"floruit":null,"year":-357,"era":"classical","desc":"4th century BCE Greek politician and orator","wiki":"https://en.wikipedia.org/wiki/Lycurgus_of_Athens","q":"Q373685","place":"Athens","occ":["writer","politician","orator"],"nworks":1,"core":{"summary":"Lycurgus (Λυκοῦργος, Lykourgos, c. 390–324 BCE) belonged to the Eteoboutadae, an ancient priestly family of Athens. After the Athenian defeat at Chaeronea in 338 he controlled the city's finances for twelve years and presided over a great programme of rebuilding. The theatre of Dionysus was rebuilt in stone, a stadium was built for the Panathenaic games, the fleet and arsenals were renewed, and official copies of the plays of Aeschylus, Sophocles and Euripides were deposited in the city archives. He was known for his personal austerity and his severity as a prosecutor. After his death his friend Stratocles carried a decree (307/6) honouring him with a bronze statue; an inscribed copy survives.\n\nOf fifteen speeches known in antiquity, only one survives: Against Leocrates (331/0). Lycurgus prosecuted Leocrates for treason because he had fled Athens after Chaeronea, when the city was in danger. The speech is less a legal argument than a sermon on patriotism. Lycurgus quotes fifty-five lines of Euripides' lost Erechtheus, the queen's speech agreeing to sacrifice her daughter for the city, together with Homer and thirty-two lines of the Spartan poet Tyrtaeus. Leocrates was acquitted on a tie vote.\n\nLycurgus' Greek is earnest and solemn, with long periods and frequent appeals to the gods and the ancestors. Stylistically he is not among the great orators, but the speech is a precious source for Athenian civic values after Chaeronea and for the poetry it quotes.","timeline":[[-390,"Born in Athens, of the priestly family of the Eteoboutadae (c. 390)"],[-336,"Takes charge of Athenian finances for twelve years (c. 336–324)"],[-331,"Against Leocrates (331/0); Leocrates is acquitted on a tie vote"],[-330,"Has official copies of the three great tragedians deposited in the archives (c. 330)"],[-324,"Dies (324)"],[-307,"Stratocles' decree honours him with a statue (307/6)"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"Against Leocrates survives mainly in the early fourteenth-century Codex Crippsianus in the British Library (Burney 95, A) and related manuscripts. Fragments of his lost speeches come from quotations in later writers, especially lexicographers, and from papyri.","variants":"The text is fairly sound, but the long poetic quotations raise problems of their own, since they must be checked against the separate traditions of Homer and Tyrtaeus. The Euripides passage survives only here, apart from papyrus fragments of the Erechtheus.","editions":["J. O. Burtt, Minor Attic Orators II: Lycurgus, Dinarchus, Demades, Hyperides (Loeb Classical Library, 1954) — the Greek text and translation used here","N. C. Conomis, Lycurgi Oratio in Leocratem (Teubner, 1970)","F. Durrbach, Lycurgue: Contre Léocrate (Budé, 1932)","J. Roisman and M. J. Edwards, Lycurgus: Against Leocrates (Oxford, 2019), with commentary"]}},"tlg0540":{"name":"Lysias","grc":"Λυσίας","birth":-445,"death":-380,"floruit":null,"year":-412,"era":"classical","desc":"Athenian orator (c. 445 – c. 380 BC)","wiki":"https://en.wikipedia.org/wiki/Lysias","q":"Q310164","place":"Athens","occ":["writer","logographer","orator"],"nworks":34,"core":{"summary":"Lysias (Λυσίας, Lysias, c. 445–c. 380 BCE) was the son of Cephalus, a wealthy Syracusan who had settled in Athens as a resident foreigner (metic). Plato set the Republic in the family's house in the Piraeus. As a young man Lysias went to the Athenian colony of Thurii in southern Italy, and he returned to Athens in 412. In 404 the oligarchy of the Thirty seized the family's property and executed his brother Polemarchus. Lysias escaped to Megara and helped fund the democrats' return; a decree making him a citizen was annulled, and he remained a metic. Ancient scholars dated his birth to 459, but most modern scholars prefer c. 445.\n\nHis fortune gone, Lysias became a logographer (λογογράφος, logographos, a professional writer of speeches for others to deliver in court). Antiquity knew some 425 speeches under his name, of which ancient critics judged 233 genuine. About thirty survive, with many fragments. Only one, Against Eratosthenes (12), in which he prosecuted one of the Thirty for his brother's death, was delivered by Lysias himself. The speech on love in Plato's Phaedrus is presented as his.\n\nAncient critics, above all Dionysius of Halicarnassus, took Lysias as the model of pure, plain Attic. His art hides itself. He writes in the everyday language of the Athenian courts and fits each speech to the character of its speaker, a skill the critics called ἠθοποιία (ēthopoiia, \"character-drawing\"). His speeches are short, clear and full of the details of daily life, which makes them a favourite first reading in Attic prose; On the Murder of Eratosthenes (1), a husband's defence for killing his wife's lover, is the classic starting point.","timeline":[[-445,"Born in Athens, son of the Syracusan metic Cephalus (ancient sources give 459)"],[-412,"Returns to Athens after the Sicilian disaster"],[-404,"The Thirty seize the family's property and execute his brother Polemarchus; Lysias escapes to Megara"],[-403,"After the democracy is restored, prosecutes Eratosthenes, one of the Thirty (speech 12); a decree granting him citizenship is annulled"],[-388,"Olympic Oration, calling on the Greeks to unite against tyranny (388 or 384)"],[-380,"Dies (c. 380)"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"Almost all the speeches depend on a single manuscript, Palatinus gr. 88 in Heidelberg (X, 13th century), and the later copies made from it. The Funeral Oration (2) and a few other pieces also circulated separately. Several speeches survive only in part because leaves were lost from X or its ancestors. Papyri and quotations, especially in Dionysius of Halicarnassus, add fragments of lost speeches.","variants":"The corpus mixes genuine speeches with others that are doubtful or spurious, among them the Funeral Oration and Against Andocides (6), whose authenticity has long been debated. With one main manuscript, corruptions often have to be repaired by conjecture. Some speeches are rhetorical exercises rather than court speeches, and several are known only from summaries or quotations.","editions":["W. R. M. Lamb, Lysias (Loeb Classical Library, 1930) — the Greek text and translation used here","C. Carey, Lysiae Orationes cum Fragmentis (OCT, 2007), the standard text","K. Hude, Lysiae Orationes (OCT, 1912)","L. Gernet and M. Bizos, Lysias: Discours, 2 vols (Budé, 1924–26)","S. C. Todd, A Commentary on Lysias, Speeches 1–11 (Oxford, 2007)"]}},"tlg0633":{"name":"Lysis","grc":null,"birth":null,"death":null,"floruit":-400,"year":-400,"era":"classical","desc":"Pythagorean philosopher of Tarentum (c. 400 BCE); the letter under his name is later","wiki":"https://en.wikipedia.org/wiki/Lysis_of_Taras","q":"Q720939","place":"Tarentum","occ":["philosopher"],"nworks":1},"tlg2583":{"name":"Manetho Astrologus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Pseudo-Manetho: astrological poems (Apotelesmatica) under the name of the Egyptian priest Manetho, composed between the 2nd and 4th centuries CE","wiki":null,"q":"Q31823656","place":null,"occ":["astrologer"],"nworks":1},"tlg2041":{"name":"Marcellus of Ankara","grc":null,"birth":285,"death":374,"floruit":null,"year":329,"era":"imperial","desc":"Bishop of Ancyra (died c. 374)","wiki":"https://en.wikipedia.org/wiki/Marcellus_of_Ancyra","q":"Q519513","place":null,"occ":["writer","presbyter"],"nworks":1},"tlg4003":{"name":"Marcianus, of Heraclea","grc":null,"birth":null,"death":null,"floruit":400,"year":400,"era":"lateantique","desc":"Ancient Greek geographer","wiki":"https://en.wikipedia.org/wiki/Marcian_of_Heraclea","q":"Q1165497","place":"Heraclea Pontica","occ":["geographer"],"nworks":3},"tlg1617":{"name":"Marcus Antonius Polemon","grc":null,"birth":90,"death":144,"floruit":null,"year":117,"era":"imperial","desc":"Greek sophist (c. 90 – 144)","wiki":"https://en.wikipedia.org/wiki/Polemon_of_Laodicea","q":"Q772775","place":"Laodicea on the Lycus","occ":["politician","philosopher"],"nworks":1},"tlg0562":{"name":"Marcus Aurelius","grc":"Μᾶρκος Αὐρήλιος","birth":121,"death":180,"floruit":null,"year":150,"era":"imperial","desc":"16th Roman Emperor from 161 to 180 and Stoic philosopher","wiki":"https://en.wikipedia.org/wiki/Marcus_Aurelius","q":"Q1430","place":"Rome","occ":["monarch","writer","emperor","politician","philosopher"],"nworks":1,"core":{"summary":"Marcus Aurelius (121–180 CE) was Roman emperor from 161 until his death, and a committed Stoic. Much of his reign was spent fighting on the Danube frontier and coping with the great plague that swept the empire, and it was there, on campaign, that he wrote much of the private notebook we call the Meditations.\n\nThe title found in the manuscripts, Τὰ εἰς ἑαυτόν (Ta eis heauton), means \"To Himself\", though it may not be his own. The twelve books were almost certainly not meant for publication. In short entries Marcus reminds himself of Stoic principles, of how brief life is, of the duty to act justly and accept what nature brings, and, in Book 1, of what he owes to the people who shaped him. Among them is his teacher Rusticus, who lent him the lecture notes of the Stoic Epictetus, the strongest single influence on the work. He wrote in Greek, the language of philosophy for an educated Roman, and the Meditations are among the most widely read works of ancient philosophy today.\n\nHis Greek is plain but compressed, full of Stoic technical terms such as τὸ ἡγεμονικόν (to hēgemonikon, \"the ruling part\" of the soul, the mind). He often addresses himself with an infinitive of instruction, as at the opening of Book 2: Ἕωθεν προλέγειν ἑαυτῷ (Heōthen prolegein heautōi, \"At dawn, tell yourself in advance …\").","timeline":[[121,"Born at Rome"],[138,"Adopted by Antoninus Pius at Hadrian's direction"],[161,"Becomes emperor jointly with Lucius Verus"],[166,"Antonine plague reaches Rome"],[170,"Marcomannic Wars; much of the Meditations is written on campaign, with notes placing parts 'among the Quadi, on the Gran' and 'at Carnuntum'"],[180,"Dies at Vindobona (Vienna) or Sirmium; the sources differ"],[900,"Arethas of Caesarea mentions owning an old, worn copy and having a new one made, the first clear evidence of the text in Byzantium"],[1559,"Editio princeps by Wilhelm Xylander at Zürich, from a Heidelberg manuscript now lost"]],"manuscripts":"The tradition is remarkably thin. Only two witnesses matter: Vaticanus gr. 1950 (A, fourteenth century), the only complete manuscript, and a lost manuscript (T) that belonged to Michael Toxites and was used by Wilhelm Xylander for the first printed edition in 1559; we know it only through that edition. Excerpts survive in Byzantine anthologies and in a manuscript at Darmstadt. The two witnesses agree closely, which suggests a single medieval source, perhaps the copy Arethas of Caesarea mentions around 900.","variants":"Because A and T go back to one ancestor, many errors cannot be corrected by comparing them, and editors must rely on conjecture; there are gaps, and some phrases make no sense as transmitted. The division into books is ancient, but the chapter numbers are early modern (Thomas Gataker, 1652). The notes placing parts of the work 'among the Quadi' and 'at Carnuntum' stand between Books 1–2 and 2–3, and it is disputed whether each belongs to the book before or after it. Many scholars think Book 1 was written separately, perhaps last.","editions":["J. H. Leopold, M. Antoninus Imperator ad se ipsum (OCT, 1908) — the text used here","J. Dalfen, Marci Aurelii Antonini ad se ipsum libri XII (Teubner, 2nd ed. 1987)","A. S. L. Farquharson, The Meditations of the Emperor Marcus Antoninus, 2 vols (Oxford, 1944), with commentary","C. R. Haines, Marcus Aurelius (Loeb Classical Library, 1916)"]}},"tlg2806":{"name":"Marcus Diaconus","grc":null,"birth":null,"death":null,"floruit":450,"year":450,"era":"lateantique","desc":"Mark the Deacon, companion of Bishop Porphyry of Gaza (c. 400) and named author of his Life; the Greek text is probably a 6th-century reworking","wiki":"https://en.wikipedia.org/wiki/Mark_the_Deacon","q":"Q3558842","place":null,"occ":["deacon"],"nworks":1},"tlg4075":{"name":"Marinus, 5th century","grc":null,"birth":440,"death":500,"floruit":485,"year":485,"era":"lateantique","desc":"5th century Neoplatonist philosopher","wiki":"https://en.wikipedia.org/wiki/Marinus_of_Neapolis","q":"Q581833","place":"Flavia Neapolis","occ":["astronomer","philosopher"],"nworks":1},"tlg2016":{"name":"Martyrium Perpetuae et Felcitatis","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Passion of Perpetua and Felicitas, account of Christian martyrs at Carthage in 203","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1484":{"name":"Martyrium Polycarpi","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"account of the martyrdom of Polycarp, bishop of Smyrna (mid-2nd century)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1486":{"name":"Matron of Pitana","grc":null,"birth":null,"death":null,"floruit":-320,"year":-320,"era":"hellenistic","desc":"Greek epic parodist of the late 4th century BCE, author of the mock-Homeric Attic Dinner","wiki":"https://en.wikipedia.org/wiki/Matron_of_Pitane","q":"Q3851977","place":"Pitane","occ":["poet"],"nworks":2},"tlg0563":{"name":"Maximus of Tyre","grc":null,"birth":null,"death":null,"floruit":180,"year":180,"era":"imperial","desc":"2nd century Greek rhetorician and philosopher","wiki":"https://en.wikipedia.org/wiki/Maximus_of_Tyre","q":"Q456649","place":"Tyre","occ":["philosopher","orator"],"nworks":1},"tlg1487":{"name":"Maximus, Astrologus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"author of an astrological poem On Initiatives (4th or 5th century)","wiki":null,"q":"Q96277072","place":null,"occ":["astrologer"],"nworks":2},"tlg0541":{"name":"Menander","grc":"Μένανδρος","birth":-342,"death":-291,"floruit":null,"year":-315,"era":"hellenistic","desc":"Athenian playwright of New Comedy","wiki":"https://en.wikipedia.org/wiki/Menander","q":"Q118992","place":"Cephisia","occ":["writer","poet","comedy writer"],"nworks":1,"core":{"summary":"Menander (Μένανδρος, Menandros, 342/1–c. 291/0 BCE) was the leading poet of Athenian New Comedy. He belonged to a well-off family of the deme Cephisia, studied with Aristotle's successor Theophrastus, and was a friend of Demetrius of Phalerum, who governed Athens for Macedon from 317 to 307. He wrote more than a hundred comedies but won only eight victories, the first with Orge (\"Anger\") in 321. Later ages rated him far above his rivals: the scholar Aristophanes of Byzantium asked, \"O Menander and life, which of you imitated the other?\"\n\nNew Comedy left politics behind. Menander's plays are comedies of manners set in ordinary households: lost children, rediscovered parents, thwarted lovers, stern fathers, clever slaves, soldiers and courtesans, all brought to a happy ending. The chorus has shrunk to musical interludes between five acts. Through the Roman adaptations of Plautus and Terence his plots shaped European comedy from Shakespeare to Molière.\n\nNone of his plays survived the Middle Ages. Most of what we can read today was recovered from Egyptian papyri in the twentieth century: large parts of the Arbitration, the Girl Who Gets Her Hair Cut Short and the Samian Woman from the Cairo codex (published 1907), and the complete Dyskolos (\"The Bad-Tempered Man\") from a Bodmer papyrus published in 1958. His Greek is the natural Attic conversation of his day, set in easy iambic verse, with each character given a voice of their own.\n\nThe work gathered under his name in this collection is not one of his plays but the Sententiae (Γνῶμαι μονόστιχοι, Gnōmai monostichoi), a collection of one-line maxims. It grew over late antiquity and the Byzantine period, circulated widely in schools and was translated into Arabic and other languages. Only a small part of it comes from Menander's plays.","timeline":[[-342,"Born in Athens (342/1), of the deme Cephisia"],[-321,"First play, Orge (\"Anger\")"],[-317,"His friend Demetrius of Phalerum begins ten years as governor of Athens"],[-316,"Dyskolos wins first prize at the Lenaia"],[-291,"Dies (c. 291/0)"],[1907,"Gustave Lefebvre publishes the Cairo codex, with large parts of three plays"],[1958,"The complete Dyskolos is published from the Bodmer papyrus"],[1969,"Most of the Samian Woman and the Shield published from the same Bodmer codex"]],"manuscripts":"Menander's plays were lost in Byzantium, and there is no medieval manuscript tradition. His text comes from papyri: above all the fifth-century Cairo codex found in 1907 and the third-century Bodmer codex, which preserves the Dyskolos complete and large parts of the Samian Woman and the Shield. Many smaller Oxyrhynchus fragments add to these, and a palimpsest in the Vatican has recently yielded more. Hundreds of quotations in later authors preserve single lines and short passages.\n\nThe Sententiae, by contrast, survive in many medieval manuscripts in several versions, and in Arabic, Syriac and Old Church Slavonic translations.","variants":"Papyrus texts are damaged, so editions of Menander contain many supplements and conjectures, and each new papyrus can change the reconstruction of a play. The assignment of lines to speakers is often uncertain. Most of the Sententiae are not by Menander: the collection absorbed maxims from tragedy, other comic poets and later sources, and different manuscripts and translations contain different sets of lines.","editions":["M. Ullmann, Die arabische Überlieferung der sogenannten Menandersentenzen (Wiesbaden, 1961) — the source of the Sententiae text used here","S. Jaekel, Menandri Sententiae (Teubner, 1964)","F. H. Sandbach, Menandri Reliquiae Selectae (OCT, 1972; 2nd ed. 1990)","W. G. Arnott, Menander, 3 vols (Loeb Classical Library, 1979–2000)","R. Kassel and C. Austin, Poetae Comici Graeci VI.2: Menander, Testimonia et Fragmenta apud scriptores servata (1998)","A. W. Gomme and F. H. Sandbach, Menander: A Commentary (Oxford, 1973)"]}},"tlg2586":{"name":"Menander Rhetor","grc":null,"birth":350,"death":400,"floruit":350,"year":350,"era":"lateantique","desc":"3rd or 4th century Greek rhetorician and commentator","wiki":"https://en.wikipedia.org/wiki/Menander_Rhetor","q":"Q923839","place":"Laodicea on the Lycus","occ":["rhetorician"],"nworks":2},"tlg0639":{"name":"Menecrates Medicus","grc":null,"birth":null,"death":null,"floruit":-350,"year":-350,"era":"classical","desc":"ancient physician","wiki":"https://en.wikipedia.org/wiki/Menecrates_of_Syracuse","q":"Q3854645","place":"Syracuse","occ":["physician"],"nworks":1},"tlg2959":{"name":"Methodius","grc":null,"birth":260,"death":311,"floruit":null,"year":285,"era":"imperial","desc":"Christian bishop and martyr","wiki":"https://en.wikipedia.org/wiki/Methodius_of_Olympus","q":"Q518300","place":null,"occ":["writer","bishop"],"nworks":11},"tlg4034":{"name":"Michael of Ephesus","grc":null,"birth":1050,"death":1129,"floruit":null,"year":1089,"era":"byzantine","desc":"Byzantine philosopher","wiki":"https://en.wikipedia.org/wiki/Michael_of_Ephesus","q":"Q6835560","place":null,"occ":["writer","philosopher"],"nworks":5},"tlg0039":{"name":"Mithridatis Epistula","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"prefatory letter in which a King Mithridates presents his replies to the Greek letters ascribed to Brutus","wiki":null,"q":"Q111302329","place":null,"occ":["author"],"nworks":1},"tlg0575":{"name":"Moschion Gnomologus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient Greek gnomic writer","wiki":null,"q":"Q136654245","place":null,"occ":["writer"],"nworks":2},"tlg0035":{"name":"Moschus","grc":null,"birth":null,"death":null,"floruit":-150,"year":-150,"era":"hellenistic","desc":"Greek bucolic poet of Syracuse (2nd century BCE)","wiki":"https://en.wikipedia.org/wiki/Moschus","q":"Q957548","place":"Syracuse","occ":["writer","poet"],"nworks":5},"tlg2691":{"name":"Musaeus, Eleusinius","grc":null,"birth":-500,"death":null,"floruit":null,"year":-460,"era":"classical","desc":"legendary ancient poet and musician","wiki":"https://en.wikipedia.org/wiki/Musaeus_of_Athens","q":"Q728059","place":"Athens","occ":["poet","musician"],"nworks":1},"tlg0628":{"name":"Musonius Rufus","grc":null,"birth":25,"death":95,"floruit":null,"year":60,"era":"imperial","desc":"1st century AD Roman Stoic philosopher","wiki":"https://en.wikipedia.org/wiki/Gaius_Musonius_Rufus","q":"Q381874","place":"Volsinii","occ":["philosopher"],"nworks":3},"tlg0509":{"name":"Myia","grc":null,"birth":-600,"death":-500,"floruit":null,"year":-550,"era":"archaic","desc":"Pythagorean woman philosopher, by tradition Pythagoras' daughter; the letter under her name is later","wiki":"https://en.wikipedia.org/wiki/Myia","q":"Q456560","place":"Croton","occ":["writer","philosopher"],"nworks":1},"tlg0031":{"name":"New Testament","grc":"Ἡ Καινὴ Διαθήκη","birth":null,"death":null,"floruit":null,"year":80,"era":"imperial","desc":"second division of the Christian biblical canon","wiki":"https://en.wikipedia.org/wiki/New_Testament","q":"Q18813","place":null,"occ":[],"nworks":27,"core":{"summary":"The New Testament (Ἡ Καινὴ Διαθήκη, Hē Kainē Diathēkē) is a collection of 27 books written in Greek between about 50 CE and the early second century: Paul's letters first, then the four Gospels (Mark, Matthew, Luke and John), the Acts of the Apostles, the other letters and Revelation. It is not written in the classical Attic of the schools but in Koine (κοινή, koinē, \"common\"), the everyday Greek of the eastern Roman empire, coloured by the Greek of the Septuagint, the Greek translation of the Hebrew Bible. Its style ranges widely. Mark tells his story in the present tense and moves it along with εὐθύς (euthys, \"immediately\"), some forty times. Luke opens with a single polished period (1:1–4) worthy of a Greek historian, as does the Letter to the Hebrews. Revelation bends grammar freely, as in ἀπὸ ὁ ὤν (apo ho ōn, \"from the one who is\", 1:4), where classical Greek requires a genitive after ἀπό.\n\nFor students of Greek it is a window onto the language people actually used in the first century, and it survives in more manuscripts than any other ancient text. The collection took shape gradually; the first list that matches our 27 books exactly is in a letter of Athanasius of Alexandria from 367 CE.","timeline":[[50,"Paul's earliest letters (1 Thessalonians, probably Galatians)"],[70,"Gospel of Mark (approximate date)"],[85,"Matthew and Luke–Acts (approximate dates)"],[95,"Gospel of John and Revelation (approximate dates)"],[125,"P52, a fragment of John, long dated to the first half of the second century and treated as the earliest surviving manuscript; some scholars now allow a later date"],[200,"P46 (Pauline letters) and P66, P75 (Gospels), around 200"],[350,"Codex Sinaiticus and Codex Vaticanus, fourth century"],[367,"Athanasius' festal letter lists the 27-book canon"],[1516,"Erasmus' printed Greek New Testament, the first published, later the basis of the Textus Receptus (the Complutensian Polyglot's text was printed in 1514 but released only in the 1520s)"],[1633,"The Elzevir edition's preface calls its text the one 'now received by all', the origin of the name Textus Receptus"],[1881,"Westcott and Hort's critical edition"],[2012,"Nestle–Aland 28th edition"]],"manuscripts":"Nearly 6,000 Greek manuscripts are catalogued. They include some 140 papyri (P52, P46, P66 and P75 among the oldest), around 320 majuscules written in capitals on parchment (among them Codex Sinaiticus, ℵ; Vaticanus, B; Alexandrinus, A; Ephraemi Rescriptus, C; and Bezae, D), about 2,900 minuscules, and some 2,400 lectionaries, which arrange the text for reading in church. Early translations into Latin, Syriac and Coptic, and thousands of quotations in the Church Fathers, are witnesses too; this collection includes a Coptic version of Mark. Textual critics have traditionally grouped the manuscripts into text types: the Alexandrian (ℵ, B, P75), the 'Western' (D and the Old Latin) and the Byzantine, which accounts for most medieval copies. The Editio Critica Maior, begun in 1997, is now rebuilding the text with a computer-assisted method (the Coherence-Based Genealogical Method) that traces relationships between individual manuscripts rather than text types.","variants":"Estimates run to several hundred thousand variant readings, almost all of them trivial: spelling, word order, small slips. The best-known exceptions are the longer ending of Mark (16:9–20), the story of the woman taken in adultery (John 7:53–8:11) and the 'Johannine Comma' (1 John 5:7–8), none of which is in the earliest witnesses, and the ending of Romans, whose closing doxology stands in different places in different manuscripts. The 'Western' text of Acts, represented by Codex Bezae, is almost a tenth longer than the Alexandrian. Modern critical editions (Nestle–Aland and the UBS Greek New Testament) reconstruct the text eclectically, relying mainly on the Alexandrian witnesses. The Textus Receptus behind the King James Version largely follows the Byzantine text.","editions":["B. F. Westcott and F. J. A. Hort, The New Testament in the Original Greek (1881) — the Greek text used here","World English Bible (a public-domain revision of the American Standard Version of 1901) — the translation used here","Nestle–Aland, Novum Testamentum Graece, 28th ed. (2012) and UBS Greek New Testament, 5th ed. (2014)","B. M. Metzger, A Textual Commentary on the Greek New Testament (2nd ed. 1994)","K. and B. Aland, The Text of the New Testament (2nd ed. 1989); B. M. Metzger and B. D. Ehrman, The Text of the New Testament (4th ed. 2005)"]}},"tlg0022":{"name":"Nicander of Colophon","grc":null,"birth":-250,"death":-170,"floruit":null,"year":-210,"era":"hellenistic","desc":"2nd century BC Greek scientist and poet","wiki":"https://en.wikipedia.org/wiki/Nicander","q":"Q363818","place":"Colophon","occ":["writer","physician","priest","poet","historian","epigrammatist"],"nworks":2},"tlg0046":{"name":"Niciae Epistula","grc":null,"birth":-500,"death":-413,"floruit":null,"year":-456,"era":"classical","desc":"Athenian general (d. 413 BCE); his letter to the Athenians from Sicily as given by Thucydides (7.11–15)","wiki":"https://en.wikipedia.org/wiki/Nicias","q":"Q315822","place":"Athens","occ":["military personnel","politician"],"nworks":1},"tlg0358":{"name":"Nicomachus of Gerasa","grc":null,"birth":60,"death":120,"floruit":null,"year":90,"era":"imperial","desc":"Greco-Syrian mathematician (c. 60 – c. 120 AD)","wiki":"https://en.wikipedia.org/wiki/Nicomachus","q":"Q360366","place":"Gerasa","occ":["mathematician","philosopher","musicologist","music theorist"],"nworks":4},"tlg2045":{"name":"Nonnus of Panopolis","grc":"Νόννος","birth":null,"death":null,"floruit":450,"year":450,"era":"lateantique","desc":"Greek epic poet","wiki":"https://en.wikipedia.org/wiki/Nonnus","q":"Q312916","place":"Panopolis","occ":["writer","poet"],"nworks":1,"core":{"summary":"Nonnus of Panopolis (Νόννος, Nonnos, fl. c. 450–470 CE) came from Panopolis in Upper Egypt, a centre of late Greek poetry. His Dionysiaca (Διονυσιακά), in forty-eight books and some 21,000 lines, is the longest poem to survive from antiquity. It tells the life of the god Dionysus, from the ancestry of Cadmus to his birth, his conquest of India, his travels and his reception among the gods, in a flood of mythological digressions, love stories and battles. Its forty-eight books match the combined total of the Iliad and the Odyssey, and the poem openly competes with Homer.\n\nA hexameter Paraphrase of the Gospel of John is also transmitted under the name of Nonnus. Whether the same poet wrote both, and in what order, has long been debated; the older idea that he converted from paganism to Christianity is now doubted, since the two poems may have been written close together by a Christian poet at ease with pagan myth.\n\nNonnus' style is flamboyant, dense with compound adjectives and repeated images, and his hexameter follows strict rules of his own. He avoids many rhythms that Homer allowed and shapes the ends of lines to suit the stress accent of his day. He founded a school of late Greek epic, and his influence can be traced in poets such as Colluthus and Musaeus.","timeline":[[450,"The Dionysiaca and the Paraphrase of John written (c. 450–470)"],[500,"Poets of the 'Nonnian school', such as Colluthus and Musaeus, follow his style"],[1280,"The only manuscript of the Dionysiaca, Laurentianus 32.16, is copied in the circle of Maximus Planudes"],[1569,"Editio princeps of the Dionysiaca (Antwerp)"]],"manuscripts":"The Dionysiaca survives in a single medieval manuscript, Laurentianus 32.16 in Florence, written and annotated around 1280 by Maximus Planudes or his circle. All later copies derive from it. The Paraphrase of John has a separate tradition with many manuscripts.","variants":"With a single manuscript, the text of the Dionysiaca depends heavily on conjecture, and Nonnus' strict metrical rules have been used to correct it. The authorship and relative date of the Paraphrase, and the date of Nonnus himself, are debated.","editions":["W. H. D. Rouse, Nonnos: Dionysiaca, 3 vols (Loeb Classical Library, 1940) — the Greek text and translation used here","R. Keydell, Nonni Panopolitani Dionysiaca, 2 vols (Berlin, 1959)","F. Vian and others, Nonnos de Panopolis: Les Dionysiaques, 19 vols (Budé, 1976–2006)"]}},"tlg1542":{"name":"Numenius of Apamea","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"2nd century Greco-Roman philosopher","wiki":"https://en.wikipedia.org/wiki/Numenius_of_Apamea","q":"Q707344","place":"Apamea","occ":["philosopher"],"nworks":1},"tlg1548":{"name":"Oenomaus of Gadara","grc":null,"birth":null,"death":null,"floruit":120,"year":120,"era":"imperial","desc":"2nd century Greek Cynic philosopher","wiki":"https://en.wikipedia.org/wiki/Oenomaus_of_Gadara","q":"Q2559200","place":"Gadara","occ":["philosopher"],"nworks":1},"tlg0527":{"name":"Septuagint (Old Testament in Greek)","grc":"Οἱ Ἑβδομήκοντα","birth":null,"death":null,"floruit":null,"year":-250,"era":"hellenistic","desc":"Greek translation of the Hebrew Bible, begun in Alexandria in the 3rd century BCE","wiki":null,"q":null,"place":null,"occ":[],"nworks":56,"core":{"summary":"The Septuagint is the ancient Greek translation of the Hebrew Bible. Its name comes from the Latin for \"seventy\" (Greek Οἱ Ἑβδομήκοντα, hoi Hebdomēkonta, \"the Seventy\"; abbreviated LXX). It recalls the legend, told in the Letter of Aristeas, that seventy-two Jewish elders translated the Law at Alexandria for King Ptolemy II. The story is legendary, but the Pentateuch was in fact translated in Alexandria in the third century BCE, and the other books followed over the next two centuries. The grandson of Ben Sira, translating his grandfather's book around 132 BCE, already speaks of the Law, the Prophets and the other books as available in Greek.\n\nThe Septuagint was the Bible of Greek-speaking Jews and then of the early Church. The New Testament writers usually quote it, and it remains the Old Testament of the Greek Orthodox Church. It contains books and additions not in the Hebrew Bible, among them Wisdom, Ben Sira (Ecclesiasticus), Judith, Tobit, the books of Maccabees and additions to Esther and Daniel. Because it was translated from Hebrew texts older than the medieval Masoretic text, it is also an important witness to the Hebrew Bible itself.\n\nIts Greek is Koine, but it varies greatly from book to book, from very literal renderings that follow Hebrew word order to free and idiomatic ones. Hebrew idiom shows through everywhere, as in the frequent καὶ ἐγένετο (kai egeneto, \"and it came to pass\"), and the Septuagint in turn shaped the language of the New Testament. Readers should note that the English translation offered here (the World English Bible) is made from the Hebrew, not from the Greek. It therefore often differs from the text beside it: the Greek Jeremiah is about one-eighth shorter than the Hebrew, and the Psalms are numbered differently.","timeline":[[-250,"The Pentateuch is translated into Greek at Alexandria (3rd century BCE)"],[-132,"The grandson of Ben Sira translates his grandfather's book and mentions the other translations"],[-100,"Most of the remaining books are available in Greek (by the 1st century BCE)"],[130,"Aquila, Symmachus and Theodotion make new Jewish translations or revisions (2nd century CE)"],[240,"Origen compiles the Hexapla, setting the Hebrew and Greek versions side by side (c. 240)"],[350,"Codex Vaticanus and Codex Sinaiticus copied (4th century)"],[1514,"The Complutensian Polyglot prints the first complete Septuagint (1514–17; issued in the 1520s)"],[1518,"Aldine edition (1518–19)"],[1587,"The Sixtine edition, based on Codex Vaticanus"],[1935,"Alfred Rahlfs' hand edition, still the most widely used text"]],"manuscripts":"The great fourth- and fifth-century Christian codices, Vaticanus (B), Sinaiticus (ℵ) and Alexandrinus (A), are the most complete early witnesses. Hundreds of later manuscripts follow, many of them reflecting ancient revisions: the Hexaplaric text derived from Origen's work and the 'Lucianic' or Antiochian text. Papyri and fragments from Qumran and the Judaean desert take the evidence back to the second and first centuries BCE. Daughter translations into Latin, Coptic, Ethiopic, Armenian and other languages are also important.","variants":"There is no single Septuagint text: each book has its own translator, history and revisions. For Daniel, for example, the churches replaced the original Greek with the version attributed to Theodotion. Editions differ in their base: Swete's edition, used here, largely prints Codex Vaticanus with variants from other major manuscripts, while the Göttingen edition reconstructs the oldest recoverable text book by book. The order and number of books also differ between manuscripts and editions.","editions":["H. B. Swete, The Old Testament in Greek According to the Septuagint, 3 vols (Cambridge, 1887–94; later printings used here) — the Greek text used here","J. H. A. Hart, Ecclesiasticus: The Greek Text of Codex 248 (Cambridge, 1909), and R. R. Ottley, The Book of Isaiah According to the Septuagint (Cambridge, 1904) — the texts used here for Sirach and Isaiah","World English Bible (a translation of the Hebrew text) — the English translation used here","A. Rahlfs, Septuaginta (Stuttgart, 1935; revised by R. Hanhart, 2006)","Septuaginta: Vetus Testamentum Graecum auctoritate Academiae Scientiarum Gottingensis editum (Göttingen, 1931–), the critical edition","A. Pietersma and B. G. Wright (eds), A New English Translation of the Septuagint (Oxford, 2007)"]}},"tlg4019":{"name":"Olympiodorus","grc":null,"birth":495,"death":570,"floruit":null,"year":532,"era":"lateantique","desc":"Neoplatonist philosopher (c.495–570)","wiki":"https://en.wikipedia.org/wiki/Olympiodorus_the_Younger","q":"Q974775","place":"Alexandria","occ":["writer","astrologer","philosopher"],"nworks":3},"tlg0648":{"name":"Onasander","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"Platonist philosopher, author of the Strategikos, a treatise on generalship (1st century CE)","wiki":"https://en.wikipedia.org/wiki/Onasander","q":"Q373042","place":null,"occ":["writer","philosopher","military writer"],"nworks":1},"tlg0023":{"name":"Oppian","grc":null,"birth":149,"death":180,"floruit":177,"year":177,"era":"imperial","desc":"2nd-century Greco-Roman poet, author of Halieutica","wiki":"https://en.wikipedia.org/wiki/Oppian","q":"Q116508","place":"Cilicia","occ":["writer","poet"],"nworks":1},"tlg0024":{"name":"Oppian of Apamea","grc":null,"birth":null,"death":null,"floruit":215,"year":215,"era":"imperial","desc":"author of Cynegetica","wiki":"https://en.wikipedia.org/wiki/Pseudo-Oppian","q":"Q17996276","place":"Apamea","occ":["poet"],"nworks":1},"tlg1551":{"name":"Oracula Sibyllina","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Sibylline Oracles, Jewish and Christian apocalyptic prophecies in hexameter verse (2nd century BCE–7th century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg2042":{"name":"Origen","grc":"Ὠριγένης","birth":185,"death":253,"floruit":null,"year":219,"era":"imperial","desc":"Christian scholar, ascetic, and theologian (c. 185 – c. 253)","wiki":"https://en.wikipedia.org/wiki/Origen","q":"Q170472","place":"Alexandria","occ":["writer","translator","theologian","cleric","philosopher"],"nworks":47,"core":{"summary":"Origen (Ὠριγένης, Ōrigenēs, c. 185–c. 253 CE) was born in Alexandria to a Christian family. His father Leonides was executed in the persecution of 202. According to Eusebius, the young Origen soon headed the city's school of Christian instruction, lived a life of extreme asceticism, and even castrated himself, a report many historians doubt. After a conflict with his bishop, Demetrius, he moved to Caesarea in Palestine in the early 230s, where he was ordained a presbyter and taught for the rest of his life. He was imprisoned and tortured in the persecution of Decius (250) and died a few years later, probably at Tyre.\n\nOrigen was the first great Christian scholar and one of the most productive writers of antiquity. Ancient sources speak of thousands of works. He compiled the Hexapla, which set the Hebrew Old Testament and several Greek versions side by side in six columns, and wrote commentaries and homilies on almost every book of the Bible, a systematic theology (On First Principles), and a reply in eight books to the pagan critic Celsus (Against Celsus, c. 248). He read scripture on several levels, literal, moral and spiritual, which he compared to body, soul and spirit, and his allegorical method shaped Christian exegesis for centuries.\n\nSome of his speculative ideas, such as the pre-existence of souls, were condemned in the sixth century, and much of his Greek work was lost as a result. Many writings survive only in the Latin translations of Rufinus and Jerome. His Greek is plain and workmanlike, the efficient Koine of a teacher and scholar rather than a stylist.","timeline":[[185,"Born at Alexandria (c. 185)"],[202,"His father Leonides is martyred in the persecution under Septimius Severus"],[231,"After a break with Bishop Demetrius, moves to Caesarea in Palestine (early 230s)"],[240,"Works on the Hexapla (c. 240)"],[248,"Against Celsus (c. 248)"],[250,"Imprisoned and tortured in the persecution of Decius"],[253,"Dies, probably at Tyre (c. 253/4)"],[360,"Basil and Gregory of Nazianzus compile the Philocalia, an anthology of his writings"],[553,"His teachings are condemned in the reign of Justinian, and much of his Greek work is lost"],[1941,"Papyri found at Tura in Egypt recover the Dialogue with Heraclides and On the Pascha"],[2012,"Twenty-nine lost Homilies on the Psalms are identified in a Munich manuscript"]],"manuscripts":"Each of Origen's works has its own history, and most of his output is lost. Against Celsus survives complete in one thirteenth-century manuscript, Vaticanus gr. 386, from which all other copies descend, supplemented by excerpts in the Philocalia. Much of his biblical commentary survives only as fragments in the Byzantine catenae, chains of extracts from different commentators. Discoveries still add to the corpus. Papyri from Tura (1941) preserved two lost works, and in 2012 Marina Molin Pradel identified twenty-nine Homilies on the Psalms in a twelfth-century Munich manuscript (Monacensis gr. 314).","variants":"The main problem is authenticity and fidelity. Rufinus admitted that he softened passages in On First Principles that later readers found unorthodox, so the Latin cannot simply be taken as Origen's words. Catena fragments are often abbreviated or wrongly attributed. How far the sixth-century condemnations fairly represent his views is still debated.","editions":["Origenes Werke (Die Griechischen Christlichen Schriftsteller, Leipzig and Berlin, 1899–), ed. P. Koetschau, E. Preuschen, E. Klostermann, M. Rauer and others — the Greek texts used here for most works","C. and C. V. de La Rue, Origenis Opera Omnia (Patrologia Graeca 11–17, ed. J.-P. Migne, 1857–62) — the text used here for many fragments","J. A. Robinson, The Philocalia of Origen (Cambridge, 1893) — the text used here for the Philocalia","H. Chadwick, Origen: Contra Celsum (Cambridge, 1953), translation","L. Perrone, Die neuen Psalmenhomilien (GCS, 2015), the Munich homilies","J. Behr, Origen: On First Principles (Oxford, 2017)"]}},"tlg0579":{"name":"Orphica","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"poems and fragments ascribed to the legendary singer Orpheus","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1553":{"name":"Palaiphatos","grc":null,"birth":null,"death":null,"floruit":-350,"year":-350,"era":"classical","desc":"Greek writer of the 4th century BCE who explained myths rationally, author of On Unbelievable Tales","wiki":"https://en.wikipedia.org/wiki/Palaephatus","q":"Q580565","place":null,"occ":["writer","historian","mythographer"],"nworks":1},"tlg2032":{"name":"Pappus Alexandrinus","grc":null,"birth":290,"death":350,"floruit":null,"year":320,"era":"imperial","desc":"4th century Greek mathematician","wiki":"https://en.wikipedia.org/wiki/Pappus_of_Alexandria","q":"Q211783","place":"Alexandria","occ":["astronomer","mathematician"],"nworks":1},"tlg0580":{"name":"Paradoxographus Florentinus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient Greek anonymous work on marvels","wiki":null,"q":"Q131285705","place":null,"occ":[],"nworks":1},"tlg4174":{"name":"Paraphrases in Dioynsium Periegetam","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Byzantine prose paraphrases of the geographical poem of Dionysius Periegetes","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1562":{"name":"Parmenides","grc":null,"birth":-515,"death":-470,"floruit":null,"year":-492,"era":"archaic","desc":"late 6th/early 5th century BC Greek pre-Socratic philosopher","wiki":"https://en.wikipedia.org/wiki/Parmenides","q":"Q125551","place":"Elea","occ":["writer","poet","legislator","philosopher"],"nworks":1},"tlg1801":{"name":"Parodica Anonyma","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"fragments of anonymous Greek parodic poetry","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0655":{"name":"Parthenius of Nicaea","grc":null,"birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"Greek poet and scholar from Nicaea, brought to Rome as a captive in the 70s BCE; his Sufferings in Love was written for Cornelius Gallus","wiki":"https://en.wikipedia.org/wiki/Parthenius_of_Nicaea","q":"Q729109","place":"Nicaea","occ":["writer","poet","mythographer"],"nworks":1},"tlg0525":{"name":"Pausanias","grc":"Παυσανίας","birth":null,"death":null,"floruit":160,"year":160,"era":"imperial","desc":"ancient Greek geographer, travel writer and mythographer","wiki":"https://en.wikipedia.org/wiki/Pausanias_(geographer)","q":"Q192931","place":"Magnesia ad Sipylum","occ":["writer","geographer","travel writer"],"nworks":1,"core":{"summary":"Pausanias (Παυσανίας, Pausanias, fl. c. 150–180 CE) was a Greek traveller from Asia Minor, probably from Magnesia ad Sipylum in Lydia, and almost everything we know of him comes from his own book. His Description of Greece (Ἑλλάδος περιήγησις, Hellados periēgēsis) guides the reader, region by region, through mainland Greece: Attica, the Corinthia and Argolid, Laconia, Messenia, Elis and Olympia (two books), Achaea, Arcadia, Boeotia and Phocis with Delphi. Datable references show that he was writing between about 155 and 180 CE.\n\nPausanias chose what to describe. He passes over most Roman buildings and concentrates on the sanctuaries, temples, statues, paintings and tombs of the Greek past, with the myths, local histories and religious rites attached to them. He was little read in antiquity, but modern archaeology has made him indispensable. Excavators at Olympia, Delphi and Mycenae have used him as a guidebook, and his descriptions preserve works of art that are otherwise lost.\n\nHis Greek is his own. He imitates Herodotus in his digressions, his local stories and some Ionic turns of phrase, but his prose is deliberately varied and often awkward, with an unusual word order that makes him harder than he first appears. He is careful to say which things he has seen himself and which he has only been told, and those distinctions are a good guide to his method.","timeline":[[115,"Born (c. 115), probably at Magnesia ad Sipylum in Lydia"],[155,"Begins his Description of Greece with Attica (c. 155)"],[170,"Mentions the invasion of Greece by the Costoboci (170/1)"],[180,"Completes the work (c. 180)"],[550,"Stephanus of Byzantium draws on him for his geographical lexicon (6th century)"],[1418,"The humanist Niccolò Niccoli owns in Florence the manuscript from which all surviving copies descend"],[1516,"Aldine editio princeps, edited by Marcus Musurus"],[1898,"J. G. Frazer's translation and six-volume commentary, the basis of modern archaeological study"]],"manuscripts":"All the surviving manuscripts, some twenty, were copied in Italy in the fifteenth century. They descend from a single archetype that the humanist Niccolò Niccoli had in Florence in 1418, which passed to the library of San Marco at his death in 1437 and was lost after 1500. The text therefore rests on one lost medieval witness, and its errors must be corrected by conjecture.","variants":"The single archetype had many corruptions and gaps. Place names, inscriptions he quotes and numbers are frequently damaged. Pausanias' own reliability has been debated since the nineteenth century: some scholars accused him of copying earlier guidebooks rather than seeing things for himself, but excavations have repeatedly confirmed his descriptions.","editions":["F. Spiro, Pausaniae Graeciae Descriptio, 3 vols (Teubner, 1903) — the Greek text used here","W. H. S. Jones and H. A. Ormerod, Pausanias: Description of Greece, 5 vols (Loeb Classical Library, 1918–35) — the translation used here","M. H. Rocha-Pereira, Pausaniae Graeciae Descriptio, 3 vols (Teubner, 1973–81), the standard text","J. G. Frazer, Pausanias's Description of Greece, 6 vols (London, 1898), translation and commentary","D. Musti and others, Pausania: Guida della Grecia (Fondazione Lorenzo Valla, 1982–2017), text, translation and commentary"]}},"tlg0629":{"name":"Periander","grc":null,"birth":null,"death":-585,"floruit":-610,"year":-610,"era":"archaic","desc":"tyrant of Corinth (c. 627–587 BCE), counted among the Seven Sages; the letters under his name are later","wiki":"https://en.wikipedia.org/wiki/Periander","q":"Q328793","place":"Corinth","occ":["writer","poet","politician","tyrant","philosopher"],"nworks":1},"tlg0053":{"name":"Phalaridis Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to Phalaris, tyrant of Acragas, shown by Richard Bentley (1699) to be a later forgery, probably of the 2nd century CE","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0048":{"name":"Philip II, King of Macedonia","grc":null,"birth":-385,"death":-336,"floruit":null,"year":-360,"era":"classical","desc":"King of Macedon from 359 to 336 BCE; letters under his name come from the Demosthenic corpus, some of them later compositions","wiki":"https://en.wikipedia.org/wiki/Philip_II_of_Macedon","q":"Q130650","place":null,"occ":["monarch"],"nworks":1},"tlg0018":{"name":"Philo Judaeus","grc":"Φίλων","birth":-20,"death":50,"floruit":null,"year":18,"era":"imperial","desc":"Hellenistic Jewish philosopher who lived in Alexandria","wiki":"https://en.wikipedia.org/wiki/Philo","q":"Q189597","place":"Alexandria","occ":["writer","historian","theologian","philosopher"],"nworks":31,"core":{"summary":"Philo of Alexandria (Φίλων, Philōn, c. 20 BCE–c. 50 CE) belonged to a wealthy and prominent family in the largest Jewish community of the Greek-speaking world: his brother Alexander was a leading official, and his nephew Tiberius Julius Alexander abandoned Judaism and became prefect of Egypt. Philo was steeped both in the Jewish scriptures, which he read in the Greek of the Septuagint (how much Hebrew he knew is debated), and in Greek philosophy, especially Plato and the Stoics, and he spent his life explaining the one through the other.\n\nMost of his roughly forty surviving Greek treatises interpret the five books of Moses, in three great series: an allegorical commentary on Genesis, an exposition of the Law, and a set of Questions and Answers that survives mainly in Armenian. Read allegorically, the stories of Genesis become lessons about the soul and its journey towards God. He also wrote an eyewitness account of the embassy he led to the emperor Gaius (Caligula) in 39–40 CE, after anti-Jewish riots in Alexandria; Josephus, the only near-contemporary to mention him, describes him leading it. His way of reading scripture through philosophy deeply influenced early Christian writers such as Clement of Alexandria and Origen.\n\nHis Greek is rich, literary and close to classical models, with long, carefully built periods. Central to his thought is the divine λόγος (logos, \"word, reason\"), through which God creates and governs the world, a term whose relation to the opening of John's Gospel has been much discussed.","timeline":[[-20,"Born in Alexandria to a wealthy Jewish family"],[38,"Anti-Jewish riots in Alexandria under the prefect Flaccus"],[40,"Leads the Jewish embassy to Gaius Caligula in Rome (Embassy to Gaius)"],[50,"Dies (approximate)"],[320,"Eusebius lists his works and uses them extensively, repeating a legend that Philo met the apostle Peter in Rome; Christian scribes ensure his survival"],[1552,"Editio princeps (Turnèbe, Paris)"]],"manuscripts":"Philo survived because Christians, not Jews, copied him. The medieval Greek manuscripts, about sixty and none older than the tenth century (for example Vaticanus gr. 381 and Laurentianus 85.10), go back to the Christian library at Caesarea founded on Origen's books. A note in several of them records that Bishop Euzoius, in the later fourth century, had the library's worn papyrus rolls copied onto parchment codices. Two papyrus books, one from Coptos (third century) and one from Oxyrhynchus, give earlier evidence, and a sixth-century Armenian translation preserves works lost in Greek, including the Questions and Answers on Genesis and on Exodus.","variants":"The titles and divisions of the treatises differ between manuscripts and from the list Eusebius gives. Some works transmitted under Philo's name are not his: On the World and the Latin Biblical Antiquities are spurious. On the Contemplative Life, which describes a community of Jewish ascetics near Alexandria, was once dismissed as a Christian forgery but is now generally accepted.","editions":["L. Cohn and P. Wendland, Philonis Alexandrini Opera quae supersunt, 7 vols (Berlin, 1896–1930) — the Greek text used here","C. D. Yonge, The Works of Philo Judaeus, 4 vols (London, 1854–55) — the translation used here","F. H. Colson, G. H. Whitaker and R. Marcus, Philo, 12 vols (Loeb Classical Library, 1929–62), including Marcus's translation of the Armenian Questions and Answers","R. Arnaldez and others, Les Œuvres de Philon d'Alexandrie, 36 vols (Paris, 1961–92)"]}},"tlg1416":{"name":"Philo of Byblos","grc":null,"birth":50,"death":140,"floruit":null,"year":95,"era":"imperial","desc":"Greek author (c. 64 – 141)","wiki":"https://en.wikipedia.org/wiki/Philo_of_Byblos","q":"Q504771","place":"Byblos","occ":["writer","lexicographer","mythographer"],"nworks":1},"tlg1595":{"name":"Philodemus","grc":null,"birth":-110,"death":-35,"floruit":null,"year":-72,"era":"hellenistic","desc":"1st-century BC Greek Epicurean philosopher and poet","wiki":"https://en.wikipedia.org/wiki/Philodemus","q":"Q451550","place":"Gadara","occ":["writer","poet","philosopher","grammarian","epigrammatist"],"nworks":2},"tlg1596":{"name":"Philolaus of Croton","grc":null,"birth":-470,"death":-390,"floruit":null,"year":-430,"era":"classical","desc":"Greek philosopher, astronomer and Pythagorean (c.470–c.385 BCE)","wiki":"https://en.wikipedia.org/wiki/Philolaus","q":"Q212338","place":"Croton","occ":["astronomer","writer","politician","mathematician","philosopher","music theorist"],"nworks":1},"tlg2058":{"name":"Philostorgius","grc":null,"birth":368,"death":450,"floruit":null,"year":409,"era":"lateantique","desc":"Byzantine Church historian (368 – c. 439)","wiki":"https://en.wikipedia.org/wiki/Philostorgius","q":"Q380943","place":"Cappadocia","occ":["writer","historian","church historian","religious writer"],"nworks":1},"tlg0652":{"name":"Philostratus Minor","grc":null,"birth":null,"death":null,"floruit":250,"year":250,"era":"imperial","desc":"ancient Greek sophist","wiki":"https://en.wikipedia.org/wiki/Philostratus_the_Younger","q":"Q1231472","place":"Lemnos","occ":["writer","sophist","orator"],"nworks":1},"tlg1600":{"name":"Philostratus Sophista","grc":null,"birth":190,"death":230,"floruit":null,"year":210,"era":"imperial","desc":"3rd century Greek sophist and author","wiki":"https://en.wikipedia.org/wiki/Philostratus_of_Lemnos","q":"Q691292","place":"Lemnos","occ":["writer","sophist","orator"],"nworks":1},"tlg0638":{"name":"Philostratus the Athenian","grc":"Φιλόστρατος","birth":170,"death":250,"floruit":null,"year":210,"era":"imperial","desc":"3rd century Greco-Roman sophist","wiki":"https://en.wikipedia.org/wiki/Philostratus","q":"Q2274948","place":"Lemnos","occ":["writer","sophist","philosopher","orator"],"nworks":6,"core":{"summary":"Flavius Philostratus (Φιλόστρατος, Philostratos, c. 170–c. 250 CE) came from a family of sophists on the island of Lemnos, studied at Athens, and became a member of the literary circle of the empress Julia Domna, wife of Septimius Severus. At her request he wrote the Life of Apollonius of Tyana, in eight books, about a first-century Pythagorean holy man and wonder-worker; it was completed after her death in 217. Pagan writers later set Apollonius up as a rival to Christ, and Eusebius wrote a reply. His Lives of the Sophists, written in the 230s, introduced the term 'Second Sophistic' (δευτέρα σοφιστική, deutera sophistikē) for the great age of Greek oratory from the first to the early third century CE, and it is our main source for that movement.\n\nThe other works under his name include the Heroicus, a dialogue in which a vine-grower near Troy reports the ghost of the hero Protesilaus correcting Homer; the Gymnasticus, on athletic training; and a collection of love letters. The Imagines, descriptions of sixty-five paintings in a villa near Naples, are ascribed to a Philostratus of Lemnos, often called the Elder, and a second, shorter Imagines to his grandson, the Younger. The ancient sources list several men of this name in one family. How they are related, and which works belong to which, is a notorious puzzle, and some scholars think the elder Imagines are by our Philostratus himself.\n\nPhilostratus writes in a lively, showy Atticising style, full of rare words, anecdote and description (ἔκφρασις, ekphrasis). The Imagines were a model for later writers on art.","timeline":[[170,"Born on Lemnos (c. 170)"],[205,"A member of the circle of the empress Julia Domna (c. 205–217)"],[217,"Death of Julia Domna; the Life of Apollonius is completed after this"],[235,"Lives of the Sophists, in which he names the 'Second Sophistic' (c. 230–238)"],[250,"Dies (c. 250)"],[310,"Eusebius answers the use of the Life of Apollonius against Christianity"],[1501,"Aldine edition of the Life of Apollonius"]],"manuscripts":"Each of the works has its own manuscript tradition. The Life of Apollonius and the Lives of the Sophists survive in many medieval copies, and the Imagines were popular in Byzantium and the Renaissance. Because the family's works were often copied together, attribution in the manuscripts is not always reliable.","variants":"The main problem is authorship: the ancient Suda lists at least three Philostrati, and scholars disagree about which of them wrote the Imagines, the Heroicus, the Gymnasticus and the letters. The historical reliability of the Life of Apollonius, which claims to use the notes of Apollonius' companion Damis, is much debated; many scholars think Damis a literary invention.","editions":["C. L. Kayser, Flavii Philostrati Opera, 2 vols (Teubner, 1870–71) — the Greek text used here for all the Philostratean works","W. C. Wright, Philostratus and Eunapius: The Lives of the Sophists (Loeb Classical Library, 1921)","C. P. Jones, Philostratus: The Life of Apollonius of Tyana, 3 vols (Loeb Classical Library, 2005–06)","A. Fairbanks, Philostratus: Imagines; Callistratus: Descriptions (Loeb Classical Library, 1931)","J. K. B. Maclean and E. B. Aitken, Flavius Philostratus: Heroikos (Atlanta, 2001)"]}},"tlg1602":{"name":"Philoxenus of Alexandria","grc":null,"birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"ancient Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Philoxenus_of_Alexandria","q":"Q1234940","place":null,"occ":["grammarian","glossographer"],"nworks":1},"tlg0671":{"name":"Philumenus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Greek physician, author of On Venomous Animals (before the 4th century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0033":{"name":"Pindar","grc":"Πίνδαρος","birth":-518,"death":-438,"floruit":null,"year":-476,"era":"classical","desc":"5th-century BCE Greek lyric poet","wiki":"https://en.wikipedia.org/wiki/Pindar","q":"Q134929","place":"Cynoscephalae","occ":["writer","poet","mythographer"],"nworks":4,"core":{"summary":"Pindar of Thebes (Πίνδαρος, Pindaros, c. 518–c. 438 BCE) was, in Quintilian's judgement, \"by far the first\" of the nine canonical Greek lyric poets. He composed songs in many genres for choruses to sing and dance, but what survives nearly complete are his victory odes (ἐπινίκια, epinikia): four books celebrating winners at the Olympian, Pythian, Nemean and Isthmian games, commissioned by tyrants, kings and aristocratic families across the Greek world. The odes were probably sung and danced by a chorus, though some scholars have argued that at least some were performed solo.\n\nA victory ode is not a sports report. Pindar sets the win beside myth, the victor's family and city and the gods, and draws from it reflections on human success and its limits: \"Creatures of a day! What is anyone? What is no one? Man is a dream of a shadow\" (ἐπάμεροι· τί δέ τις; τί δ᾽ οὔ τις; σκιᾶς ὄναρ ἄνθρωπος, Pythian 8.95–96). The other thirteen books of his poetry (hymns, paeans, dithyrambs, maiden-songs and more) are known only from papyri and quotations.\n\nHis Greek is famously difficult: bold metaphors, sudden transitions and complex metres, in a literary language with a Doric colouring (ᾱ for η, and Μοῖσα, Moisa, for Attic Μοῦσα, \"Muse\") and some Aeolic forms. The ancient commentaries (scholia), which preserve the work of Alexandrian scholars, are still a great help.","timeline":[[-518,"Born at Cynoscephalae near Thebes"],[-498,"Pythian 10, his earliest datable ode"],[-476,"Olympian 1 for Hieron of Syracuse"],[-446,"Pythian 8, his latest datable ode"],[-438,"Dies, by tradition at Argos"],[-335,"Alexander the Great razes Thebes but spares Pindar's house"],[-200,"Aristophanes of Byzantium arranges his works into 17 books"],[1513,"Aldine editio princeps"],[1908,"Grenfell and Hunt publish P.Oxy. 841, a papyrus roll of Pindar's Paeans"]],"manuscripts":"The four books of victory odes survive in about 180 medieval manuscripts, most descended from Byzantine editions; the end of the Isthmian book has been lost. The oldest, Ambrosianus C 222 inf. in Milan (A, twelfth century), contains only the Olympian odes; Vaticanus gr. 1312 (B, twelfth or thirteenth century) is the other key witness. In the twentieth century papyri from Oxyrhynchus, especially P.Oxy. 841 with the Paeans, recovered much of the rest of his poetry.","variants":"Medieval copies set Pindar out in short metrical units (cola) that do not show how his stanzas are really built, so the metrical structure has had to be reconstructed; August Boeckh's edition of 1811 was the first to do this convincingly. Because each strophe and its antistrophe share exactly the same metre, that strict correspondence is still editors' main tool for detecting corruption.","editions":["J. E. Sandys, The Odes of Pindar (Loeb Classical Library, 1915) — the Greek text used here","D. Arnson Svarlien, translation made for the Perseus Project (1990) — the translation used here","B. Snell and H. Maehler, Pindari Carmina cum Fragmentis (Teubner, 8th ed. 1987–89)","C. M. Bowra, Pindari Carmina (OCT, 2nd ed. 1947)","W. H. Race, Pindar, 2 vols (Loeb Classical Library, 1997)"]}},"ogl0001":{"name":"Pinytus, Saint, Bishop of Knossos","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"bishop of Cnossus in Crete (2nd century), correspondent of Dionysius of Corinth","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0059":{"name":"Plato","grc":"Πλάτων","birth":-428,"death":-348,"floruit":null,"year":-388,"era":"classical","desc":"4th-century BCE Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Plato","q":"Q859","place":"Athens","occ":["writer","poet","philosopher","philosopher of law","epigrammatist"],"nworks":37,"core":{"summary":"Plato (Πλάτων, Platōn, c. 428–348 BCE) came from a leading Athenian family (his mother's cousin Critias and her brother Charmides were leaders of the oligarchy of the Thirty in 404), became a follower of Socrates, and after Socrates' execution in 399 BCE spent the rest of his life writing and teaching. Around 387 he founded the Academy, where Aristotle studied for twenty years. He almost never speaks in his own voice: his works are dialogues, most of them led by Socrates, and they are as much drama as philosophy.\n\nThe dialogues range from short, sharp conversations about courage or piety that end in ἀπορία (aporia, \"perplexity\", literally \"no way through\"), through great works such as the Symposium, Phaedo and Republic, with their theory of Forms (εἶδος or ἰδέα, eidos or idea), the immortal soul and the ideal city, to demanding late works such as the Sophist and the Laws. The usual grouping into early, middle and late dialogues is a modern reconstruction, based partly on counting features of style, and is not beyond dispute. Unusually for an ancient author, everything Plato is known to have published seems to survive, along with some works wrongly attributed to him.\n\nHis Attic prose is among the most beautiful in Greek, and it catches the rhythms of real conversation. Particles do much of the work, and Socrates' partners keep agreeing with formulas like πάνυ γε (panu ge, \"very much so\") and πάνυ μὲν οὖν (panu men oun, \"certainly\"). The early dialogues (Apology, Crito, Euthyphro) are a classic first step for students.","timeline":[[-428,"Born in Athens to an aristocratic family (428/7 BCE)"],[-399,"Trial and execution of Socrates; the Apology and Crito dramatize the events"],[-388,"First journey to Sicily and Italy"],[-387,"Founds the Academy (approximate date)"],[-367,"Second Sicilian journey to Dionysius II; Aristotle joins the Academy"],[-361,"Third and final Sicilian journey"],[-348,"Dies at Athens (348/7 BCE), leaving the Laws unrevised"],[20,"Early first century CE: Thrasyllus, astrologer to the emperor Tiberius
