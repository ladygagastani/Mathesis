New Comedy, and his book is one of the richest quarries for lost Greek literature and for daily life.\n\nOne of the guests, the grammarian Ulpian, questions every word to see whether it is attested in classical authors: \"Is it found, or not?\" (κεῖται ἢ οὐ κεῖται; keitai ē ou keitai?), which earned him the nickname Κειτούκειτος (Keitoukeitos). The joke captures the Atticising culture of the age. Athenaeus' own Greek is educated Koine with Attic polish, and the frame dialogue is light and often funny.","timeline":[[192,"Death of Commodus, mentioned in the work as past"],[200,"The Deipnosophistae written (c. 200)"],[950,"The chief surviving manuscript, Marcianus gr. 447, is copied (10th century)"],[1514,"Aldine editio princeps, edited by Marcus Musurus"]],"manuscripts":"The full text survives in a single tenth-century manuscript in Venice, Marcianus gr. 447 (A), which has lost its beginning (the first two books and part of the third) and some other leaves. For those parts we depend on a Byzantine epitome of the whole work, preserved in several later manuscripts, which abridges and sometimes rewords the text.","variants":"Where A is missing, the epitome gives only a shortened version, so the opening books are much less complete than the rest. The thousands of quotations raise their own problems: Athenaeus sometimes quotes from memory or from intermediate collections, and editors must decide whether a variant belongs to his source or to the transmission of his own text.","editions":["G. Kaibel, Athenaei Naucratitae Dipnosophistarum libri XV, 3 vols (Teubner, 1887–90) — the Greek text used here","C. B. Gulick, Athenaeus: The Deipnosophists, 7 vols (Loeb Classical Library, 1927–41) — the Greek text and translation also used here","C. D. Yonge, The Deipnosophists, 3 vols (Bohn, 1854) — the other translation used here","S. D. Olson, Athenaeus: The Learned Banqueters, 8 vols (Loeb Classical Library, 2006–12)"]}},"tlg1205":{"name":"Athenagoras","grc":null,"birth":null,"death":null,"floruit":177,"year":177,"era":"imperial","desc":"Christian apologist of Athens, author of a Plea for the Christians (c. 177)","wiki":"https://en.wikipedia.org/wiki/Athenagoras_of_Athens","q":"Q309772","place":"Athens","occ":["writer","theologian","philosopher"],"nworks":2},"tlg1210":{"name":"Autolycus","grc":null,"birth":-360,"death":-290,"floruit":null,"year":-325,"era":"classical","desc":"ancient Greek mathematician","wiki":"https://en.wikipedia.org/wiki/Autolycus_of_Pitane","q":"Q451390","place":"Pitane","occ":["astronomer","mathematician"],"nworks":2},"tlg0614":{"name":"Babrius","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"Greek poet who put Aesop's fables into choliambic verse (probably 2nd century CE)","wiki":"https://en.wikipedia.org/wiki/Babrius","q":"Q455523","place":null,"occ":["writer","poet"],"nworks":1},"tlg2136":{"name":"Bacchius Geron","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient Greek musician","wiki":null,"q":"Q788961","place":null,"occ":["mathematician","musicologist","music theorist","musicographer"],"nworks":1},"tlg0199":{"name":"Bacchylides","grc":"Βακχυλίδης","birth":-518,"death":-451,"floruit":null,"year":-470,"era":"classical","desc":"Greek lyric poet (c. 518 – c. 451 BC)","wiki":"https://en.wikipedia.org/wiki/Bacchylides","q":"Q310681","place":"Iulis","occ":["writer","poet","dithyrambic poet","epigrammatist"],"nworks":2,"core":{"summary":"Bacchylides (Βακχυλίδης, Bakchylidēs, c. 518–c. 451 BCE) came from Iulis on the island of Ceos and was the nephew of the great lyric poet Simonides. Like Pindar, whose rival he was said to be, he composed victory odes and other choral songs for patrons across the Greek world, among them Hieron of Syracuse. For Hieron's chariot victory at Olympia in 468 it was Bacchylides, not Pindar, who wrote the celebration. The ancient scholars placed him among the nine canonical lyric poets.\n\nFor centuries almost nothing of his work survived. In 1896 the British Museum acquired from Egypt a papyrus roll with some fourteen victory odes and six dithyrambs, published by F. G. Kenyon in 1897. Among them are Ode 5, in which Heracles meets the ghost of Meleager in the underworld, and the dithyrambs about Theseus: Ode 17, where Theseus dives to the palace of Poseidon, and Ode 18, a dialogue between Aegeus and a chorus.\n\nBacchylides is clearer and more narrative than Pindar. He tells myths in vivid scenes, with rich descriptive compound adjectives and a literary Doric colouring (ᾱ for η). His poems are among the most accessible Greek lyric, and a good introduction to choral poetry.","timeline":[[-518,"Born at Iulis on Ceos (c. 518)"],[-476,"Ode 5 for Hieron of Syracuse (476)"],[-468,"Ode 3 celebrates Hieron's chariot victory at Olympia"],[-452,"His latest datable ode (c. 452)"],[-451,"Dies (c. 451)"],[1896,"The British Museum acquires the papyrus of his poems"],[1897,"F. G. Kenyon publishes the first edition"]],"manuscripts":"Bacchylides has no medieval manuscript tradition. His text comes from the great London papyrus of the Roman period (P.Lond. 733), damaged in places, supplemented by smaller papyri and by quotations in later writers.","variants":"The damage to the papyrus leaves many gaps that editors have filled by conjecture, and the order and numbering of some odes are uncertain. A few poems once attributed to him are now doubted. His birth date is uncertain; some scholars place it later than 518.","editions":["R. C. Jebb, Bacchylides: The Poems and Fragments (Cambridge, 1905) — the Greek text used here","D. Arnson Svarlien, translation made for the Perseus Project (1996) — the translation used here","B. Snell and H. Maehler, Bacchylidis Carmina cum Fragmentis (Teubner, 10th ed. 1970)","D. A. Campbell, Greek Lyric IV: Bacchylides, Corinna and Others (Loeb Classical Library, 1992)","D. Cairns, Bacchylides: Five Epinician Odes (Cambridge, 2010), with commentary"]}},"tlg1216":{"name":"Barnabae Epistula","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Epistle of Barnabas, an early Christian treatise counted among the Apostolic Fathers (c. 70–135), ascribed to Barnabas but not by him","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2040":{"name":"Basil, Saint, Bishop of Caesarea","grc":"Βασίλειος","birth":330,"death":379,"floruit":null,"year":354,"era":"lateantique","desc":"4th-century Christian bishop, theologian, and saint (329–379)","wiki":"https://en.wikipedia.org/wiki/Basil_of_Caesarea","q":"Q44258","place":"Caesarea (Cappadocia)","occ":["bishop","theologian","writer"],"nworks":2,"core":{"summary":"Basil of Caesarea (Βασίλειος, Basileios, c. 330–379 CE), called Basil the Great, came from a wealthy Christian family of Cappadocia that produced several saints, among them his sister Macrina and his brother Gregory of Nyssa. He studied at Constantinople and then at Athens, where his friendship with Gregory of Nazianzus began. After a short career as a teacher of rhetoric he turned to the ascetic life, visited monks in Egypt and Syria, and founded a community on his family's estate in Pontus. He became bishop of Caesarea in 370. As bishop he defended the Nicene faith against the emperor Valens and built outside the city a great complex for the poor and sick, known after him as the Basileias. He died, by tradition, on 1 January 379, though some scholars place his death in 377 or 378.\n\nBasil's writings shaped Eastern Christianity. His rules for monks became the foundation of Greek monasticism, his treatise On the Holy Spirit helped settle the doctrine of the Trinity, and his homilies on the six days of creation (Hexaemeron) blend scripture with Greek natural science. More than three hundred of his letters survive, a vivid picture of a bishop's life in the fourth century. His short Address to Young Men on the Value of Greek Literature, included here, argues that Christians should read the pagan poets and philosophers, taking what is good from them as bees take honey from flowers. It was one of the most widely read Greek texts of the Renaissance.\n\nBasil was trained in classical rhetoric, and his Greek is polished, Atticising prose, full of echoes of Plato and Plutarch. His letters range from formal treatises to warm notes to friends. Together with Gregory of Nazianzus and Gregory of Nyssa he is one of the 'Cappadocian Fathers'.","timeline":[[330,"Born at Caesarea in Cappadocia (c. 330)"],[350,"Studies at Athens, where he befriends Gregory of Nazianzus (c. 350–355)"],[357,"Visits monastic communities in Egypt and Syria and begins the ascetic life in Pontus"],[364,"Ordained presbyter at Caesarea"],[370,"Becomes bishop of Caesarea"],[372,"Founds the Basileias, a hospital and poorhouse outside Caesarea (c. 372)"],[375,"On the Holy Spirit (c. 375)"],[379,"Dies, by tradition on 1 January 379 (some scholars prefer 377 or 378)"]],"manuscripts":"Basil's works survive in a great many manuscripts. The letters come down in several ancient collections, arranged differently, so their order and numbering vary between editions. Some letters under his name, including parts of his supposed correspondence with the pagan rhetorician Libanius, are of doubtful authenticity. The Address to Young Men was copied, printed and translated more often than almost any other patristic text.","variants":"The chief problems concern authenticity: several works and letters transmitted under Basil's name are now attributed to others, including some letters that are probably by his brother Gregory of Nyssa. The chronology of the letters, on which the story of his episcopate depends, is also disputed, as is the year of his death.","editions":["R. J. Deferrari, Saint Basil: The Letters, 4 vols (Loeb Classical Library, 1926–34), including the Address to Young Men — the Greek text and translation used here","Y. Courtonne, Saint Basile: Lettres, 3 vols (Budé, 1957–66), the standard text of the letters","N. G. Wilson, Saint Basil on the Value of Greek Literature (London, 1975)","S. Giet, Basile de Césarée: Homélies sur l'Hexaéméron (Sources chrétiennes, 1949)"]}},"tlg1220":{"name":"Batrachomyomachia","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Battle of Frogs and Mice, a mock epic once ascribed to Homer (probably Hellenistic or early imperial)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0036":{"name":"Bion of Phlossa","grc":null,"birth":-120,"death":-57,"floruit":-100,"year":-100,"era":"hellenistic","desc":"1st century BC Greek bucolic poet","wiki":"https://en.wikipedia.org/wiki/Bion_of_Smyrna","q":"Q463364","place":"Smyrna","occ":["writer","poet"],"nworks":3},"tlg1803":{"name":"Bruti Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Greek letters ascribed to Marcus Junius Brutus, the assassin of Caesar, of disputed authenticity","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0533":{"name":"Callimachus","grc":"Καλλίμαχος","birth":-305,"death":-240,"floruit":-250,"year":-250,"era":"hellenistic","desc":"3rd-century BC Greek poet, scholar and librarian","wiki":"https://en.wikipedia.org/wiki/Callimachus","q":"Q192417","place":"Cyrene","occ":["writer","poet","librarian","elegist","scholar","mythographer"],"nworks":11,"core":{"summary":"Callimachus (Καλλίμαχος, Kallimachos, c. 305–c. 240 BCE) came from Cyrene in North Africa and spent his career at Alexandria under Ptolemy II and Ptolemy III. He was the leading poet and one of the leading scholars of the new Hellenistic world. His Pinakes (Πίνακες, \"Tables\"), a catalogue of Greek literature in 120 books based on the holdings of the Library, made him the founder of Greek bibliography, although the ancient list of the Library's heads does not include him.\n\nOnly six hymns and some sixty epigrams came down through the Middle Ages. Everything else is known from papyri and quotations. That includes his most admired work, the Aetia (Αἴτια, \"Causes\"), four books of elegiac poems on the origins of cults and customs, as well as the Iambi and the Hecale, a short epic in which Theseus shelters in the hut of a poor old woman. The last poem of the Aetia, the Lock of Berenice, is best known through Catullus' Latin version (poem 66).\n\nCallimachus championed short, polished, learned poetry over long traditional epic. In the prologue to the Aetia Apollo tells him to keep his sacrificial victim fat but his Muse \"slender\" (λεπταλέην, leptaleēn), and an epigram begins \"I hate the cyclic poem\" (ἐχθαίρω τὸ ποίημα τὸ κυκλικόν, echthairō to poiēma to kyklikon). Roman poets took him as their model, from Catullus to Propertius, who called himself the \"Roman Callimachus\", and Ovid. His Greek is dense with learning: rare words, Homeric glosses used in new senses, allusions to earlier poets, and a mix of dialects (the fifth and sixth hymns are in Doric). He wrote for readers who knew their Homer well, and he rewards slow reading.","timeline":[[-305,"Born at Cyrene (c. 305 BCE)"],[-280,"Moves to Alexandria; according to the Suda he first taught school in its suburb of Eleusis"],[-270,"At the court of Ptolemy II; compiles the Pinakes"],[-246,"The Lock of Berenice celebrates Queen Berenice II's dedication of a lock of her hair for Ptolemy III's safe return from war (246/5)"],[-240,"Dies (c. 240 BCE)"],[-60,"Catullus translates the Lock of Berenice into Latin"],[1494,"Editio princeps of the Hymns, printed in capitals at Florence by Janus Lascaris (c. 1494–96)"],[1927,"The prologue of the Aetia is published from an Oxyrhynchus papyrus (P.Oxy. 2079)"],[1949,"Rudolf Pfeiffer's edition (1949–53) gathers the fragments"]],"manuscripts":"The Hymns survive because Byzantine scholars copied them in a collection of hymns together with the Homeric Hymns and the hymns of Orpheus and Proclus. The surviving manuscripts, mostly of the fifteenth century, go back to one lost archetype. The Epigrams survive mainly in the Greek Anthology.\n\nFor the rest we depend on papyri from Egypt, which over the last century have restored large parts of the Aetia, Iambi and Hecale. We also depend on quotations by later grammarians, and on a papyrus of prose summaries (the Milan Diegeseis) that outlines many of the lost poems.","variants":"Because so much is fragmentary, the text of Callimachus is continually being rebuilt, and new papyri still change what we can read. Fragment numbers differ between editions (Pfeiffer, the Supplementum Hellenisticum, Harder's Aetia and others), so readers need to check which edition a reference uses. In the Hymns the main problems are dialect forms, which scribes normalized, and a few gaps. The dating of individual poems is much debated. So is the story of a bitter feud with Apollonius of Rhodes, which may be a later invention built on the Aetia prologue.","editions":["U. von Wilamowitz-Moellendorff, Callimachi Hymni et Epigrammata (1897) — one of the Greek texts used here","A. W. and G. R. Mair, Callimachus, Lycophron, Aratus (Loeb Classical Library, 1921) — the other Greek text used here","R. Pfeiffer, Callimachus, 2 vols (Oxford, 1949–53), the standard edition","C. A. Trypanis, Callimachus: Aetia, Iambi, Hecale and Other Fragments (Loeb Classical Library, 1958)","A. Harder, Callimachus: Aetia, 2 vols (Oxford, 2012), with commentary","A. S. Hollis, Callimachus: Hecale (Oxford, 1990; 2nd ed. 2009)"]}},"tlg2189":{"name":"Callinicus","grc":null,"birth":null,"death":null,"floruit":260,"year":260,"era":"imperial","desc":"3rd-century Greek historian, orator, rhetorician and sophist","wiki":"https://en.wikipedia.org/wiki/Callinicus_(sophist)","q":"Q1496242","place":"Petra","occ":["historian","sophist","orator"],"nworks":1},"tlg4091":{"name":"Callistratus","grc":null,"birth":null,"death":null,"floruit":300,"year":300,"era":"imperial","desc":"Greek sophist of the 3rd or 4th century CE, author of descriptions of statues","wiki":"https://en.wikipedia.org/wiki/Callistratus_(sophist)","q":"Q713482","place":null,"occ":["writer","sophist"],"nworks":1},"tlg2138":{"name":"Canticum Euripidis","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"choral lyric from Euripides' Orestes (338–44) with musical notation, on a papyrus of the 3rd–2nd century BCE (Vienna G 2315)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0362":{"name":"Carmina Delphis Inventa","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"hymns to Apollo with musical notation inscribed at Delphi, by Athenaeus and Limenius (128 BCE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0385":{"name":"Cassius Dio Cocceianus","grc":"Κάσσιος Δίων","birth":155,"death":235,"floruit":null,"year":192,"era":"imperial","desc":"Greco-Roman statesman and historian (c. 155–c. 235)","wiki":"https://en.wikipedia.org/wiki/Cassius_Dio","q":"Q185223","place":"Nicaea","occ":["military personnel","politician","historian"],"nworks":1,"core":{"summary":"Cassius Dio (Κάσσιος Δίων, Kassios Diōn, c. 155–after 229 CE) came from a senatorial family of Nicaea in Bithynia. He entered the Roman senate under Commodus and held its highest offices: praetor in 194/5, consul around 205, and governor of Africa, Dalmatia and Upper Pannonia. In 229 he was consul for the second time, with the emperor Severus Alexander as his colleague, and then retired to Nicaea. He was an eyewitness of the reigns he describes from Commodus onwards.\n\nHis Roman History (Ῥωμαϊκὴ ἱστορία, Rhōmaikē historia), in eighty books, covered Rome from the arrival of Aeneas in Italy to his own consulship in 229. He tells us that he spent ten years gathering material and twelve writing. Books 36–60, covering 69 BCE to 46 CE, the fall of the Republic and the early Principate, survive largely complete. For the rest we depend on Byzantine epitomes, above all that of the monk John Xiphilinus (11th century) for Books 36–80 and the chronicle of Zonaras for the early books, and on excerpts. He is the most important source for the reign of Augustus and for the Severan emperors.\n\nDio wrote in a classicising Attic modelled on Thucydides, with set speeches that analyse political problems; the debate between Agrippa and Maecenas on monarchy and democracy (Book 52) is the most famous. His Greek is dense but regular, and it shows how a senator of the Greek East saw the Roman empire.","timeline":[[155,"Born at Nicaea in Bithynia (c. 155)"],[180,"Enters the senate under Commodus"],[194,"Praetor (194/5)"],[205,"Consul for the first time (c. 205)"],[229,"Consul for the second time, with Severus Alexander; retires to Nicaea"],[235,"Dies, some time after 229"],[1075,"John Xiphilinus makes his epitome of Books 36–80 for Michael VII (1071–78)"],[1548,"Editio princeps (Paris, Robert Estienne)"]],"manuscripts":"Books 36–60 survive in a handful of medieval manuscripts, the oldest from the tenth and eleventh centuries. For Books 78–79 we have a much older witness, the fifth- or sixth-century Vaticanus gr. 1288, damaged at beginning and end but preserving Dio's own text. Everything else depends on Xiphilinus' epitome, on Zonaras, and on the excerpts made for Constantine VII.","variants":"Because the epitomators shortened, reworded and sometimes added to what they excerpted, it is often impossible to know Dio's exact words outside Books 36–60 and 78–79. Book numbers for the later part of the work differ between editions, which is why references are often given in the form 79(78). There are gaps within the surviving books, notably in Books 55–60.","editions":["E. Cary, Dio's Roman History, 9 vols (Loeb Classical Library, 1914–27) — the Greek text and translation used here","U. P. Boissevain, Cassii Dionis Cocceiani Historiarum Romanarum quae supersunt, 5 vols (Berlin, 1895–1931), the standard edition","Dion Cassius: Histoire romaine (Budé, 1991–)","F. Millar, A Study of Cassius Dio (Oxford, 1964)"]}},"tlg0733":{"name":"Cassius Iatrosophista","grc":null,"birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"ancient Greek physician","wiki":null,"q":"Q61474378","place":null,"occ":["iatrosophist"],"nworks":1},"tlg2178":{"name":"Cassius Longinus","grc":null,"birth":213,"death":273,"floruit":null,"year":243,"era":"imperial","desc":"Platonist philosopher and literary critic at Athens, teacher of Porphyry and adviser to Queen Zenobia (c. 213–273)","wiki":"https://en.wikipedia.org/wiki/Cassius_Longinus_(philosopher)","q":"Q436634","place":null,"occ":["philosopher"],"nworks":3},"tlg4102":{"name":"Catenae (Novum Testamentum)","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"New Testament catenae: Byzantine chains of excerpts from patristic commentaries","wiki":null,"q":null,"place":null,"occ":[],"nworks":33},"tlg1247":{"name":"Cebes","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"pseudonymous or attributed ancient Greek author associated with the Tablet of Cebes","wiki":null,"q":"Q61474568","place":"Thebes","occ":["philosopher"],"nworks":1},"tlg1252":{"name":"Certamen Homeri et Hesiodi","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"The Contest of Homer and Hesiod, an anonymous work of the 2nd century CE drawing on Alcidamas' Museum (4th century BCE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0554":{"name":"Chariton of Aphrodisias","grc":"Χαρίτων","birth":null,"death":null,"floruit":60,"year":60,"era":"imperial","desc":"Greek novelist, author of Callirhoe (probably mid-1st century CE)","wiki":"https://en.wikipedia.org/wiki/Chariton","q":"Q434567","place":"Aphrodisias","occ":["writer","novelist"],"nworks":1,"core":{"summary":"Chariton (Χαρίτων, Charitōn, probably mid-1st century CE) introduces himself in the first sentence of his novel: \"I, Chariton of Aphrodisias, secretary of the rhetor Athenagoras, will tell a love story that happened in Syracuse.\" Aphrodisias was a prosperous Greek city in Caria, in south-western Asia Minor. Nothing more is known of him. Most scholars now date him to the reign of Claudius or Nero, though some place him earlier.\n\nHis Callirhoe (Τὰ περὶ Χαιρέαν καὶ Καλλιρρόην, Ta peri Chairean kai Kallirrhoēn, \"The Story of Chaereas and Callirhoe\"), in eight books, is the earliest Greek novel to survive complete. Callirhoe, the beautiful daughter of the Syracusan general Hermocrates who defeated the Athenian expedition of 415–413 BCE, marries Chaereas. He strikes her in a fit of jealousy; she is buried alive and carried off by tomb robbers, and sold as a slave in Miletus, where she marries again. The story moves to the court of the Persian king at Babylon, through a trial and a war, to a happy reunion in Syracuse. The historical setting, the speeches and the scenes of public life give the novel the feel of historiography.\n\nChariton's Greek is simple and clear, closer to the educated Koine of his day than to the strict Attic of later novelists. He quotes Homer some thirty times at moments of high emotion, and his narrator often comments on events. A good reader for anyone who has finished a first year of Greek.","timeline":[[-413,"The Athenian defeat at Syracuse, the historical background of the novel"],[50,"Callirhoe written (probably mid-1st century CE)"],[150,"Papyrus fragments show that the novel was read in Egypt in the 2nd century CE"],[1250,"The Florentine manuscript that preserves almost the whole text is copied (13th century)"],[1709,"Bernard de Montfaucon draws attention to the Florentine manuscript"],[1750,"Editio princeps by J. P. d'Orville (Amsterdam)"]],"manuscripts":"Callirhoe survives in a single medieval manuscript, the thirteenth-century Laurentianus Conventi Soppressi 627 in Florence (F), which is our only witness for about 95 per cent of the text. The same book contains Xenophon of Ephesus and Longus and part of Achilles Tatius. A few papyrus fragments of the second and third centuries CE and an early parchment codex confirm the text in places.","variants":"With only one manuscript, errors must be corrected by conjecture, and there are small gaps. Scholars debate the date: a passage in the Roman satirist Persius (1.134) mentions a 'Callirhoe', which may or may not refer to this novel. The ending, in which Chariton addresses his readers directly, has been read as proof that he knew he was writing for a popular audience.","editions":["R. Hercher, Erotici Scriptores Graeci, vol. 2 (Teubner, 1859) — the Greek text used here","W. E. Blake, Charitonis Aphrodisiensis de Chaerea et Callirhoe (OCT, 1938)","B. P. Reardon, Chariton Aphrodisiensis: De Callirhoe narrationes amatoriae (Teubner, 2004)","G. P. Goold, Chariton: Callirhoe (Loeb Classical Library, 1995), with translation","S. Tilg, Chariton of Aphrodisias and the Invention of the Greek Love Novel (Oxford, 2010)"]}},"tlg0041":{"name":"Chionis Epistulae","grc":null,"birth":null,"death":-353,"floruit":null,"year":-382,"era":"classical","desc":"Letters of Chion of Heraclea, an anonymous epistolary novel (1st or 2nd century CE) about a pupil of Plato who killed the tyrant Clearchus","wiki":"https://en.wikipedia.org/wiki/Chion_of_Heraclea","q":"Q1254602","place":"Heraclea Pontica","occ":["philosopher"],"nworks":1},"tlg2371":{"name":"Chronicon Paschale","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Easter Chronicle, an anonymous Byzantine world chronicle compiled at Constantinople in the 630s","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1264":{"name":"Chrysippus","grc":"Χρύσιππος","birth":-279,"death":-206,"floruit":null,"year":-244,"era":"hellenistic","desc":"Greek Stoic philosopher (c.279–c.206 BC)","wiki":"https://en.wikipedia.org/wiki/Chrysippus","q":"Q211411","place":"Soli","occ":["writer","philosopher"],"nworks":4,"core":{"summary":"Chrysippus of Soli (Χρύσιππος, Chrysippos, c. 279–206 BCE) came to Athens from Cilicia, studied with the Stoic Cleanthes and in Plato's Academy, and succeeded Cleanthes as head of the Stoa around 230 BCE. He gave Stoicism its systematic form. Ancient readers said that \"if there had been no Chrysippus, there would have been no Stoa\", and for later centuries 'the Stoic view' usually meant his view.\n\nHe was enormously productive: Diogenes Laertius credits him with more than 705 books. He was above all a logician, and his propositional logic, with its five 'indemonstrable' argument forms, is one of the great achievements of ancient philosophy; it was rediscovered and appreciated only in the twentieth century. He also wrote on physics, fate and providence, the soul and the passions, and ethics.\n\nNot one of his works survives complete. We know him from quotations and reports in later writers, many of them critics: Plutarch, who wrote on the Stoics' self-contradictions; Galen, who attacked his theory of the soul; Diogenes Laertius; Cicero; and Sextus Empiricus. Charred papyri from Herculaneum preserve parts of his Logical Investigations. Ancient critics found his style careless and repetitive and mocked his habit of quoting poets at length. One joke ran that if you removed the quotations from one of his books, only blank papyrus would remain.","timeline":[[-279,"Born at Soli in Cilicia (c. 279)"],[-260,"Comes to Athens; studies with Cleanthes and in the Academy"],[-230,"Succeeds Cleanthes as head of the Stoa (c. 230)"],[-206,"Dies at Athens (c. 206), reportedly aged 73"],[1752,"Herculaneum papyri discovered, some containing his Logical Investigations"],[1903,"Hans von Arnim's Stoicorum Veterum Fragmenta collects his fragments (1903–05)"]],"manuscripts":"There is no manuscript tradition of Chrysippus. His words survive in quotations embedded in later authors, each transmitted in its own manuscripts, and in a few papyri from the library of the Villa of the Papyri at Herculaneum.","variants":"The chief difficulty is deciding what Chrysippus actually said. Many reports come from hostile sources, such as Plutarch and Galen, who may quote selectively or paraphrase. Others do not distinguish him from Stoics in general. Von Arnim's collection arranges the fragments by topic, and some of his attributions are doubtful.","editions":["H. von Arnim, Stoicorum Veterum Fragmenta, vols 2–3 (Teubner, 1903–05; index volume 1924) — the text used here","A. A. Long and D. N. Sedley, The Hellenistic Philosophers, 2 vols (Cambridge, 1987)","K. Hülser, Die Fragmente zur Dialektik der Stoiker, 4 vols (Stuttgart, 1987–88)"]}},"tlg0363":{"name":"Claudius Ptolemaeus","grc":"Κλαύδιος Πτολεμαῖος","birth":100,"death":170,"floruit":null,"year":135,"era":"imperial","desc":"Greek mathematician, astronomer and geographer of Alexandria (2nd century CE)","wiki":"https://en.wikipedia.org/wiki/Ptolemy","q":"Q34943","place":"Ptolemais Hermiou","occ":["astronomer","naturalist","writer","astrologer","mathematician","geographer"],"nworks":3,"core":{"summary":"Claudius Ptolemy (Κλαύδιος Πτολεμαῖος, Klaudios Ptolemaios, c. 100–c. 170 CE) worked at Alexandria. The observations he records in his great astronomical work are dated between 127 and 141 CE, and almost nothing else is known of his life. His Latin family name shows that he was a Roman citizen; he wrote in Greek.\n\nHis Mathematical Syntaxis (Μαθηματικὴ σύνταξις, Mathēmatikē syntaxis), in thirteen books, set out a complete geometrical model of the motions of the sun, moon, planets and stars around a stationary earth, using eccentric circles, epicycles and the 'equant' point. Arab astronomers called it al-majisṭī (\"the greatest\"), which gave the Latin Almagest. It remained the foundation of astronomy until Copernicus, whose De revolutionibus (1543) followed its structure closely. Ptolemy also wrote the Tetrabiblos (\"Four Books\"), the standard ancient textbook of astrology, a Geography giving coordinates for some 8,000 places, and the Harmonics, a treatise on musical theory.\n\nHis Greek is the clear, technical prose of Hellenistic science. Numbers are written with the letters of the alphabet, and fractions in the Babylonian sexagesimal system, which is why we still divide degrees and hours into sixty minutes and sixty seconds. Readers will need a translation with notes for the mathematics, but the introductory chapters of the Almagest and the Tetrabiblos are approachable.","timeline":[[100,"Born (c. 100)"],[127,"First of the observations recorded in the Almagest"],[141,"Last recorded observation"],[150,"Writes the Almagest (c. 150), followed by the Tetrabiblos, Geography and Harmonics"],[170,"Dies (c. 170)"],[370,"Theon of Alexandria writes a commentary on the Almagest"],[827,"Translated into Arabic at Baghdad"],[1160,"A literal Latin translation made directly from the Greek in Sicily (c. 1160)"],[1175,"Gerard of Cremona completes his Latin translation from the Arabic at Toledo"],[1538,"Editio princeps of the Greek Almagest (Basel, Simon Grynaeus)"],[1543,"Copernicus' De revolutionibus challenges the Ptolemaic system"]],"manuscripts":"The Almagest survives in two important ninth-century manuscripts, Parisinus gr. 2389 (largely in capitals) and Vaticanus gr. 1594, the finest witness, rich in notes. J. L. Heiberg's edition was based on these and a few others. Arabic translations and the medieval Latin versions made from Arabic and from Greek are also important evidence. The Tetrabiblos, Geography and Harmonics each have separate traditions, and the Geography's maps and coordinate lists vary widely between manuscripts.","variants":"In the Almagest the main problems are numerical: scribes miscopied the letter-numerals in the tables, and editors must check them against Ptolemy's own calculations. The coordinates of the Geography were revised and corrupted many times, so the maps drawn from them differ. Some works under his name, such as the Karpos (Centiloquium), a collection of astrological aphorisms, are not by him.","editions":["J. L. Heiberg, Claudii Ptolemaei Opera quae exstant omnia I: Syntaxis Mathematica, 2 vols (Teubner, 1898–1903) — the Almagest text used here","F. E. Robbins, Ptolemy: Tetrabiblos (Loeb Classical Library, 1940), and F. Boll and E. Boer's Teubner edition (1954 printing) — the Tetrabiblos texts used here","K. von Jan, Musici Scriptores Graeci (Teubner, 1895) — the musical text used here","G. J. Toomer, Ptolemy's Almagest (London, 1984), the standard English translation","W. Hübner, Apotelesmatika (Teubner, 1998), the current edition of the Tetrabiblos","J. L. Berggren and A. Jones, Ptolemy's Geography: An Annotated Translation of the Theoretical Chapters (Princeton, 2000)"]}},"tlg1269":{"name":"Cleanthes","grc":null,"birth":-331,"death":-232,"floruit":null,"year":-281,"era":"hellenistic","desc":"Greek Stoic philosopher and boxer (3rd-century BC)","wiki":"https://en.wikipedia.org/wiki/Cleanthes","q":"Q310149","place":"Assos","occ":["writer","philosopher","pugilist"],"nworks":1},"tlg1271":{"name":"Clemens Romanus (Clement of Rome)","grc":null,"birth":null,"death":99,"floruit":96,"year":96,"era":"imperial","desc":"bishop of Rome in the late 1st century, author of a letter to the Corinthians (c. 96); later tradition lists him as the third successor of Peter","wiki":"https://en.wikipedia.org/wiki/Clement_of_Rome","q":"Q42887","place":"Rome","occ":["bishop"],"nworks":9},"tlg0555":{"name":"Clement of Alexandria","grc":"Κλήμης ὁ Ἀλεξανδρεύς","birth":150,"death":215,"floruit":null,"year":182,"era":"imperial","desc":"Christian theologian (c.150 – c.215)","wiki":"https://en.wikipedia.org/wiki/Clement_of_Alexandria","q":"Q188883","place":"Athens","occ":["writer","theologian","philosopher"],"nworks":7,"core":{"summary":"Clement of Alexandria (Κλήμης ὁ Ἀλεξανδρεύς, Klēmēs ho Alexandreus; Titus Flavius Clemens, c. 150–c. 215 CE) was probably born in Athens to a pagan family. After travelling in search of teachers he settled in Alexandria with the Christian teacher Pantaenus and became a leading teacher of the Christian community there. He left the city during the persecution of 202 and died some years later, perhaps in Asia Minor or Palestine.\n\nClement was the first Christian writer to engage fully with Greek philosophy and literature, arguing that philosophy had prepared the Greeks for Christ as the Law had prepared the Jews. His three main works form a sequence. The Protrepticus (\"Exhortation to the Greeks\") urges pagans to leave their myths and cults. The Paedagogus (\"Tutor\") teaches the convert how to live, down to food, dress and table manners. The Stromateis (\"Patchwork\" or \"Miscellanies\"), in eight books, is a deliberately loose collection of reflections on the true Christian 'gnostic'. He also wrote a sermon, Who Is the Rich Man That Is Saved?, and made excerpts from the Valentinian teacher Theodotus.\n\nClement writes a learned, ornate Greek and quotes hundreds of classical authors, poets, philosophers and historians, preserving many passages from lost works. The disputed Letter to Theodore, containing a 'Secret Gospel of Mark', was published by Morton Smith in 1973 from an eighteenth-century copy; its authenticity is still debated.","timeline":[[150,"Born, probably at Athens (c. 150)"],[180,"Settles in Alexandria and studies with Pantaenus"],[195,"Protrepticus and Paedagogus (c. 195)"],[202,"Leaves Alexandria during the persecution under Septimius Severus"],[215,"Dies (c. 215)"],[914,"The Arethas codex (Parisinus gr. 451), with the Protrepticus and Paedagogus, is copied"],[1973,"Morton Smith publishes the disputed Letter to Theodore"]],"manuscripts":"The Protrepticus and Paedagogus depend essentially on the Arethas codex (Parisinus gr. 451), copied in 913–914 for Arethas of Caesarea, the oldest collection of Christian apologetic writings. The Stromateis survive in a single eleventh-century manuscript in Florence (Laurentianus V 3), which may also have belonged to Arethas. The shorter works have separate traditions.","variants":"Because the major works each rest on essentially one manuscript, many corruptions and gaps have to be repaired by conjecture. The Stromateis end abruptly, and the eighth book appears to be a collection of notes rather than a finished work. The authenticity of the Letter to Theodore is one of the most debated questions in early Christian studies.","editions":["O. Stählin, Clemens Alexandrinus, 3 vols (Die Griechischen Christlichen Schriftsteller, 1905–09) — the Greek text used here for most works","G. W. Butterworth, Clement of Alexandria (Loeb Classical Library, 1919) — the Greek text and translation used here for the Protrepticus and Who Is the Rich Man","M. Marcovich, Clementis Alexandrini Protrepticus (Leiden, 1995) and Paedagogus (2002)","J. Ferguson, Clement of Alexandria: Stromateis Books One to Three (Washington, 1991)"]}},"tlg1272":{"name":"Cleomedes","grc":null,"birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"ancient Greek astronomer","wiki":"https://en.wikipedia.org/wiki/Cleomedes","q":"Q31278","place":"Lysimachia","occ":["astronomer","mathematician"],"nworks":1},"tlg0361":{"name":"Cleonides","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"ancient Greek musicologist and music theorist","wiki":"https://en.wikipedia.org/wiki/Cleonides","q":"Q4223358","place":null,"occ":["musicologist","music theorist"],"nworks":1},"tlg4081":{"name":"Colluthus of Lycopolis","grc":null,"birth":500,"death":600,"floruit":null,"year":550,"era":"lateantique","desc":"ancient Greek poet","wiki":"https://en.wikipedia.org/wiki/Coluthus","q":"Q1779484","place":"Lycopolis","occ":["writer","poet"],"nworks":1},"tlg2632":{"name":"Comarius","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"alchemical writer; the Book of Comarius presents him teaching Cleopatra the alchemist","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1287":{"name":"Crantor","grc":null,"birth":-344,"death":-275,"floruit":null,"year":-309,"era":"hellenistic","desc":"3rd-century BC Greek philosopher and scholarch","wiki":"https://en.wikipedia.org/wiki/Crantor","q":"Q434773","place":"Soli","occ":["philosopher"],"nworks":1},"tlg0623":{"name":"Cratetis Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the Cynic Crates of Thebes, later Cynic compositions","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0657":{"name":"Crateuas","grc":null,"birth":-200,"death":-100,"floruit":null,"year":-150,"era":"hellenistic","desc":"ancient Greek physician and rhizotomist","wiki":"https://en.wikipedia.org/wiki/Crateuas_(physician)","q":"Q743993","place":"Kingdom of Pontus","occ":["pharmacologist","botanist"],"nworks":1},"tlg0319":{"name":"Critias","grc":null,"birth":-460,"death":-403,"floruit":null,"year":-431,"era":"classical","desc":"Athenian politician (c. 460 – 403 BC)","wiki":"https://en.wikipedia.org/wiki/Critias","q":"Q294092","place":"Athens","occ":["writer","poet","politician","philosopher","tragedy writer"],"nworks":1},"tlg1482":{"name":"Cyranides","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Cyranides (Kyranides), a compilation on the magical and medical virtues of stones, plants and animals (probably 4th century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg4090":{"name":"Cyril of Alexandria","grc":null,"birth":376,"death":444,"floruit":null,"year":410,"era":"lateantique","desc":"bishop (patriarch) of Alexandria from 412 to 444 and theologian","wiki":"https://en.wikipedia.org/wiki/Cyril_of_Alexandria","q":"Q44079","place":"Egypt","occ":["bishop","theologian"],"nworks":1},"tlg2655":{"name":"Damigeron","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"name attached to a lapidary on the magical and healing powers of stones","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg4021":{"name":"David the Invincible","grc":null,"birth":null,"death":null,"floruit":575,"year":575,"era":"lateantique","desc":"6th-century Neoplatonist commentator on Aristotle, of the Alexandrian school","wiki":"https://en.wikipedia.org/wiki/David_the_Invincible","q":"Q1173486","place":null,"occ":["philosopher"],"nworks":2},"tlg0535":{"name":"Demades","grc":null,"birth":-380,"death":-317,"floruit":null,"year":-348,"era":"classical","desc":"Athenian orator","wiki":"https://en.wikipedia.org/wiki/Demades","q":"Q211430","place":"Paeania","occ":["politician","orator"],"nworks":1},"tlg0613":{"name":"Demetrius of Phaleron","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"rhetorical treatise On Style, transmitted under the name of Demetrius of Phalerum but by a later writer; its date is disputed","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1304":{"name":"Democritus","grc":null,"birth":-460,"death":-360,"floruit":null,"year":-410,"era":"classical","desc":"Greek philosopher (c. 460–c. 370 BC)","wiki":"https://en.wikipedia.org/wiki/Democritus","q":"Q41980","place":"Abdera","occ":["mathematician","philosopher"],"nworks":1},"tlg0014":{"name":"Demosthenes","grc":"Δημοσθένης","birth":-384,"death":-322,"floruit":null,"year":-352,"era":"classical","desc":"classical Athenian statesman and orator","wiki":"https://en.wikipedia.org/wiki/Demosthenes","q":"Q117253","place":"Paeania","occ":["writer","politician","diplomat","orator"],"nworks":63,"core":{"summary":"Demosthenes (Δημοσθένης, Dēmosthenēs, 384–322 BCE) was the greatest orator of Athens; later antiquity called him simply ὁ ῥήτωρ (ho rhētōr, \"the orator\"), as Homer was \"the poet\". His father died when he was seven. He learned his craft, by tradition under the orator Isaeus, and first used it in lawsuits against the guardians who had squandered his inheritance. Plutarch, citing Demetrius of Phalerum, tells how he overcame a weak voice and an awkward delivery by practising with pebbles in his mouth, a story best taken as anecdote.\n\nHis great cause was resistance to Philip II of Macedon. In the Philippics and Olynthiacs he urged the Athenians to act before it was too late. After Philip defeated Athens and Thebes at Chaeronea in 338 BCE, his rival Aeschines attacked a proposal to crown Demosthenes for his services. In reply Demosthenes defended his whole career in On the Crown (330 BCE), and Aeschines won so few votes that he left Athens. Ancient critics regarded the speech as his masterpiece. He died in 322, taking poison rather than fall into the hands of Macedonian soldiers.\n\nHis prose is tightly built, varied in rhythm and relentlessly argued. He avoids hiatus (a vowel at the end of one word meeting a vowel at the start of the next) and long runs of short syllables, and he can turn argument into oath. In On the Crown, defending the decision to fight at Chaeronea, he swears \"No, by those of our ancestors who faced the danger at Marathon\" (οὐ μὰ τοὺς Μαραθῶνι προκινδυνεύσαντας τῶν προγόνων, 18.208). He was the model for generations of orators; Cicero named his own speeches against Mark Antony Philippics after his.","timeline":[[-384,"Born in Athens, of the deme Paeania"],[-363,"Prosecutes his guardians in the speeches Against Aphobus"],[-354,"On the Navy-Boards, his first surviving speech to the Assembly"],[-351,"First Philippic"],[-349,"Olynthiacs, urging help for Olynthus against Philip"],[-346,"Serves on the embassies that negotiate the Peace of Philocrates with Philip"],[-343,"On the False Embassy, prosecuting Aeschines, who is narrowly acquitted"],[-341,"Third Philippic"],[-338,"Battle of Chaeronea; Philip defeats Athens and Thebes"],[-330,"On the Crown, defeating Aeschines"],[-323,"Convicted over money from Alexander's fugitive treasurer Harpalus, fined fifty talents and exiled (324/3); recalled after Alexander's death"],[-322,"Takes poison in the sanctuary of Poseidon on Calauria to escape Macedonian arrest"],[1504,"Aldine editio princeps (Venice)"]],"manuscripts":"The text rests above all on a tenth-century manuscript in Paris (Parisinus gr. 2934, S), with three other early manuscripts: Marcianus gr. 416 in Venice (F), Monacensis gr. 485 in Munich (once at Augsburg and so called Augustanus, A) and Parisinus gr. 2935 (Y). S often lacks words and phrases that the others include. Whether these are later additions in the other manuscripts or omissions in S has long been argued, but since the nineteenth century editors have usually given S the greater weight.\n\nDemosthenes became a school classic early, and many papyri of his speeches survive from Egypt, the earliest from the Ptolemaic period. One papyrus preserves part of a commentary on the Philippics by the Alexandrian scholar Didymus (first century BCE), a rare glimpse of ancient scholarship on the speeches.","variants":"Not all of the 61 speeches in the collection are by Demosthenes. Several were written for or by others: Against Neaera and a group of other private speeches are the work of Apollodorus. The Fourth Philippic is doubted, On Halonnesus was attributed in antiquity to Hegesippus, and On the Treaty with Alexander, the Funeral Speech, the Erotic Essay and several of the Letters are widely considered spurious. The decrees and letters quoted in On the Crown were inserted later and are not genuine documents. The manuscript families also disagree over hundreds of small expansions to the text.","editions":["S. H. Butcher and W. Rennie, Demosthenis Orationes, 3 vols (OCT, 1903–31) — the Greek text used here","J. H. Vince, C. A. Vince, A. T. Murray, N. W. and N. J. DeWitt, Demosthenes, 7 vols (Loeb Classical Library, 1926–49) — the translations used here","M. R. Dilts, Demosthenis Orationes, 4 vols (OCT, 2002–09), now the standard text","H. Yunis, Demosthenes: On the Crown (Cambridge, 2001), with commentary"]}},"tlg2036":{"name":"Dexippus","grc":null,"birth":null,"death":null,"floruit":350,"year":350,"era":"lateantique","desc":"Neoplatonist philosopher, pupil of Iamblichus (4th century)","wiki":"https://en.wikipedia.org/wiki/Dexippus_(philosopher)","q":"Q369129","place":null,"occ":["philosopher"],"nworks":1},"tlg1309":{"name":"Dialexeis","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Dissoi Logoi ('Double Arguments'), an anonymous sophistic treatise of c. 400 BCE","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1311":{"name":"Didache","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Didache ('Teaching of the Twelve Apostles'), an early Christian church manual (late 1st or early 2nd century)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0357":{"name":"Didymus Alexandrinus","grc":null,"birth":-50,"death":50,"floruit":null,"year":0,"era":"imperial","desc":"metrologist","wiki":null,"q":"Q84027027","place":"Alexandria","occ":["writer","mathematician","metrologist"],"nworks":1},"tlg0029":{"name":"Dinarchus","grc":null,"birth":-360,"death":-292,"floruit":-330,"year":-330,"era":"classical","desc":"4th-century BC Greek speechwriter","wiki":"https://en.wikipedia.org/wiki/Dinarchus","q":"Q473421","place":"Corinth","occ":["orator"],"nworks":3},"tlg0612":{"name":"Dio Chrysostom","grc":"Δίων Χρυσόστομος","birth":40,"death":null,"floruit":null,"year":80,"era":"imperial","desc":"Greek orator, writer, philosopher and historian (c. 40 – c. 115)","wiki":"https://en.wikipedia.org/wiki/Dio_Chrysostom","q":"Q334457","place":"Prusa","occ":["writer","philosopher","orator"],"nworks":1,"core":{"summary":"Dio of Prusa (Δίων, Diōn, c. 40–after 111 CE), later called Chrysostom (Χρυσόστομος, Chrysostomos, \"golden-mouthed\") for his eloquence, came from a leading family of Prusa in Bithynia. He began as a sophist and turned to philosophy under the Stoic Musonius Rufus. In the early 80s the emperor Domitian banished him from Rome, Italy and his homeland, and he spent years wandering in the dress of a Cynic philosopher, as far as the Greek cities on the northern Black Sea. Recalled by Nerva in 96, he returned to Prusa and public life; Pliny the Younger's letters to Trajan show him entangled around 111 in a dispute over a building project he had undertaken for his city.\n\nEighty speeches survive under his name, two of which (37 and 64) are now assigned to the sophist Favorinus. They range widely: four orations On Kingship addressed to Trajan; the Euboean Oration (7), which describes the simple life of a family of hunters and the problems of the urban poor; the Olympic Oration (12), on Phidias' statue of Zeus and how we come to know the gods; the Borysthenitic Oration (36), set in a Greek colony on the Black Sea; and the playful Trojan Oration (11), which argues that Troy was never taken. Many are addressed to the cities of Asia Minor, urging concord.\n\nDio's Greek is Atticising but clear and natural, modelled on Plato and Xenophon rather than on the more mannered sophists. His turn from rhetoric to philosophy became a famous story, told later by Synesius of Cyrene. He is a good author for readers who want imperial Greek prose that is elegant but not difficult.","timeline":[[40,"Born at Prusa in Bithynia (c. 40)"],[82,"Banished by Domitian from Rome, Italy and Bithynia (early 80s)"],[96,"Recalled from exile by Nerva"],[100,"Delivers orations On Kingship, traditionally linked with Trajan (c. 100)"],[111,"Involved in a lawsuit over a building project at Prusa, reported by Pliny the Younger"],[405,"Synesius of Cyrene writes his Dio, on Dio's turn from sophistry to philosophy (c. 405)"]],"manuscripts":"The speeches survive in a good number of medieval manuscripts, which editors divide into families that differ in the number and order of the speeches. Some speeches are preserved in only one branch of the tradition.","variants":"Besides the two speeches now given to Favorinus, a few others are of doubtful authenticity, and some appear to be drafts or fragments rather than finished works. The order and numbering of the speeches reflect later editors, not Dio. Dating individual speeches, especially those set during his exile, is often uncertain.","editions":["H. von Arnim, Dionis Prusaensis quem vocant Chrysostomum quae exstant omnia, 2 vols (Berlin, 1893–96) — the Greek text used here","J. W. Cohoon and H. L. Crosby, Dio Chrysostom, 5 vols (Loeb Classical Library, 1932–51)","D. A. Russell, Dio Chrysostom: Orations VII, XII and XXXVI (Cambridge, 1992), with commentary"]}},"tlg0060":{"name":"Diodorus Siculus","grc":"Διόδωρος Σικελιώτης","birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"1st-century BC Greek historian","wiki":"https://en.wikipedia.org/wiki/Diodorus_Siculus","q":"Q171241","place":"Agyrion","occ":["historian","geographer","mythographer"],"nworks":1,"core":{"summary":"Diodorus of Sicily (Διόδωρος Σικελιώτης, Diodōros Sikeliōtēs, fl. c. 60–30 BCE) came from Agyrium in the interior of Sicily. He tells us that he visited Egypt in the 180th Olympiad (60–56 BCE), that he lived for many years in Rome, and that he spent thirty years on his history. The last events he mentions, among them Octavian's colony at Tauromenium in 36 BCE, show that he was still writing in the 30s.\n\nHis Library of History (Βιβλιοθήκη ἱστορική, Bibliothēkē historikē), in forty books, was a universal history from the mythical age to Caesar's wars in Gaul. Books 1–5 (the myths and early history of Egypt, Mesopotamia, India, Scythia, Arabia, North Africa and the Greeks) and Books 11–20 (Greek and Sicilian history from 480 to 302 BCE) survive complete. The rest are known from Byzantine excerpts and quotations. For much of the fourth century BCE, and for the wars of Alexander's successors, which he drew from the lost Hieronymus of Cardia, Diodorus is our only continuous narrative.\n\nDiodorus has often been dismissed as a mere copyist of better historians such as Ephorus, Timaeus and Posidonius, and he does follow one source at a time. More recent scholarship stresses his own moral purpose and his vision of history as a single story of all humanity. His Greek is plain, serviceable Koine, easy to read and a good introduction to Hellenistic prose.","timeline":[[-90,"Born at Agyrium in Sicily (c. 90)"],[-60,"Visits Egypt during the 180th Olympiad (60–56 BCE)"],[-36,"Mentions Octavian's colony at Tauromenium, among the last events he records"],[-30,"Completes the Library of History (c. 30)"],[950,"Excerpts from the lost books preserved in the collections made for Constantine VII (10th century)"],[1472,"Poggio Bracciolini's Latin translation of Books 1–5 printed at Bologna"],[1539,"Books 16–20 first printed in Greek at Basel"],[1559,"Henri Estienne prints all the surviving books"]],"manuscripts":"The two surviving blocks of the history, Books 1–5 and Books 11–20, reached the Middle Ages separately and have different manuscript traditions, the oldest witnesses dating from the tenth and eleventh centuries. The lost books survive only in fragments: excerpts made for the emperor Constantine VII, summaries by Photius, and quotations in later writers such as Eusebius, who used Diodorus for early history.","variants":"Because Diodorus reproduces his sources closely, much scholarship has tried to identify which lost historian lies behind each section, and his own dates and numbers are often confused when he combines accounts. His chronology, which arranges events by Athenian archons and Roman consuls, contains many errors of a year or more. The text itself is fairly sound, but proper names are often corrupt.","editions":["I. Bekker, L. Dindorf, F. Vogel and C. T. Fischer, Diodori Bibliotheca Historica, 5 vols (Teubner, 1888–1906) — the Greek text used here","C. H. Oldfather and others, Diodorus of Sicily, 12 vols (Loeb Classical Library, 1933–67) — the Greek text and translation used here for several books","P. Bertrac, F. Chamoux and others, Diodore de Sicile: Bibliothèque historique (Budé, 1972–)","K. S. Sacks, Diodorus Siculus and the First Century (Princeton, 1990)"]}},"tlg1320":{"name":"Diogenes Babylonius","grc":null,"birth":-240,"death":-150,"floruit":null,"year":-195,"era":"hellenistic","desc":"ancient Greek philosopher of the Stoic school","wiki":"https://en.wikipedia.org/wiki/Diogenes_of_Babylon","q":"Q434203","place":"Seleucia","occ":["astrologer","diplomat","philosopher"],"nworks":1},"tlg0004":{"name":"Diogenes Laertius","grc":"Διογένης Λαέρτιος","birth":null,"death":null,"floruit":225,"year":225,"era":"imperial","desc":"Greek biographer of the philosophers, probably of the early 3rd century CE","wiki":"https://en.wikipedia.org/wiki/Diogenes_Laertius","q":"Q59138","place":null,"occ":["historian","biographer","philosopher","philosophy historian"],"nworks":1,"core":{"summary":"Diogenes Laertius (Διογένης Λαέρτιος, Diogenēs Laertios), who probably lived in the first half of the third century CE, compiled the Lives and Opinions of Eminent Philosophers in ten books. We know almost nothing about him beyond what the work reveals; at one point (3.47) he addresses a woman reader who \"loves Plato\". He arranges the philosophers in two lines of succession, an Ionian one that starts from Thales' pupil Anaximander and runs through Socrates and Plato, and an Italian one from Pythagoras, and ends with Epicurus. His work is a scrapbook more than a history: gossip, anecdotes, lists of books and witty sayings sit beside summaries of doctrine and some rather weak epigrams of his own.\n\nIt is nonetheless indispensable. Diogenes names more than two hundred earlier authors, most of them now lost, though he often knew them at second hand, and his work is our most important single source for the lives of the Greek philosophers. Book 10 quotes three letters of Epicurus, his will and his Principal Doctrines (Κύριαι δόξαι, Kyriai doxai) word for word, which makes it one of the main places where Epicurus survives in his own words.\n\nHis Greek is the plain prose of the imperial period and one of the easier texts for a reader moving on from a grammar. Much of it is built from chreiai, short anecdotes that end in a saying and follow a fixed pattern: ἐρωτηθεὶς … ἔφη (erōtētheis … ephē, \"asked …, he said\").","timeline":[[225,"Approximate date of composition (the latest philosophers he mentions belong to the early third century)"],[1150,"Twelfth and thirteenth centuries: the three primary manuscripts (B, P, F) are copied"],[1433,"Ambrogio Traversari's Latin translation, finished about this year, circulates in Renaissance Italy"],[1533,"Editio princeps (Froben, Basel)"],[1692,"Marcus Meibom's edition introduces the section numbers still used for citation"]],"manuscripts":"Three medieval manuscripts are primary: one in Naples (B, twelfth century), one in Paris (Parisinus gr. 1759, P) and one in Florence (F, thirteenth century). All three go back to a single damaged ancestor. A Vatican manuscript (Vaticanus gr. 96) preserves an independent set of excerpts, and the Byzantine encyclopaedia known as the Suda draws on the work extensively.","variants":"The text of Epicurus' letters in Book 10 is badly corrupted, and repairing it is central to the study of Epicureanism; the authenticity of one of them, the Letter to Pythocles, is also debated. Book 7, on the Stoics, breaks off in the middle of the life of Chrysippus; a table of contents preserved in one manuscript shows that the lost ending covered many more Stoics. The standard section numbers were introduced by Meibom in 1692.","editions":["R. D. Hicks, Diogenes Laertius, 2 vols (Loeb Classical Library, 1925) — the Greek text and translation used here","T. Dorandi, Diogenes Laertius: Lives of Eminent Philosophers (Cambridge, 2013), the new standard text","M. Marcovich, Diogenis Laertii Vitae Philosophorum (Teubner, 1999–2002)","H. S. Long, Diogenis Laertii Vitae Philosophorum, 2 vols (OCT, 1964)"]}},"tlg1319":{"name":"Diogenes of Apollonia","grc":null,"birth":null,"death":null,"floruit":-440,"year":-440,"era":"classical","desc":"5th-century BC Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Diogenes_of_Apollonia","q":"Q191964","place":"Apollonia Pontica","occ":["philosopher"],"nworks":1},"tlg1325":{"name":"Diogenes Sinopensis Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the Cynic Diogenes of Sinope, later Cynic compositions","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0097":{"name":"Diogenianus of Heraclea","grc":null,"birth":null,"death":null,"floruit":130,"year":130,"era":"imperial","desc":"ancient Greek grammarian, lexicographer, and proverb compiler","wiki":"https://en.wikipedia.org/wiki/Diogenianus","q":"Q1226821","place":"Heraclea Pontica","occ":["paremiographer","lexicographer","grammarian"],"nworks":1},"tlg1329":{"name":"Dionysius Corinthius","grc":null,"birth":150,"death":171,"floruit":null,"year":160,"era":"imperial","desc":"Bishop of Corinth","wiki":"https://en.wikipedia.org/wiki/Dionysius_of_Corinth","q":"Q679837","place":"Corinth","occ":["bishop","presbyter"],"nworks":1},"tlg0083":{"name":"Dionysius of Byzantium","grc":null,"birth":200,"death":null,"floruit":null,"year":240,"era":"imperial","desc":"ancient Greek geographer","wiki":"https://en.wikipedia.org/wiki/Dionysius_of_Byzantium","q":"Q804146","place":"Byzantium","occ":["poet","geographer"],"nworks":1},"tlg0081":{"name":"Dionysius of Halicarnassus","grc":"Διονύσιος Ἁλικαρνασσεύς","birth":-60,"death":null,"floruit":null,"year":-20,"era":"imperial","desc":"1st-century BC Greek historian and teacher","wiki":"https://en.wikipedia.org/wiki/Dionysius_of_Halicarnassus","q":"Q26204","place":"Halicarnassus","occ":["writer","historian","rhetorician","orator","grammarian"],"nworks":16,"core":{"summary":"Dionysius of Halicarnassus (Διονύσιος Ἁλικαρνασσεύς, Dionysios Halikarnasseus, c. 60–after 7 BCE) came to Rome in about 30 BCE, as Octavian ended the civil wars. He learned Latin, taught rhetoric to Roman and Greek pupils, and spent twenty-two years on his history, which he published in 7 BCE. He belonged to a circle of Greek and Roman intellectuals in Augustan Rome, and much of what we know of him comes from the letters and dedications in his own works.\n\nHis Roman Antiquities (Ῥωμαϊκὴ ἀρχαιολογία, Rhōmaikē archaiologia), in twenty books, told the history of Rome from its origins to the outbreak of the First Punic War in 264 BCE. Books 1–10 survive complete, Book 11 in part, and the rest in excerpts. Dionysius wanted to show Greek readers that the Romans were Greeks by origin and deserved their empire, and his work is, with Livy, our main source for early Rome.\n\nHe was also the leading literary critic of his age. His essays On the Ancient Orators, on Lysias, Isocrates, Isaeus, Demosthenes and Dinarchus, on Thucydides, and On the Arrangement of Words (De compositione verborum) analyse style with great precision, down to the sounds and rhythms of individual phrases. He championed a return to the Attic models of classical Athens against the florid 'Asianic' style, and his own Greek is careful, classicising Attic.","timeline":[[-60,"Born at Halicarnassus (c. 60)"],[-30,"Comes to Rome at the end of the civil wars (c. 30)"],[-20,"Writes his critical essays on the orators and on style (c. 30–10)"],[-7,"Publishes the first part of the Roman Antiquities"],[950,"Excerpts from the lost books preserved in the collections made for Constantine VII (10th century)"],[1546,"Editio princeps of the Roman Antiquities (Paris, Robert Estienne)"]],"manuscripts":"The Roman Antiquities rest mainly on two groups of manuscripts, led by a tenth-century codex in the Chigi collection of the Vatican (Chisianus) and by Urbinas gr. 105 (tenth or eleventh century). A Byzantine epitome also survives. The critical essays have separate traditions. On the Arrangement of Words is found in the tenth- or eleventh-century Parisinus gr. 1741, the same manuscript that preserves Aristotle's Poetics and Rhetoric.","variants":"The later books of the Roman Antiquities survive only in excerpts, and their placement is sometimes uncertain. Some works once attributed to Dionysius, notably an Art of Rhetoric, are not his. In the critical essays the many quotations from classical authors are an important secondary witness to their texts, and Dionysius' own text sometimes has to be corrected from the manuscripts of the authors he quotes.","editions":["K. Jacoby, Dionysii Halicarnasei Antiquitatum Romanarum quae supersunt, 4 vols (Teubner, 1885–1905) — the Greek text of the Roman Antiquities used here","H. Usener and L. Radermacher, Dionysii Halicarnasei Opuscula, 2 vols (Teubner, 1899–1904) — the Greek text of the critical essays used here","E. Cary, Dionysius of Halicarnassus: Roman Antiquities, 7 vols (Loeb Classical Library, 1937–50)","S. Usher, Dionysius of Halicarnassus: Critical Essays, 2 vols (Loeb Classical Library, 1974–85)","G. Aujac, Denys d'Halicarnasse: Opuscules rhétoriques, 5 vols (Budé, 1978–92)"]}},"tlg0084":{"name":"Dionysius Periegetes","grc":null,"birth":null,"death":null,"floruit":125,"year":125,"era":"imperial","desc":"2nd century AD Greek poet","wiki":"https://en.wikipedia.org/wiki/Dionysius_Periegetes","q":"Q1226993","place":"Alexandria","occ":["writer","poet","librarian","geographer"],"nworks":1},"tlg0069":{"name":"Dionysius, Calliphontis","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient Greek geographer, son of Calliphon","wiki":null,"q":"Q87771481","place":null,"occ":["geographer"],"nworks":1},"tlg2039":{"name":"Diophantus Alexandrinus","grc":null,"birth":200,"death":284,"floruit":250,"year":250,"era":"imperial","desc":"3rd century Alexandrian Greek mathematician","wiki":"https://en.wikipedia.org/wiki/Diophantus","q":"Q178217","place":"Alexandria","occ":["mathematician"],"nworks":3},"tlg0656":{"name":"Dioscurides Pedianus","grc":null,"birth":40,"death":90,"floruit":60,"year":60,"era":"imperial","desc":"Greco-Roman physician and pharmacologist (AD c.40-90)","wiki":"https://en.wikipedia.org/wiki/Dioscorides","q":"Q297776","place":"Anazarbus","occ":["physician","pharmacist","pharmacologist","botanist"],"nworks":2},"tlg1337":{"name":"Dorotheus of Sidon","grc":null,"birth":50,"death":null,"floruit":null,"year":90,"era":"imperial","desc":"astrologer and poet of the 1st century CE, whose astrological poem (the Pentateuch) survives in Greek fragments and an Arabic translation","wiki":"https://en.wikipedia.org/wiki/Dorotheus_of_Sidon","q":"Q921532","place":"Sidon","occ":["astronomer","writer","astrologer"],"nworks":1},"tlg4020":{"name":"Elias Neoplatonicus","grc":null,"birth":null,"death":null,"floruit":550,"year":550,"era":"lateantique","desc":"6th-century Neoplatonist commentator on Aristotle and Porphyry, of the Alexandrian school","wiki":"https://en.wikipedia.org/wiki/Elias_(Greek_scholar)","q":"Q974885","place":null,"occ":["philosopher"],"nworks":2},"tlg0521":{"name":"Epicharmus","grc":null,"birth":-524,"death":-435,"floruit":null,"year":-479,"era":"classical","desc":"late 6th/early 5th century BC Greek dramatist and philosopher","wiki":"https://en.wikipedia.org/wiki/Epicharmus_of_Cos","q":"Q312410","place":"Cos","occ":["writer","comedy writer","philosopher"],"nworks":1},"tlg0557":{"name":"Epictetus","grc":"Ἐπίκτητος","birth":50,"death":135,"floruit":null,"year":94,"era":"imperial","desc":"Greek Stoic philosopher (c. 50–c. 138)","wiki":"https://en.wikipedia.org/wiki/Epictetus","q":"Q183144","place":"Hierapolis","occ":["writer","philosopher"],"nworks":6,"core":{"summary":"Epictetus (Ἐπίκτητος, Epiktētos, c. 50–c. 135 CE) was born a slave at Hierapolis in Phrygia; his name simply means \"acquired\". His master in Rome was Epaphroditus, a freedman of Nero, who let him study with the Stoic Musonius Rufus. Once freed, he taught philosophy in Rome until the emperor Domitian expelled the philosophers from Italy (c. 93). He then set up a school at Nicopolis in north-western Greece, where he taught for the rest of his life. He was lame, and later writers tell different stories about why.\n\nLike Socrates, Epictetus wrote nothing. What we have comes from his pupil Arrian, later a Roman senator and the historian of Alexander, who took down his talks. Four books of Discourses (Διατριβαί, Diatribai) survive of an original eight, together with a short Handbook (Ἐγχειρίδιον, Encheiridion) of his main teachings. Their core is a single distinction, stated in the Handbook's first line: \"Some things are up to us and some are not\" (Τῶν ὄντων τὰ μέν ἐστιν ἐφ᾽ ἡμῖν, τὰ δὲ οὐκ ἐφ᾽ ἡμῖν). Our judgements, desires and choices are ours; body, property, reputation and office are not, and freedom lies in caring only for what is ours to govern. Marcus Aurelius learned from these notes, Christian monks adapted the Handbook for their own use, and it has been read ever since.\n\nArrian says in his preface that he recorded Epictetus' words as nearly as possible as they were spoken, and it shows. This is the everyday Koine of the early empire: lively, blunt and full of imagined dialogue with a listener. Watch for the term προαίρεσις (prohairesis, \"moral choice\" or \"will\"), the one thing that, for Epictetus, no one can take from us.","timeline":[[50,"Born a slave at Hierapolis in Phrygia (c. 50)"],[65,"In Rome as the slave of Nero's freedman Epaphroditus; studies with Musonius Rufus"],[93,"Domitian expels the philosophers from Italy; Epictetus opens his school at Nicopolis (c. 93)"],[108,"Arrian studies with him and records his lectures (c. 108)"],[135,"Dies at Nicopolis (c. 135)"],[1497,"Angelo Poliziano's Latin translation of the Handbook is printed, the first printed edition of any of his work"],[1535,"Editio princeps of the Discourses (Venice, Vittore Trincavelli), from a faulty manuscript"]],"manuscripts":"The surviving manuscripts of the Discourses all appear to descend from one book, an eleventh- or twelfth-century codex in the Bodleian Library at Oxford (Auct. T. 4. 13, S). Where it is damaged or wrong we have no independent check. The Handbook circulated much more widely and survives in many manuscripts, in Christian adaptations and in the sixth-century commentary of Simplicius. Fragments of the lost books come mainly from the anthology of Stobaeus.","variants":"Because the Discourses depend on a single manuscript, their text has been repaired by conjecture in many places. The fragments attributed to Epictetus in Stobaeus and in later collections, such as the Gnomologium Epictetum included here, are of mixed authenticity, and some are certainly by others. How far Arrian polished what he heard, and so how close the Discourses are to a transcript, is still discussed.","editions":["H. Schenkl, Epicteti Dissertationes ab Arriano digestae (Teubner, 2nd ed. 1916) — the Greek text used here","G. Long, The Discourses of Epictetus, with the Encheiridion and Fragments (1877; the 1887 printing used here), and T. W. Higginson, The Works of Epictetus (1865) — the translations used here","W. A. Oldfather, Epictetus, 2 vols (Loeb Classical Library, 1925–28)","G. Boter, The Encheiridion of Epictetus and its Three Christian Adaptations (Leiden, 1999)","R. Dobbin, Epictetus: Discourses Book 1 (Oxford, 1998), with commentary","R. Hard, Epictetus: Discourses, Fragments, Handbook (Oxford World's Classics, 2014)"]}},"tlg0537":{"name":"Epicurus","grc":"Ἐπίκουρος","birth":-341,"death":-270,"floruit":null,"year":-306,"era":"hellenistic","desc":"ancient Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Epicurus","q":"Q43216","place":"Samos","occ":["writer","philosopher"],"nworks":5,"core":{"summary":"Epicurus (Ἐπίκουρος, Epikouros, 341–270 BCE) was born on Samos to Athenian settlers and came to Athens for his military training in 323. After teaching at Mytilene and Lampsacus he returned to Athens in 306 and bought a house with a garden outside the city walls. The Garden (Κῆπος, Kēpos) became the name of his school, a community of friends that, unusually, admitted women and slaves. Diogenes Laertius says he wrote some three hundred books, including a work On Nature in thirty-seven books.\n\nEpicurus taught that the world is made of atoms moving in the void, that the gods exist but take no part in human affairs, and that the soul dies with the body. \"Death is nothing to us\" (ὁ θάνατος οὐδὲν πρὸς ἡμᾶς, ho thanatos ouden pros hēmas), the second of his Principal Doctrines, sums up the purpose of this physics: to free people from fear. The goal of life is pleasure, understood not as indulgence but as the absence of pain in the body and of disturbance in the mind (ἀταραξία, ataraxia, \"freedom from disturbance\"), best reached through simple living and friendship. His school's motto was λάθε βιώσας (lathe biōsas, \"live unnoticed\").\n\nAlmost all of his vast output is lost. What survives is what Diogenes Laertius copied into Book 10 of his Lives (three letters summarising his teaching and the Principal Doctrines), a collection of sayings discovered in a Vatican manuscript in 1888, and charred fragments of On Nature from the library at Herculaneum. His Greek is technical and often difficult, especially in the compressed Letter to Herodotus. The Letter to Menoeceus, on how to live, is the clearest introduction.","timeline":[[-341,"Born on Samos to Athenian settlers"],[-323,"Comes to Athens for military training (ephebeia)"],[-311,"Begins teaching at Mytilene, then at Lampsacus"],[-306,"Settles in Athens and founds the Garden"],[-270,"Dies at Athens after a long illness; his will provides for the school"],[-55,"Lucretius sets out Epicurus' physics in Latin verse in On the Nature of Things"],[150,"Diogenes of Oenoanda carves a huge Epicurean inscription in Lycia (2nd century CE)"],[1752,"Carbonised papyrus rolls, including books of On Nature, found at the Villa of the Papyri at Herculaneum"],[1887,"Hermann Usener's Epicurea collects the fragments"],[1888,"Karl Wotke publishes the Vatican Sayings"]],"manuscripts":"The letters and the Principal Doctrines survive only because Diogenes Laertius quoted them in full, so their text depends on the manuscripts of Diogenes (see his entry). The Vatican Sayings, eighty-one maxims by Epicurus and his followers, are known from a single fourteenth-century manuscript, Vaticanus gr. 1950. The Herculaneum papyri, buried by Vesuvius in 79 CE and unrolled and read with increasing success since the eighteenth century, preserve parts of On Nature and the works of the later Epicurean Philodemus.","variants":"The text of the letters is badly corrupted in the manuscripts of Diogenes and has been heavily emended. The Letter to Pythocles may have been written by a pupil rather than by Epicurus himself. Some of the Vatican Sayings duplicate the Principal Doctrines, and some are by his followers. Readings of the Herculaneum papyri continue to change as new imaging methods are applied.","editions":["P. von der Mühll, Epicuri Epistulae Tres et Ratae Sententiae (Teubner, 1922) — the Greek text used here","H. Usener, Epicurea (Leipzig, 1887), the classic collection of fragments","G. Arrighetti, Epicuro: Opere (Turin, 2nd ed. 1973), including the papyri","C. Bailey, Epicurus: The Extant Remains (Oxford, 1926)","A. A. Long and D. N. Sedley, The Hellenistic Philosophers, 2 vols (Cambridge, 1987)"]}},"tlg1347":{"name":"Epimenides","grc":null,"birth":-700,"death":-600,"floruit":null,"year":-650,"era":"archaic","desc":"7th/6th-century BC Greek seer, philosopher, and poet","wiki":"https://en.wikipedia.org/wiki/Epimenides","q":"Q319406","place":"Cnossus","occ":["writer","poet","philosopher"],"nworks":1},"tlg2021":{"name":"Epiphanius","grc":null,"birth":315,"death":403,"floruit":375,"year":375,"era":"lateantique","desc":"bishop of Salamis in Cyprus and heresiologist, author of the Panarion (c. 315–403)","wiki":"https://en.wikipedia.org/wiki/Epiphanius_of_Salamis","q":"Q313922","place":"Besanduk","occ":["bishop","writer"],"nworks":3},"tlg2139":{"name":"Epitaphium Sicili","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Seikilos epitaph, a short poem with musical notation inscribed on a tombstone near Tralles (1st or 2nd century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1799":{"name":"Euclid","grc":"Εὐκλείδης","birth":null,"death":null,"floruit":-300,"year":-300,"era":"hellenistic","desc":"Greek mathematician of Alexandria (fl. c. 300 BCE), author of the Elements","wiki":"https://en.wikipedia.org/wiki/Euclid","q":"Q8747","place":null,"occ":["writer","mathematician"],"nworks":12,"core":{"summary":"Euclid (Εὐκλείδης, Eukleidēs, fl. c. 300 BCE) is known almost only through his works. The fifth-century philosopher Proclus places him under Ptolemy I, later than Plato's pupils and earlier than Archimedes, and Pappus says he taught at Alexandria. The famous reply to a king that \"there is no royal road to geometry\" is a later anecdote.\n\nHis Elements (Στοιχεῖα, Stoicheia), in thirteen books, gathered and systematised the mathematics of his predecessors: plane geometry, proportion, number theory, incommensurables and solid geometry, ending with the five regular solids. Starting from definitions, postulates and common notions, it proves each proposition from what has gone before. It became the most studied textbook in the history of mathematics and was used in schools into the twentieth century. Books 14 and 15, found in some editions, are later additions. His other surviving works include the Data, the Optics and the Phaenomena, an elementary astronomy.\n\nEuclid's Greek is the formal language of Greek mathematics. Every proposition follows the same pattern: statement, setting-out, construction, proof and conclusion. Each proof closes with ὅπερ ἔδει δεῖξαι (hoper edei deixai, \"which was to be proved\"), the origin of the Latin Q.E.D. The vocabulary is small and precise, which makes Euclid easier Greek than he looks.","timeline":[[-300,"Active at Alexandria under Ptolemy I (c. 300 BCE)"],[370,"Theon of Alexandria produces a revised edition of the Elements, the basis of most later manuscripts"],[800,"Translated into Arabic at Baghdad (c. 800 and later), the route by which medieval Europe first knew him"],[888,"The Bodleian manuscript D'Orville 301 is copied at Constantinople"],[1120,"Adelard of Bath translates the Elements from Arabic into Latin (early 12th century)"],[1482,"First printed edition, in Latin, at Venice (Erhard Ratdolt)"],[1533,"Editio princeps of the Greek text (Basel, Simon Grynaeus)"],[1808,"François Peyrard recognises that a Vatican manuscript preserves a text older than Theon's revision"]],"manuscripts":"Almost all manuscripts of the Elements descend from the revised edition made by Theon of Alexandria in the fourth century CE, including the Bodleian D'Orville 301, copied in 888. In 1808 François Peyrard noticed that a Vatican manuscript taken to Paris by Napoleon (Vaticanus gr. 190, P, 9th century) lacks Theon's additions. It is the most important single witness, and J. L. Heiberg based his edition on it. Medieval Arabic translations, and Latin translations made from them, preserve a partly independent tradition.","variants":"Theon's edition smoothed the language, filled perceived gaps in proofs and added material, so editors must separate Euclid from his revisers. Some definitions and whole propositions may be interpolations. The Arabic versions differ from the Greek in the number and order of propositions, and scholars debate how far they reflect older Greek texts. Books 14 (by Hypsicles, 2nd century BCE) and 15 (later still) are not Euclid's, and the Sectio canonis, on musical intervals, is of doubtful authorship.","editions":["J. L. Heiberg and H. Menge, Euclidis Opera Omnia, 8 vols (Teubner, 1883–1916) — the Greek text used here","T. L. Heath, The Thirteen Books of Euclid's Elements, 3 vols (Cambridge, 1908) — the translation used here, with extensive commentary","J. L. Heiberg, revised by E. S. Stamatis, Euclidis Elementa (Teubner, 1969–77)","B. Vitrac, Euclide: Les Éléments, 4 vols (Paris, 1990–2001), French translation with commentary"]}},"tlg2050":{"name":"Eunapius","grc":null,"birth":349,"death":420,"floruit":null,"year":384,"era":"lateantique","desc":"ancient Greek sophist and historian","wiki":"https://en.wikipedia.org/wiki/Eunapius","q":"Q343018","place":"Sardis","occ":["writer","historian","biographer","sophist","philosopher","orator"],"nworks":1},"tlg0006":{"name":"Euripides","grc":"Εὐριπίδης","birth":-480,"death":-406,"floruit":null,"year":-443,"era":"classical","desc":"Classical Athenian playwright","wiki":"https://en.wikipedia.org/wiki/Euripides","q":"Q48305","place":"Salamis","occ":["writer","poet","playwright","philosopher","tragedy writer"],"nworks":20,"core":{"summary":"Euripides (Εὐριπίδης, Euripidēs, c. 480–406 BCE) was the youngest of the three great Athenian tragedians. He wrote about ninety plays. Nineteen survive under his name, seventeen tragedies, the satyr play Cyclops and the Rhesus, which may not be his: more than for Aeschylus and Sophocles together, thanks to a lucky accident of transmission described below. He won first prize only four times in his life, with a fifth victory after his death, but in the following century he became the most popular and most often performed of the three.\n\nHis plays bring gods and heroes close to ordinary experience. They are full of clever argument, forceful women (Medea, Phaedra, Electra) and unsettling questions about the justice of the gods. His contemporaries found him both brilliant and disturbing: Aristophanes mocked him in Acharnians, Women at the Thesmophoria and Frogs. Medea (431), Hippolytus (428) and Bacchae (staged after his death, around 405) are among the most performed of all Greek dramas.\n\nAristotle (Rhetoric 1404b) says Euripides was the first to build his verse from the words of ordinary speech. His Greek is clearer and closer to everyday Attic than that of Aeschylus or Sophocles, which makes him a good first tragedian to read in the original. Look out for his habits: a prologue in which a god or character tells the audi
