ence who they are and where the story stands, rapid one-line exchanges (stichomythia, στιχομυθία), and formal debates between two speakers.","timeline":[[-480,"Born (traditionally on the day of the battle of Salamis; the Parian Marble gives 485/4)"],[-455,"First competes at the Dionysia"],[-441,"First victory"],[-438,"Alcestis, his earliest surviving datable play, performed in the place of a satyr play"],[-431,"Medea, which places third"],[-428,"Hippolytus, a victory"],[-415,"Trojan Women"],[-408,"Orestes; according to tradition he then leaves Athens for the court of Archelaus of Macedon, though some scholars doubt the story"],[-406,"Dies, reportedly in Macedon; Bacchae and Iphigenia at Aulis are produced after his death by his son and win first prize"],[1495,"Janus Lascaris prints four plays in Florence (c. 1495), the first Euripides in print"],[1503,"Aldine edition of 18 plays; the Electra, missing from it, is first printed by Pietro Vettori in 1545"]],"manuscripts":"Euripides survives in two streams. The first is a school selection of ten plays (Alcestis, Andromache, Hecuba, Hippolytus, Medea, Orestes, Phoenician Women, Rhesus, Trojan Women and Bacchae) with ancient commentary (scholia), copied in many manuscripts; the chief ones are Marcianus gr. 471 in Venice (M, eleventh century), Vaticanus gr. 909 (V) and Parisinus gr. 2713 (B). Three of them, Hecuba, Orestes and Phoenician Women, formed the 'Byzantine triad' read in schools and survive in a great many copies.\n\nThe second stream is a group of nine plays that survives without commentary in just two related manuscripts, Laurentianus 32.2 in Florence (L, early fourteenth century, corrected by Demetrius Triclinius) and Palatinus gr. 287 (P). These nine (Helen, Electra, Heracles, Children of Heracles, Suppliant Women, Ion, Iphigenia at Aulis, Iphigenia among the Taurians and the satyr play Cyclops) have Greek titles beginning with the letters epsilon to kappa (Ἑλένη, Ἠλέκτρα … Ἰφιγένεια, Κύκλωψ): they are a surviving slice of an ancient complete edition arranged in alphabetical order. Many papyri add fragments, including large parts of lost plays such as Hypsipyle and Antiope.","variants":"Because the nine alphabetical plays depend on L and P alone, their text is often uncertain and heavily emended. The ending of Iphigenia at Aulis was completed by a later hand, and much else in that play is suspected, and the Rhesus is widely thought not to be by Euripides. His popularity on the fourth-century stage brought actors' interpolations into the text. Among individual problems, Medea 38–43 and the ending of the Phoenician Women are much disputed.","editions":["G. Murray, Euripidis Fabulae, 3 vols (OCT, 1902–13) — the Greek text used here","E. P. Coleridge, The Plays of Euripides, 2 vols (1891–1906) — the translation used for most plays here, with T. A. Buckley's Bacchae (1850) and Gilbert Murray's verse Rhesus (1913)","A. Nauck, Tragicorum Graecorum Fragmenta (2nd ed., 1889) — the fragments text used here; now superseded by R. Kannicht, TrGF V (2004)","J. Diggle, Euripidis Fabulae, 3 vols (OCT, 1981–94), the standard modern text","D. Kovacs, Euripides, 6 vols (Loeb Classical Library, 1994–2002)","D. J. Mastronarde, Euripides: Medea (Cambridge, 2002), with commentary"]}},"tlg1367":{"name":"Euripides Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the tragedian Euripides, later forgeries","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2640":{"name":"Eusebius Myndius","grc":null,"birth":300,"death":null,"floruit":null,"year":340,"era":"lateantique","desc":"ancient Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Eusebius_of_Myndus","q":"Q248733","place":null,"occ":["philosopher"],"nworks":1},"tlg2018":{"name":"Eusebius of Caesarea","grc":"Εὐσέβιος","birth":260,"death":339,"floruit":null,"year":302,"era":"imperial","desc":"bishop of Caesarea and church historian (c. 260–c. 340)","wiki":"https://en.wikipedia.org/wiki/Eusebius","q":"Q142999","place":"Caesarea Maritima","occ":["bishop","writer","historian","presbyter","theologian","church historian"],"nworks":13,"core":{"summary":"Eusebius of Caesarea (Εὐσέβιος, Eusebios, c. 260–339 CE) spent almost his whole life in Caesarea Maritima in Palestine. He was the devoted pupil of the scholar Pamphilus, who had built up the library Origen had founded there, and after Pamphilus' martyrdom in 310 he called himself 'Eusebius of Pamphilus'. He became bishop of Caesarea around 313. At first he sympathised with Arius, but he signed the creed of the Council of Nicaea in 325. He admired the emperor Constantine, delivered a speech for the thirtieth year of his reign, and wrote his Life after his death in 337.\n\nEusebius is called the father of church history. His Ecclesiastical History, in ten books, traces the Church from its beginnings to his own day, and he revised and extended it several times as the persecutions ended and Constantine came to power. Its great value lies in the documents it quotes word for word, from letters, decrees and works now lost. His Preparation for the Gospel does the same for pagan literature, preserving long passages of philosophers and historians who survive nowhere else. He also wrote a world Chronicle (known through Jerome's Latin and an Armenian translation), the Onomasticon, a gazetteer of biblical places, and many works of apologetic and theology.\n\nHis own Greek is often heavy and long-winded, but his method, quoting his sources at length, makes him one of the most important preservers of ancient texts.","timeline":[[260,"Born, probably at Caesarea (c. 260)"],[303,"The Great Persecution begins under Diocletian"],[310,"His teacher Pamphilus is martyred"],[313,"Becomes bishop of Caesarea (c. 313)"],[325,"Attends the Council of Nicaea and accepts its creed"],[336,"Delivers his Praise of Constantine for the emperor's thirtieth year"],[337,"Death of Constantine; Eusebius writes the Life of Constantine"],[339,"Dies (c. 339)"],[403,"Rufinus translates and continues the Ecclesiastical History in Latin"]],"manuscripts":"The Ecclesiastical History survives in a number of medieval Greek manuscripts that reflect Eusebius' own successive editions, and in early translations. A Syriac version has a manuscript dated 462, and Rufinus' Latin translation was made in 403. The Preparation for the Gospel depends on a few medieval manuscripts, the most important from the tenth century. Many of the other works survive only in part or in translation, such as the Theophania, preserved complete only in Syriac.","variants":"The chief question for the Ecclesiastical History is how many editions Eusebius produced and when: differences between the manuscripts, especially in Books 8–10, show that he revised the work as events changed. The authenticity of the Life of Constantine, once doubted, is now generally accepted. The attribution of the Oration to the Assembly of the Saints, which he appended to it as Constantine's own speech, is still debated.","editions":["K. Lake, J. E. L. Oulton and H. J. Lawlor, Eusebius: The Ecclesiastical History, 2 vols (Loeb Classical Library, 1926–32) — the Greek text and translation of the History used here","W. Dindorf, Eusebii Caesariensis Opera, 4 vols (Teubner, 1867–71) — the text used here for several works","Eusebius Werke (Die Griechischen Christlichen Schriftsteller, 1902–), ed. I. Heikel, E. Klostermann, H. Gressmann and others — the texts used here for the Life of Constantine, Onomasticon, Theophania and others","E. Schwartz, Die Kirchengeschichte (GCS, 1903–09), the standard edition of the History","K. Mras, Die Praeparatio Evangelica (GCS, 1954–56)","Averil Cameron and S. G. Hall, Eusebius: Life of Constantine (Oxford, 1999), translation and commentary"]}},"tlg4031":{"name":"Eustratius","grc":null,"birth":1050,"death":1120,"floruit":null,"year":1085,"era":"byzantine","desc":"Byzantine philosopher and theologian","wiki":"https://en.wikipedia.org/wiki/Eustratius_of_Nicaea","q":"Q3561265","place":null,"occ":["bishop","theologian","philosopher"],"nworks":1},"tlg4072":{"name":"Eutocius","grc":null,"birth":480,"death":540,"floruit":null,"year":510,"era":"lateantique","desc":"Byzantine mathematician","wiki":"https://en.wikipedia.org/wiki/Eutocius_of_Ascalon","q":"Q510719","place":"Ascalon","occ":["mathematician","philosopher"],"nworks":3},"stoa0121":{"name":"Eutropius","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Roman historian (4th century CE); his Latin Breviarium appears here in the Greek translation by Paeanius","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2733":{"name":"Evagrius, Scholasticus","grc":null,"birth":537,"death":600,"floruit":null,"year":568,"era":"lateantique","desc":"Syrian lawyer and church historian (c. 537–c. 600)","wiki":"https://en.wikipedia.org/wiki/Evagrius_Scholasticus","q":"Q365678","place":"Epiphania (Syria)","occ":["lawyer","jurist","historian","church historian"],"nworks":1},"tlg0526":{"name":"Flavius Josephus","grc":"Ἰώσηπος","birth":37,"death":100,"floruit":null,"year":68,"era":"imperial","desc":"Roman–Jewish historian and military leader (c. 37–c. 100)","wiki":"https://en.wikipedia.org/wiki/Josephus","q":"Q134461","place":"Jerusalem","occ":["writer","historian"],"nworks":4,"core":{"summary":"Flavius Josephus (Φλάβιος Ἰώσηπος, Phlabios Iōsēpos, 37–c. 100 CE), born Yosef ben Matityahu, came from a priestly family in Jerusalem. When the Jews rose against Rome in 66, he was given command in Galilee. Besieged at Jotapata in 67, he surrendered to Vespasian and, by his own account, foretold that Vespasian would become emperor. When the prophecy came true in 69 he was freed and took the family name Flavius. He watched the siege and destruction of Jerusalem in 70 from the Roman side, and spent the rest of his life in Rome on a pension from the emperors, writing.\n\nHis Jewish War, in seven books, describes the revolt he had lived through. He says he wrote it first in Aramaic for readers in the east and then in Greek. The Jewish Antiquities (93/4 CE), in twenty books, retells the history of the Jews from the Creation to the eve of the revolt, drawing on the Greek Bible and on sources now lost. He added an autobiographical Life, defending his conduct in Galilee, and Against Apion, a defence of Judaism against its critics. He is our main source for Judaea under Herod and the Roman governors. Christians read him eagerly for the background to the New Testament, which is largely why his works survived.\n\nHis Greek is the careful literary prose of an educated man writing in a second language, with some Thucydidean flourishes; he admits that he used assistants for the Greek (Against Apion 1.50). The most debated passage in his work is the Testimonium Flavianum (Antiquities 18.63–64), a paragraph about Jesus. Most scholars now think Josephus wrote a brief notice there that Christian copyists later expanded, while a minority regard the whole paragraph as an interpolation.","timeline":[[37,"Born in Jerusalem into a priestly family"],[64,"Goes to Rome on an embassy to free some imprisoned priests"],[66,"Jewish revolt against Rome; Josephus given command in Galilee"],[67,"Surrenders to Vespasian after the siege of Jotapata"],[69,"Freed when Vespasian becomes emperor; takes the name Flavius"],[70,"Witnesses the siege and destruction of Jerusalem with Titus"],[75,"Jewish War completed (c. 75–79)"],[93,"Jewish Antiquities (93/4), followed by the Life and Against Apion"],[100,"Dies (c. 100)"],[550,"Latin translation of the Antiquities and Against Apion made for Cassiodorus"],[1544,"Editio princeps of the Greek text (Basel, Froben), edited by Arnoldus Arlenius"],[1737,"William Whiston's English translation, the most widely read version for two centuries"]],"manuscripts":"Josephus survived in Christian hands. The Greek manuscripts, the oldest of them from about the tenth century, transmit each work separately. The Antiquities usually comes in two halves (Books 1–10 and 11–20), each with its own family of manuscripts. Early translations are important evidence: a free Latin adaptation of the War under the name Hegesippus (4th century), the Latin Antiquities and Against Apion made for Cassiodorus in the 6th century, and an Old Slavonic version of the War. For a long section of Against Apion (2.52–113), lost from the Greek manuscripts, the Latin is our only witness.","variants":"Besides the Testimonium, a second mention of Jesus, in the notice of the execution of 'James, the brother of Jesus who was called Christ' (Antiquities 20.200), is generally accepted as genuine. The Old Slavonic War contains extra passages about John the Baptist and Jesus that are not by Josephus. Josephus' own accounts of his conduct in Galilee differ between the War and the Life, which scholars read as self-defence. Readers should also note that Whiston's chapter numbers differ from the section numbers of Niese's edition, which are standard in scholarship.","editions":["B. Niese, Flavii Iosephi Opera, 7 vols (Berlin, 1885–95) — the Greek text used here","W. Whiston, The Works of Flavius Josephus (1737; the 1856 printing used here) — the translation used here","H. St J. Thackeray, R. Marcus, A. Wikgren and L. H. Feldman, Josephus, 9 vols (Loeb Classical Library, 1926–65)","S. Mason (ed.), Flavius Josephus: Translation and Commentary (Leiden, 2000–)"]}},"tlg0572":{"name":"Gaius Romanus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Roman Christian writer and priest (presbyter) of the early 3rd century, known from fragments quoted by Eusebius","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0057":{"name":"Galen","grc":"Γαληνός","birth":129,"death":216,"floruit":null,"year":214,"era":"imperial","desc":"2nd-century Greek physician, surgeon and philosopher","wiki":"https://en.wikipedia.org/wiki/Galen","q":"Q8778","place":"Pergamum","occ":["physician","physician writer","surgeon","philosopher"],"nworks":97,"core":{"summary":"Galen of Pergamum (Γαληνός, Galēnos, 129–c. 216 CE) was a physician, anatomist and philosopher who rose from treating gladiators in his home city to attending the emperor Marcus Aurelius and his family in Rome. More of his writing survives than of any other ancient Greek author, roughly three million words on anatomy, physiology, diagnosis, pharmacology, therapy, logic and ethics.\n\nGalen combined Hippocratic medicine with his own dissections, mostly of animals such as apes, and his own experiments, and presented the result as a complete system. That system dominated medicine in the Islamic world and in Europe until the sixteenth and seventeenth centuries, when Vesalius and Harvey began to overturn it. He is also an unusually personal writer: vain, combative and vivid, he tells us a great deal about his patients, his rivals and daily life in second-century Rome.\n\nHis Greek is the educated prose of his day. He valued clarity over fashionable Attic purity and mocked contemporaries who fussed over Atticisms, although he also compiled a large dictionary of Attic words, now lost. Much of his vocabulary is technical and has passed into modern medicine, for example διάγνωσις (diagnōsis, \"distinguishing, diagnosis\") and πρόγνωσις (prognōsis, \"foreknowledge, prognosis\").","timeline":[[129,"Born at Pergamum"],[146,"Begins medical studies at about sixteen, after his father dreams that he should; later studies in Smyrna, Corinth and Alexandria"],[157,"Physician to the gladiators at Pergamum"],[162,"First arrives in Rome"],[166,"Leaves Rome, as the Antonine plague breaks out"],[169,"Recalled by Marcus Aurelius; remains in Rome as a court physician"],[192,"Fire in the Temple of Peace destroys many of his books and drugs, as he describes in On the Avoidance of Grief"],[216,"Dies, approximately; a Byzantine source, the Suda, implies a death around 200, and the date is disputed"],[850,"Ninth century: Hunayn ibn Ishaq and his school in Baghdad translate over a hundred Galenic works into Syriac and Arabic"],[1525,"Aldine editio princeps of the Greek Galen, 5 vols"],[1821,"C. G. Kühn's edition in 22 volumes (1821–33), still the fullest text and the standard citation (K.)"],[2005,"A manuscript in the Vlatadon Monastery, Thessaloniki, is found to contain On the Avoidance of Grief, lost in Greek until then"]],"manuscripts":"Hundreds of medieval Greek manuscripts carry Galen's works, but no single one contains more than a fraction of them, and many treatises survive in only one or two copies. Discoveries are still being made: in 2005 a manuscript at the Vlatadon Monastery in Thessaloniki (Vlatadon 14) turned out to contain On the Avoidance of Grief, unknown in Greek until then, and fuller texts of On My Own Books and other works.\n\nTranslations are essential witnesses too. In the ninth century Hunayn ibn Ishaq and his school in Baghdad translated over a hundred Galenic works into Syriac and Arabic, and they preserve works lost in Greek, such as On Medical Experience and the later books of Anatomical Procedures. Medieval Latin translations, including those of Niccolò da Reggio in the fourteenth century, also preserve Greek that is otherwise lost.","variants":"Kühn's edition, which largely reprints René Chartier's of 1679, is full of errors, but it is still the only near-complete text. The critical editions of the Corpus Medicorum Graecorum (CMG) are replacing it work by work and are far from finished. A number of treatises in the corpus are not by Galen, among them the Introduction, or The Physician, and the Medical Definitions. Forgeries were already circulating in his lifetime (he tells of seeing a book falsely sold under his name in a Roman bookshop), which is one reason Galen wrote On My Own Books, a guide to his genuine writings; it remains the starting point for deciding what is authentic.","editions":["C. G. Kühn, Claudii Galeni Opera Omnia, 22 vols (Leipzig, 1821–33) — the source of most of the texts here","Teubner texts by G. Helmreich, K. Kalbfleisch, J. Marquardt and others (1879–1923) — the texts used here for several shorter works","A. J. Brock, Galen: On the Natural Faculties (Loeb Classical Library, 1916) — the Greek text and translation used here for that work","Corpus Medicorum Graecorum V (Berlin, 1914–), ongoing critical editions","P. N. Singer (ed.), Galen: Selected Works (Oxford, 1997); Loeb Classical Library volumes by I. Johnston and others"]}},"tlg2137":{"name":"Gaudentius","grc":null,"birth":null,"death":null,"floruit":350,"year":350,"era":"lateantique","desc":"Greek music theorist","wiki":"https://en.wikipedia.org/wiki/Gaudentius_(music_theorist)","q":"Q4134212","place":null,"occ":["musician","philosopher","musicologist","music theorist"],"nworks":1},"tlg2768":{"name":"Gelasius","grc":null,"birth":null,"death":null,"floruit":475,"year":475,"era":"lateantique","desc":"Gelasius of Cyzicus, author of a church history (c. 475)","wiki":"https://en.wikipedia.org/wiki/Anonymus_Cyzicenus","q":"Q1499216","place":null,"occ":["writer","historian","church historian"],"nworks":1},"tlg1383":{"name":"Geminus","grc":null,"birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"ancient Greek astronomer and mathematician","wiki":"https://en.wikipedia.org/wiki/Geminus","q":"Q379987","place":"Rhodes","occ":["astronomer","mathematician","geographer","philosopher"],"nworks":1},"tlg0593":{"name":"Gorgias of Leontini","grc":null,"birth":-483,"death":-375,"floruit":null,"year":-429,"era":"classical","desc":"Greek presocratic philosopher and sophist (483–375 BC)","wiki":"https://en.wikipedia.org/wiki/Gorgias","q":"Q179785","place":"Leontini","occ":["sophist"],"nworks":2},"tlg7000":{"name":"Greek Anthology","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient collection of short poems","wiki":"https://en.wikipedia.org/wiki/Greek_Anthology","q":"Q8934183","place":null,"occ":[],"nworks":1,"core":{"summary":"The Greek Anthology is the great collection of Greek epigrams: short poems, usually in elegiac couplets, written over some seventeen centuries, from archaic inscriptions to Byzantine verse. It includes epitaphs, dedications, love poems, satirical and comic pieces, riddles, Christian verse and descriptions of works of art, by some three hundred named poets and many anonymous ones. Among them are Plato (at least under his name), Callimachus, Meleager, Philodemus, Lucian and Agathias.\n\nIt grew in layers. Around 100 BCE the poet Meleager of Gadara gathered a 'Garland' (Στέφανος, Stephanos) of epigrams; Philip of Thessalonica made a second in the first century CE, and Agathias a 'Cycle' of contemporary poems in the sixth. Around 900 the Byzantine scholar Constantine Cephalas combined these and other collections into a large anthology, now lost. It survives, rearranged and expanded, in the Palatine Anthology, a tenth-century manuscript of about 3,700 epigrams in fifteen books, and in the smaller anthology made by Maximus Planudes in 1299–1301, whose extra poems are printed as Book 16 in modern editions.\n\nThe Anthology is a whole history of Greek poetry in miniature, and one of the best places to start reading Greek verse: short, varied and often witty.","timeline":[[-100,"Meleager of Gadara compiles his Garland (c. 100 BCE)"],[40,"Philip of Thessalonica compiles a second Garland (1st century CE)"],[567,"Agathias compiles his Cycle of contemporary epigrams (c. 567)"],[900,"Constantine Cephalas combines the earlier collections (c. 900)"],[950,"The Palatine Anthology manuscript is copied (10th century)"],[1301,"Maximus Planudes completes his anthology (1299–1301)"],[1494,"The Planudean Anthology is first printed at Florence"],[1606,"Claude Saumaise discovers the Palatine manuscript at Heidelberg"],[1623,"The manuscript is taken to Rome as war booty"],[1816,"Most of it is returned to Heidelberg; a smaller part remains in Paris"]],"manuscripts":"The Palatine Anthology is a single tenth-century manuscript, now divided between Heidelberg (Codex Palatinus graecus 23) and Paris (Parisinus Suppl. gr. 384), the result of its travels from Heidelberg to Rome in 1623, to Paris in 1797, and back in 1816. The Planudean Anthology survives in Planudes' own autograph in Venice (Marcianus gr. 481). Many epigrams are also known from inscriptions and papyri.","variants":"The Palatine and Planudean versions often differ, and Planudes sometimes censored or 'improved' the poems. Attributions to named poets are frequently confused or doubtful, as with the epigrams under Plato's name. Editors have to reconstruct the older Garlands from the order of poems in the Byzantine collections.","editions":["W. R. Paton, The Greek Anthology, 5 vols (Loeb Classical Library, 1916–18) — the Greek text and translation used here","H. Beckby, Anthologia Graeca, 4 vols (Munich, 1957–58; 2nd ed. 1965–68)","A. S. F. Gow and D. L. Page, The Greek Anthology: Hellenistic Epigrams (Cambridge, 1965) and The Garland of Philip (1968)","P. Waltz and others, Anthologie grecque (Budé, 1928–)"]}},"tlg9006":{"name":"Gregory II, of Cyprus, Patriarch of Constantinople","grc":null,"birth":1241,"death":1290,"floruit":null,"year":1265,"era":"byzantine","desc":"patriarch of Constantinople (1283–1289), scholar and rhetorician","wiki":"https://en.wikipedia.org/wiki/Gregory_II_of_Constantinople","q":"Q531732","place":"Cyprus","occ":["writer","patriarch","theologian","autobiographer"],"nworks":2},"tlg2022":{"name":"Gregory of Nazianzus","grc":"Γρηγόριος ὁ Ναζιανζηνός","birth":329,"death":390,"floruit":null,"year":360,"era":"lateantique","desc":"Christian saint and theologian (c. 329 – 390)","wiki":"https://en.wikipedia.org/wiki/Gregory_of_Nazianzus","q":"Q44011","place":"Arianzos","occ":["bishop","priest","poet","preacher","theologian"],"nworks":7,"core":{"summary":"Gregory of Nazianzus (Γρηγόριος ὁ Ναζιανζηνός, Grēgorios ho Nazianzēnos, c. 329–390 CE) was the son of the bishop of Nazianzus in Cappadocia. He studied at Caesarea, Alexandria and Athens, where he formed a lifelong friendship with Basil of Caesarea. He longed for a life of study and prayer but was repeatedly pressed into church office. His father ordained him a priest against his will; Basil made him bishop of Sasima, a post he never took up; and in 379 he went to Constantinople to lead the small Nicene community there. In 380 he preached the Five Theological Orations (27–31), which earned him the title 'the Theologian'. He briefly presided over the Council of Constantinople in 381, resigned amid its quarrels, and spent his last years writing on his family estate at Arianzus.\n\nWith Basil and Gregory of Nyssa he is one of the Cappadocian Fathers, who gave the doctrine of the Trinity its classical form. His works include forty-four orations, some 245 letters and about 17,000 lines of verse, among them a long autobiographical poem, On His Own Life. The Christus Patiens, a Byzantine drama stitched together from lines of Euripides and included here, was once attributed to him but is much later.\n\nGregory was the most admired Christian stylist in Byzantium, and his orations were studied and imitated as models of rhetoric for a thousand years. His Greek is elaborately Atticising, rich in antithesis, sound-play and classical allusion.","timeline":[[329,"Born near Nazianzus in Cappadocia (c. 329)"],[350,"Studies at Athens, with Basil (c. 350–358)"],[361,"Ordained priest by his father, against his will"],[372,"Consecrated bishop of Sasima by Basil, but never takes up the see"],[379,"Goes to Constantinople to lead the Nicene community"],[380,"Preaches the Five Theological Orations"],[381,"Presides briefly over the Council of Constantinople, then resigns"],[390,"Dies at Arianzus (c. 390)"]],"manuscripts":"Gregory's orations survive in an exceptionally large number of Byzantine manuscripts, many with commentaries and some illustrated, and in early translations into Latin, Syriac, Armenian and other languages. His poems have a separate and more complicated tradition.","variants":"The text of the orations is generally well established, but the number of manuscripts makes a full edition a vast undertaking. Several works under his name are not his, most notably the Christus Patiens, now usually dated to the eleventh or twelfth century. The poems include some of doubtful authenticity.","editions":["A. J. Mason, The Five Theological Orations of Gregory of Nazianzus (Cambridge, 1899) — the Greek text used here","J. G. Brambs, Christus Patiens (Teubner, 1885) — the text of the Christus Patiens used here","M. Ullmann, Die arabische Überlieferung der sogenannten Menandersentenzen (Wiesbaden, 1961) — the source of one text used here","P. Gallay and M. Jourjon, Grégoire de Nazianze: Discours 27–31 (Sources Chrétiennes 250, 1978)","F. W. Norris, Faith Gives Fullness to Reasoning: The Five Theological Orations of Gregory Nazianzen (Leiden, 1991)"]}},"tlg0064":{"name":"Hanno","grc":null,"birth":null,"death":null,"floruit":-500,"year":-500,"era":"archaic","desc":"5th century BC Carthaginian explorer","wiki":"https://en.wikipedia.org/wiki/Hanno_the_Navigator","q":"Q296478","place":"Carthage","occ":["explorer","seafarer"],"nworks":1},"tlg1389":{"name":"Harpocration","grc":null,"birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"2nd-century AD Alexandrian Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Harpocration","q":"Q721412","place":"Alexandria","occ":["grammarian","lexicographer"],"nworks":1},"tlg1390":{"name":"Hecataeus of Abderita","grc":null,"birth":-400,"death":-300,"floruit":null,"year":-350,"era":"classical","desc":"Greek philosopher and historian (c.360–c.290 BC)","wiki":"https://en.wikipedia.org/wiki/Hecataeus_of_Abdera","q":"Q471916","place":"Abdera","occ":["writer","historian","philosopher"],"nworks":1},"stoa0146d":{"name":"Hegemonius","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"reputed author of the Acta Archelai, a 4th-century Christian polemic against the Manichaeans","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0658":{"name":"Heliodorus of Emesa","grc":"Ἡλιόδωρος","birth":null,"death":null,"floruit":375,"year":375,"era":"lateantique","desc":"Greek novelist from Emesa, author of the Aethiopica (probably late 4th century)","wiki":"https://en.wikipedia.org/wiki/Heliodorus_of_Emesa","q":"Q313011","place":"Emesa","occ":["writer"],"nworks":1,"core":{"summary":"Heliodorus (Ἡλιόδωρος, Hēliodōros, 3rd or 4th century CE) signs his novel in its last sentence as \"a Phoenician from Emesa, of the race of the descendants of the Sun, Theodosius' son Heliodorus\". Emesa (modern Homs, in Syria) was a centre of the cult of the Sun god. His date is disputed. Many scholars place him in the late fourth century, because his account of the siege of Syene in Book 9 seems to draw on the Persian siege of Nisibis in 350; others prefer the third century. A later church historian identified him with a Christian bishop of Tricca in Thessaly, a story now generally regarded as legend.\n\nThe Aethiopica (Αἰθιοπικά, Aithiopika, \"Ethiopian Tales\"), in ten books, is the longest and most ambitious of the Greek novels. It opens in the middle of the action, with bandits on the Nile coast discovering a scene of slaughter and a beautiful young couple. Only gradually, through flashbacks and stories within stories, do we learn that Charicleia, a priestess at Delphi, is really the white-skinned daughter of the black king and queen of Ethiopia, and that she and the Thessalian Theagenes are travelling towards her homeland. The novel ends at Meroë with recognition, marriage and the abolition of human sacrifice.\n\nHeliodorus writes the most elaborate prose of the novelists: long periods, rare words, theatrical metaphors and a complex, suspenseful structure. Rediscovered in the sixteenth century, the Aethiopica was admired as a model of narrative art by Renaissance critics and imitated by Cervantes in his last novel, Persiles y Sigismunda.","timeline":[[350,"The Persian siege of Nisibis, which the siege of Syene in Book 9 seems to echo"],[375,"The Aethiopica written (3rd or, more probably, late 4th century)"],[440,"The church historian Socrates identifies the author with a bishop of Tricca, probably wrongly"],[1526,"A manuscript from Matthias Corvinus' library is taken during the sack of Buda"],[1534,"Editio princeps from that manuscript (Basel, Vincentius Opsopoeus)"],[1547,"Jacques Amyot's French translation"],[1617,"Cervantes' Persiles y Sigismunda, modelled on the Aethiopica, published after his death"]],"manuscripts":"The Aethiopica survives in more than twenty medieval and Renaissance manuscripts. The novel was little known in the West until a manuscript from the library of King Matthias Corvinus of Hungary was carried off during the Turkish sack of Buda in 1526 and printed eight years later at Basel. Byzantine readers valued the novel highly, and Michael Psellus compared it with Achilles Tatius.","variants":"The text is generally sound, but editors disagree over the grouping of the manuscripts and over many small readings. The main debate concerns the date and identity of the author, and whether the novel's religious elements, especially the cult of the Sun and the ending, reflect pagan devotion of the fourth century.","editions":["I. Bekker, Heliodori Aethiopicorum libri decem (Teubner, 1855) — the Greek text used here","R. M. Rattenbury, T. W. Lumb and J. Maillon, Héliodore: Les Éthiopiques, 3 vols (Budé, 1935–43; 2nd ed. 1960)","A. Colonna, Heliodori Aethiopica (Rome, 1938)","J. R. Morgan, 'Heliodorus: An Ethiopian Story', in B. P. Reardon (ed.), Collected Ancient Greek Novels (Berkeley, 1989)"]}},"tlg1402":{"name":"Hephaestion","grc":null,"birth":101,"death":200,"floruit":null,"year":150,"era":"imperial","desc":"ancient Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Hephaestion_(grammarian)","q":"Q549010","place":"Alexandria","occ":["grammarian"],"nworks":5},"tlg1409":{"name":"Heraclides Ponticus","grc":null,"birth":-385,"death":-322,"floruit":null,"year":-353,"era":"classical","desc":"Greek philosopher and astronomer (c.390–c.310 BC)","wiki":"https://en.wikipedia.org/wiki/Heraclides_Ponticus","q":"Q316334","place":"Heraclea Pontica","occ":["astronomer","philosopher"],"nworks":1},"tlg0066":{"name":"Heraclides, Criticus","grc":null,"birth":-345,"death":-285,"floruit":null,"year":-315,"era":"hellenistic","desc":"4th-century BC Greek philosopher and geographer","wiki":"https://en.wikipedia.org/wiki/Dicaearchus","q":"Q352621","place":null,"occ":["writer","geographer"],"nworks":1},"tlg1414":{"name":"Heraclitus","grc":null,"birth":null,"death":null,"floruit":50,"year":50,"era":"imperial","desc":"grammarian, author of the Homeric Problems, an allegorical defence of Homer (1st century CE)","wiki":"https://en.wikipedia.org/wiki/Heraclitus_(commentator)","q":"Q1057422","place":null,"occ":["philosopher"],"nworks":1},"tlg0626":{"name":"Heraclitus of Ephesus","grc":null,"birth":-535,"death":-470,"floruit":null,"year":-502,"era":"archaic","desc":"Greek philosopher (late 6th/early 5th-century BC)","wiki":"https://en.wikipedia.org/wiki/Heraclitus","q":"Q41155","place":"Ephesus","occ":["writer","philosopher"],"nworks":1},"tlg1419":{"name":"Hermas, 2nd cent.","grc":null,"birth":null,"death":null,"floruit":140,"year":140,"era":"imperial","desc":"author of the Shepherd, an early Christian apocalyptic work (2nd century)","wiki":"https://en.wikipedia.org/wiki/Hermas_(freedman)","q":"Q1799472","place":"Aquileia","occ":["writer"],"nworks":1},"tlg1286":{"name":"Hermetica","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Corpus Hermeticum: Greek philosophical and religious treatises ascribed to Hermes Trismegistus (2nd–3rd century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":19},"tlg0592":{"name":"Hermogenes","grc":null,"birth":160,"death":225,"floruit":null,"year":192,"era":"imperial","desc":"2nd century Greek rhetorician","wiki":"https://en.wikipedia.org/wiki/Hermogenes_of_Tarsus","q":"Q738027","place":"Tarsus","occ":["rhetorician","orator","grammarian"],"nworks":5},"tlg0559":{"name":"Hero of Alexandria","grc":null,"birth":10,"death":75,"floruit":60,"year":60,"era":"imperial","desc":"ancient Greek mathematician and engineer","wiki":"https://en.wikipedia.org/wiki/Hero_of_Alexandria","q":"Q161853","place":"Alexandria","occ":["engineer","mathematician","inventor","mechanic"],"nworks":12},"tlg0015":{"name":"Herodian","grc":"Ἡρωδιανός","birth":null,"death":null,"floruit":240,"year":240,"era":"imperial","desc":"Greco-Roman official and historian (c.170–c.240)","wiki":"https://en.wikipedia.org/wiki/Herodian","q":"Q313056","place":null,"occ":["writer","historian"],"nworks":1,"core":{"summary":"Herodian (Ἡρωδιανός, Hērōdianos, fl. c. 240 CE) is known only from his history. He was a Greek from the eastern provinces who says he held minor imperial and public posts in Rome and lived through the events he describes. His History of the Empire after Marcus (Τῆς μετὰ Μάρκον βασιλείας ἱστορία, Tēs meta Markon basileias historia), in eight books, covers the fifty-eight years from the death of Marcus Aurelius in 180 to the accession of Gordian III in 238. It is a vivid account of a violent age: the tyranny of Commodus, the Year of the Five Emperors, the Severans, and the soldier-emperor Maximinus Thrax.\n\nHerodian is a moralist and a stylist rather than a careful historian. He is vague about chronology, geography and administration, invents speeches freely, and sometimes contradicts Cassius Dio, who was closer to events. He is nevertheless our main continuous source for the years after Dio's history ends, and the later Latin Historia Augusta drew on him heavily.\n\nHis Greek is clear, Atticising and rhetorical, with short books and dramatic episodes, which makes him one of the most readable historians for students moving on from Xenophon. Angelo Poliziano's Latin translation made him popular in the Renaissance.","timeline":[[180,"Death of Marcus Aurelius; the history begins"],[193,"The Year of the Five Emperors, which Herodian lived through"],[238,"Accession of Gordian III, where the history ends"],[240,"Writes his history (c. 240–250)"],[1493,"Angelo Poliziano's Latin translation printed at Bologna"],[1503,"Aldine editio princeps of the Greek text"]],"manuscripts":"Herodian survives in a fair number of medieval manuscripts, most of them late, and his popularity in the Renaissance produced many more copies. The text is generally sound.","variants":"The main problems are historical rather than textual: Herodian's dates and details must constantly be checked against Cassius Dio, inscriptions and coins. Scholars disagree about his birthplace (Antioch has been suggested, without firm evidence), his exact career and the date at which he wrote.","editions":["I. Bekker, Herodiani ab excessu divi Marci libri octo (Teubner, 1855) — the Greek text used here","K. Stavenhagen, Herodiani ab excessu divi Marci libri octo (Teubner, 1922)","C. R. Whittaker, Herodian, 2 vols (Loeb Classical Library, 1969–70)","C. M. Lucarini, Herodianus: Regnum post Marcum (Teubner, 2005)"]}},"tlg0016":{"name":"Herodotus","grc":"Ἡρόδοτος","birth":-484,"death":-425,"floruit":null,"year":-454,"era":"classical","desc":"Greek historian and geographer","wiki":"https://en.wikipedia.org/wiki/Herodotus","q":"Q26825","place":"Halicarnassus","occ":["historian"],"nworks":1,"core":{"summary":"Herodotus of Halicarnassus (Ἡρόδοτος, Hērodotos, c. 484–c. 425 BCE) wrote a single great work, the Histories. Cicero called him \"the father of history\", though in the same breath he noted the countless tales in his work. His subject is the conflict between Greeks and Persians that ended in the Greek victories of 480–479 BCE, but his enquiry reaches much further: the customs of Egyptians, Scythians and Persians, the rise of the Persian empire, tyrants, oracles and marvels. The work opens by calling itself ἱστορίης ἀπόδεξις (historiēs apodexis, \"the setting-out of an enquiry\"), and his word for enquiry, historiē, gave us \"history\".\n\nHe travelled widely, questioned people and weighed their stories, often reporting several versions and saying which one he believes. Later critics, beginning with Thucydides and culminating in Plutarch's essay On the Malice of Herodotus, found him too fond of a good story or too kind to non-Greeks, but his curiosity and his fairness have kept him fresh.\n\nHe writes in Ionic Greek in a relaxed, flowing style that is a pleasure to read and one of the best ways into Greek prose. Expect η where Attic has ᾱ, uncontracted forms, κ where Attic has π in question words (κῶς, kōs, for πῶς, \"how?\"), and no h-sound in compounds such as ἀπικνέομαι (apikneomai, \"arrive\"; Attic ἀφικνέομαι).","timeline":[[-484,"Born at Halicarnassus (traditional date)"],[-450,"Travels in Egypt, the Levant, Scythia and elsewhere (dates uncertain)"],[-445,"Said by later sources to have given public readings at Athens"],[-443,"Joins, by tradition, the Athenian colony of Thurii in southern Italy"],[-425,"The latest datable events in the Histories belong to the early years of the Peloponnesian War (431–c. 425); Aristophanes' Acharnians (425) seems to parody its opening. Death shortly after"],[1474,"Lorenzo Valla's Latin translation printed in Venice"],[1502,"Aldine editio princeps"]],"manuscripts":"The manuscripts fall into two families. The 'Florentine' family is led by Laurentianus 70.3 in Florence (A, tenth century) and a manuscript in Rome (Angelicanus gr. 83, B, eleventh century); the 'Roman' family by Vaticanus gr. 2369 (D, eleventh or twelfth century), with R, S and V. Neither family is consistently better. Several dozen papyri, mostly from Oxyrhynchus, give earlier readings and show that the ancient text was already close to the medieval one. The division into nine books is probably the work of Hellenistic scholars; by the second century CE the books were named after the nine Muses.","variants":"Byzantine scribes 'improved' Herodotus' Ionic towards the Attic they knew, so every editor must decide how far to restore Ionic forms. Even the first words vary: our manuscripts call him \"Herodotus of Halicarnassus\", but Aristotle quotes the opening as \"Herodotus of Thurii\", and Plutarch says that many readers made that change.\n\nReaders have also long argued over passages whose truth Herodotus himself had to defend, such as the debate among the Persian nobles about the best form of government (3.80–82), which he insists really took place, and the meeting of Solon and Croesus, which chronology makes very hard to accept. Whether the work was meant to end where it does, at 9.122, has long been debated.","editions":["A. D. Godley, Herodotus, 4 vols (Loeb Classical Library, 1920–25) — the text and translation used here","N. G. Wilson, Herodoti Historiae, 2 vols (OCT, 2015), replacing Hude (3rd ed. 1927)","H. B. Rosén, Herodoti Historiae (Teubner, 1987–97)","D. Asheri, A. Lloyd, A. Corcella, A Commentary on Herodotus Books I–IV (Oxford, 2007)"]}},"tlg0020":{"name":"Hesiod","grc":"Ἡσίοδος","birth":null,"death":null,"floruit":-700,"year":-700,"era":"archaic","desc":"ancient Greek poet of the archaic period","wiki":"https://en.wikipedia.org/wiki/Hesiod","q":"Q44233","place":"Ascra","occ":["writer","poet","rhapsode","mythographer"],"nworks":3,"core":{"summary":"Hesiod (Ἡσίοδος, Hēsiodos) of Ascra in Boeotia, active around 700 BCE, is the first Greek poet to name himself and talk about himself. He tells us that the Muses taught \"Hesiod\" beautiful song (Ἡσίοδον καλὴν ἐδίδαξαν ἀοιδήν, Theogony 22) while he was herding sheep on Mount Helicon, after greeting the shepherds as \"mere bellies\". He says that his father had come over from Cyme in Asia Minor to settle at Ascra, \"bad in winter, hard in summer, never good\", and that he won a tripod for a song at funeral games at Chalcis on Euboea. Whether this persona is a real man's autobiography or partly a traditional role is debated. Hesiod is usually dated a little after Homer, though M. L. West argued that the Theogony is earlier than the Homeric poems.\n\nTwo poems in Homer's hexameter are generally accepted as his. The Theogony tells how the gods came into being and how Zeus won power over the universe. The Works and Days, addressed to his brother Perses after a quarrel over their inheritance, mixes myth (Pandora, the ages of mankind), moral advice about justice and hard work, and a practical farmer's calendar. Herodotus says that Homer and Hesiod gave the Greeks their gods, and it is largely through these two poets that we know Greek myth.\n\nHis language is Homer's epic dialect, but his voice is different: blunt, proverbial and argumentative. \"Fools, they do not know how much more the half is than the whole\" (νήπιοι, οὐδὲ ἴσασιν ὅσῳ πλέον ἥμισυ παντός, nēpioi, oude isasin hosōi pleon hēmisy pantos, Works and Days 40) is typical.","timeline":[[-700,"Hesiod active in Boeotia; Theogony and Works and Days composed"],[-580,"Sixth century: the Shield of Heracles and the Catalogue of Women circulate under his name"],[-300,"Praxiphanes, a pupil of Theophrastus, reports copies of the Works and Days without its opening hymn"],[-200,"Aristophanes of Byzantium doubts that the Shield is by Hesiod; Aristarchus later rejects the hymn that opens the Works and Days"],[1480,"Editio princeps of Works and Days (Milan, c. 1480); Aldine edition of the three poems 1495"]],"manuscripts":"The Works and Days, a favourite school text, survives in over 260 manuscripts, the Theogony in about 70 and the Shield in about 60. Important early witnesses include a Paris manuscript of the Works and Days from the tenth or eleventh century (Parisinus gr. 2771), Laurentianus 32.16 in Florence (1280) and Vaticanus gr. 915. Substantial papyrus fragments survive too, above all of the Catalogue of Women, a poem otherwise lost and known only from papyri and quotations.","variants":"Several parts of the collection were questioned in antiquity. The ending of the Theogony, from about line 900, may be a later addition that leads into the Catalogue of Women. The opening hymn to Zeus in the Works and Days was rejected by Aristarchus, Praxiphanes knew copies without it, and Pausanias was shown a lead tablet of the poem at Helicon that began without it. The Shield of Heracles was already doubted by Aristophanes of Byzantium and is generally dated to the sixth century; its first 56 lines are borrowed from the Catalogue. The 'Days' section at the end of the Works and Days (765–828) is often thought to be a later appendix.","editions":["H. G. Evelyn-White, Hesiod, the Homeric Hymns and Homerica (Loeb Classical Library, 1914) — the Greek text and translation used here","M. L. West, Theogony (Oxford, 1966) and Works and Days (Oxford, 1978), with commentary","F. Solmsen, R. Merkelbach, M. L. West, Hesiodi Theogonia, Opera et Dies, Scutum, Fragmenta Selecta (OCT, 3rd ed. 1990)","R. Merkelbach and M. L. West, Fragmenta Hesiodea (Oxford, 1967)","G. W. Most, Hesiod, 2 vols (Loeb Classical Library, 2006–07)"]}},"tlg1431":{"name":"Hipparchus","grc":null,"birth":-190,"death":-120,"floruit":null,"year":-155,"era":"hellenistic","desc":"Greek astronomer, geographer and mathematician (2nd century BCE)","wiki":"https://en.wikipedia.org/wiki/Hipparchus","q":"Q159905","place":"Nicaea","occ":["astronomer","mathematician","geographer"],"nworks":1},"tlg1434":{"name":"Hippias of Elis","grc":null,"birth":-443,"death":-399,"floruit":-420,"year":-420,"era":"classical","desc":"5th century BC Greek sophist","wiki":"https://en.wikipedia.org/wiki/Hippias","q":"Q210573","place":"Elis","occ":["astronomer","mathematician","sophist","philosopher","doxographer","tragedy writer"],"nworks":1},"tlg0627":{"name":"Hippocrates","grc":"Ἱπποκράτης","birth":-460,"death":-370,"floruit":null,"year":-415,"era":"classical","desc":"Greek physician (c. 460 – c. 370 BC)","wiki":"https://en.wikipedia.org/wiki/Hippocrates","q":"Q5264","place":"Cos","occ":["physician","philosopher"],"nworks":53,"core":{"summary":"Hippocrates of Cos (Ἱπποκράτης, Hippokratēs, c. 460–c. 370 BCE) was already famous in his lifetime: Plato mentions him as a well-known physician who taught medicine for a fee (Protagoras 311b), and Aristotle calls him \"the great Hippocrates\". He belonged to the Asclepiadae, a family of Coan doctors. Almost everything else in his traditional biography, including his saving Athens from the plague and his letters to kings and to Democritus, is later legend.\n\nThe Hippocratic Corpus, some sixty treatises gathered under his name probably at Alexandria, is the oldest body of Greek medical writing. It was written by many authors, mostly between about 430 and 350 BCE, with some works much later, and which (if any) are by Hippocrates himself is an unsolved problem, the 'Hippocratic question'. The Corpus teaches that diseases have natural causes and should be understood through careful observation. On the Sacred Disease argues that epilepsy is no more divine than any other illness, the Epidemics record case histories day by day, and Airs, Waters, Places links health to climate and environment. The Oath, still echoed in medical ethics, is one of the shortest works in the collection.\n\nThe treatises are written in Ionic prose, the scientific language of the fifth century, even by authors who were not Ionians. The first of the Aphorisms is the best-known sentence in Greek medicine: Ὁ βίος βραχύς, ἡ δὲ τέχνη μακρή (Ho bios brachys, hē de technē makrē, \"Life is short, the art is long\"), with the Ionic ending -ή where Attic would have μακρά.","timeline":[[-460,"Born on Cos (c. 460)"],[-433,"Plato's Protagoras, set around this time, mentions him as a teacher of medicine"],[-370,"Dies, by tradition at Larissa in Thessaly (c. 370)"],[-250,"The treatises are gathered at Alexandria into a Hippocratic collection; scholars begin writing glossaries and commentaries on them"],[170,"Galen's commentaries fix the image of Hippocrates as the ideal physician"],[1525,"Marco Fabio Calvo's Latin translation of the whole Corpus printed at Rome"],[1526,"Aldine editio princeps of the Greek text"],[1839,"Émile Littré begins his ten-volume edition (1839–61)"]],"manuscripts":"The Corpus survives in many medieval manuscripts, but no single one contains all the treatises, and each work has its own tradition. The oldest and most important include Marcianus gr. 269 in Venice (M), Parisinus gr. 2253 (A) and Vaticanus gr. 276 (V), of the tenth to twelfth centuries, and a Vienna manuscript (Vindobonensis med. gr. 4). Ancient commentaries, above all Galen's, quote the text centuries before the manuscripts. So do early translations into Latin, Syriac and Arabic, which sometimes preserve better readings.","variants":"The chief question is authorship. Ancient scholars already argued over which treatises were genuine, and modern scholars recognise several groups of works, sometimes linked to the schools of Cos and Cnidus, though that distinction is itself disputed. Several treatises were stitched together from shorter pieces, and some, such as the Precepts and the Letters, are clearly late. Scribes often normalised the Ionic forms, so editors must decide how much Ionic to restore.","editions":["É. Littré, Œuvres complètes d'Hippocrate, 10 vols (Paris, 1839–61) — the Greek text used here for most treatises","W. H. S. Jones, E. T. Withington and others, Hippocrates (Loeb Classical Library, 1923–), with later volumes by P. Potter and W. D. Smith — the Greek text and translation used here for several works","F. Adams, The Genuine Works of Hippocrates (1849; the 1886 printing used here) — the other translation used here","Corpus Medicorum Graecorum I (Berlin, 1927–), ongoing critical editions","J. Jouanna and others, Hippocrate (Budé, 1967–)"]}},"tlg2115":{"name":"Hippolytus","grc":null,"birth":170,"death":235,"floruit":null,"year":202,"era":"imperial","desc":"Christian theologian and saint (c. 170 – c. 235)","wiki":"https://en.wikipedia.org/wiki/Hippolytus_of_Rome","q":"Q207113","place":null,"occ":["writer","presbyter","theologian"],"nworks":1},"tlg0233":{"name":"Hipponax","grc":null,"birth":null,"death":null,"floruit":-540,"year":-540,"era":"archaic","desc":"Greek iambic poet of Ephesus (6th century BCE)","wiki":"https://en.wikipedia.org/wiki/Hipponax","q":"Q367377","place":"Ephesus","occ":["poet"],"nworks":1},"tlg0012":{"name":"Homer","grc":"Ὅμηρος","birth":null,"death":null,"floruit":-750,"year":-750,"era":"archaic","desc":"reputed author of the Iliad and the Odyssey","wiki":"https://en.wikipedia.org/wiki/Homer","q":"Q6691","place":null,"occ":["writer","poet","author"],"nworks":3,"core":{"summary":"The Iliad (Ἰλιάς, Ilias) and the Odyssey (Ὀδύσσεια, Odysseia) stand at the head of Greek literature. Nothing reliable is known about Homer (Ὅμηρος, Homēros) himself. Several cities claimed him, Smyrna and Chios most insistently, and the ancient Lives of Homer are largely fiction, written centuries later. The picture of a blind singer goes back to the Homeric Hymn to Apollo, whose poet calls himself \"a blind man, who lives in rocky Chios\"; Thucydides (3.104) already read those lines as Homer speaking of himself.\n\nModern scholarship sees both epics as the product of a long tradition of oral poetry, composed in performance by generations of singers and fixed in something like their present form, on most accounts, between the late eighth and the seventh century BCE, the Iliad somewhat before the Odyssey. Whether one poet made both is an old debate: already in antiquity a few scholars, the chōrizontes (χωρίζοντες, \"separators\"), gave the Odyssey to a different author. Antiquity also credited Homer with the Homeric Hymns, the comic Margites, the short Epigrams preserved in the Lives (included in this collection) and poems of the Epic Cycle, though Herodotus (2.117) already doubted that one of these, the Cypria, was his.\n\nThe Iliad tells of the wrath of Achilles in the tenth year of the Trojan War; the Odyssey follows Odysseus' ten-year journey home and his revenge on the men courting his wife Penelope. Both are in dactylic hexameter, in an artificial poetic language that nobody ever spoke. Its base is Ionic, with η even where Attic keeps ᾱ (ἀγορή, agorē, for Attic ἀγορά, \"assembly\"), but it mixes in Aeolic forms such as ἄμμες (ammes, \"we\", Attic ἡμεῖς) and very old ones such as genitives in -οιο (-oio). For the Greeks these poems were more than literature. They were the shared schoolbook, the source of their stories about gods and heroes, and the standard against which every later poet was measured.","timeline":[[-1184,"Eratosthenes' date for the fall of Troy (1184/3 BCE), the one most later writers followed; other ancient reckonings differed by more than a century, and whether a real war lies behind the story is still debated"],[-850,"Herodotus (2.53) places Homer and Hesiod about 400 years before his own time, that is, around 850 BCE"],[-750,"c. 750–650 BCE: the period in which most scholars place the composition and written fixing of the poems, the Iliad first; a minority view holds that the text stayed fluid into the sixth century or later"],[-520,"Tradition credits Peisistratos or his son Hipparchus with a standard text and with having the poems recited in full, in relay, at the Panathenaia; how much of this 'Peisistratean recension' is historical is disputed"],[-280,"Zenodotus of Ephesus, first head of the Library of Alexandria, makes the first critical edition (diorthōsis, διόρθωσις, 'correction')"],[-150,"Aristarchus of Samothrace, head of the Library, publishes his editions and commentaries. About this time the eccentric early papyri die out and a standard text (the 'vulgate') prevails, though it often does not follow Aristarchus' own readings"],[950,"Venetus A (Marc. gr. Z. 454 = 822) copied, with marginal scholia and critical signs that preserve much of Aristarchus' work"],[1488,"Editio princeps of Homer printed in Florence, edited by Demetrios Chalkokondyles"],[1788,"J.-B. G. d'Ansse de Villoison publishes Venetus A and its scholia, the evidence on which Wolf would build"],[1795,"F. A. Wolf's Prolegomena ad Homerum argues that the poems were composed without writing and assembled only later, opening the modern 'Homeric Question'"],[1928,"Milman Parry's L'Épithète traditionnelle dans Homère shows the formulaic system at work, the start of the oral-formulaic theory"]],"manuscripts":"No ancient author's text is better attested. Well over 1,500 papyri of Homer survive from Graeco-Roman Egypt, dating from the third century BCE to the seventh century CE, the Iliad far outnumbering the Odyssey. The earliest, from the Ptolemaic period, contain 'wild' texts with extra lines; these disappear after about 150 BCE, as a standard text took hold.\n\nThe medieval tradition rests on nearly 200 manuscripts of the Iliad and about 80 of the Odyssey. The most important is Venetus A (Marc. gr. Z. 454 = 822, tenth century) in Venice. Its margins carry Aristarchus' critical signs and scholia drawn from a lost digest of four later scholars (Didymus, Aristonicus, Herodian and Nicanor), our main source for Alexandrian work on the text. Venetus B (Marc. gr. Z. 453 = 821, eleventh century) and the Townley Homer (British Library, Burney 86, dated 1059 CE) carry a second family of mainly explanatory notes, the 'bT scholia'. The Odyssey has no witness of Venetus A's standing and much thinner scholia; its key manuscripts include Laurentianus 32.24 in Florence (tenth or eleventh century) and Palatinus gr. 45 in Heidelberg, dated 1201.","variants":"Aristarchus marked the lines he thought spurious with a marginal sign, the obelos (ὀβελός, 'spit'), but left them in the text. This 'setting aside' is called athetēsis (ἀθέτησις), and many lines he athetized still stand in modern editions: the Iliad's only mention of the Judgement of Paris (24.29–30) falls in a passage he rejected. The early papyri show 'plus-verses' (lines missing from the standard text) and different phrasing, signs of a performance tradition that was still fluid.\n\nBook 10 of the Iliad, the night raid known as the Doloneia, was already suspected in antiquity: a scholion reports that Homer composed it as a separate piece and Peisistratos put it into the poem. Many modern scholars also think it a later addition, though it has its defenders. At Odyssey 23.296 the scholia say that Aristophanes of Byzantium and Aristarchus made this line the πέρας (peras, 'limit, end') of the poem; whether they meant that everything after it was spurious, or only that the story reaches its goal there, is still debated.\n\nEditors also differ over how far to follow Aristarchus' readings, and over spelling, since the text passed through Athens and picked up Attic forms. The digamma (ϝ), a w-sound lost from Ionic speech, is printed in no standard edition, but the metre still feels it. In Iliad 1.7, Ἀτρεΐδης τε ἄναξ ἀνδρῶν, the τε is not elided because ἄναξ once began with it: ϝάναξ (wanax, 'lord'), a word already found in Linear B as wa-na-ka.","editions":["D. B. Monro and T. W. Allen, Homeri Opera I–II: Ilias (Oxford Classical Texts, 3rd ed. 1920) — the Iliad text used here; T. W. Allen, Homeri Opera III–IV: Odyssea (2nd ed. 1917–19)","A. T. Murray, Loeb Classical Library: Odyssey (1919) and Iliad (1924–25) — the Odyssey Greek text and one of the translations used here; revised by G. E. Dimock (Odyssey, 1995) and W. F. Wyatt (Iliad, 1999)","Samuel Butler, prose translations of the Iliad (1898) and Odyssey (1900; the Odyssey here as revised by T. Power and G. Nagy) — the other translations used here","M. L. West, Homerus: Ilias (Teubner, 1998–2000) and Odyssea (2017) — the fullest modern critical editions","H. van Thiel, Homeri Odyssea (1991) and Homeri Ilias (1996), texts that stay close to the medieval vulgate","G. S. Kirk (ed.), The Iliad: A Commentary, 6 vols (1985–93); A. Heubeck et al., A Commentary on Homer's Odyssey, 3 vols (1988–92)"]}},"tlg0013":{"name":"Homeric Hymns","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"collection of hexameter hymns to the gods, mostly of the 7th and 6th centuries BCE, a few later","wiki":"https://en.wikipedia.org/wiki/Homeric_Hymns","q":"Q329342","place":null,"occ":[],"nworks":33},"tlg0030":{"name":"Hyperides","grc":"Ὑπερείδης","birth":-389,"death":-322,"floruit":null,"year":-355,"era":"classical","desc":"Athenian logographer (c. 390 – 322 BC)","wiki":"https://en.wikipedia.org/wiki/Hypereides","q":"Q314447","place":"Athens","occ":["lawyer","military personnel","politician","orator"],"nworks":6,"core":{"summary":"Hyperides (Ὑπερείδης, Hypereidēs, 389–322 BCE) was a wealthy Athenian, said to have studied with Isocrates, who made his name as a speechwriter and prosecutor before becoming a leading politician. He was a lifelong opponent of Macedon. After the Athenian defeat at Chaeronea in 338 he proposed freeing slaves to defend the city. In 323 he helped prosecute Demosthenes in the Harpalus affair, but the two were soon allies again when Athens led the Greek revolt against Macedon after Alexander's death. After the defeat in that Lamian War, Hyperides was captured and put to death by the Macedonian regent Antipater in 322. He defended the courtesan Phryne on a charge of impiety, but the famous story that he won the case by baring her breasts before the jury is later legend.\n\nAncient critics admired Hyperides as the most versatile and witty of the orators; the author of On the Sublime placed him second only to Demosthenes. Yet none of his speeches survived the Middle Ages. Everything we have comes from papyri found since 1847, which have restored For Euxenippus complete, large parts of For Lycophron, Against Philippides, Against Athenogenes (a lively case of a swindle over the sale of a perfume shop) and Against Demosthenes, and the Funeral Oration for the Athenians who fell in the Lamian War. In 2002 two further speeches, Against Timandrus and Against Diondas, were discovered beneath the text of the Archimedes Palimpsest.\n\nHis Greek is lively and natural, closer to the language of everyday life than that of Demosthenes, with a gift for irony, anecdote and quick characterisation. The Funeral Oration is a moving example of the genre.","timeline":[[-389,"Born in Athens (389)"],[-338,"After Chaeronea, proposes freeing slaves to defend the city"],[-323,"Prosecutes Demosthenes in the Harpalus affair; after Alexander's death leads the revolt against Macedon"],[-322,"Funeral Oration for the dead of the Lamian War; executed on Antipater's orders"],[1847,"Papyri from a tomb at Thebes in Egypt restore large parts of three speeches"],[1888,"The Louvre acquires the papyrus of Against Athenogenes"],[2002,"Natalie Tchernetska discovers two lost speeches in the Archimedes Palimpsest"]],"manuscripts":"No medieval manuscript tradition survives: Hyperides disappeared in the Byzantine period. His speeches have been recovered from papyrus rolls found in Egypt from 1847 onwards and now in London and Paris, and from the Archimedes Palimpsest in the twenty-first century. The palimpsest shows that a copy of his speeches still existed in Byzantium in the tenth century before it was scraped and reused. Quotations by later grammarians preserve many short fragments.","variants":"Papyrus texts are often damaged and require many supplements, and readings of the palimpsest continue to improve with new imaging. The speeches Against Timandrus and Against Diondas, published in 2005 and 2008, have added about a fifth to what we have of Hyperides and are still being studied.","editions":["J. O. Burtt, Minor Attic Orators II: Lycurgus, Dinarchus, Demades, Hyperides (Loeb Classical Library, 1954) — the Greek text and translation used here","C. Jensen, Hyperidis Orationes Sex (Teubner, 1917)","D. Whitehead, Hypereides: The Forensic Speeches (Oxford, 2000), with commentary","J. Herrman, Hyperides: Funeral Oration (Oxford, 2009)"]}},"tlg2023":{"name":"Iamblichus","grc":"Ἰάμβλιχος","birth":245,"death":325,"floruit":null,"year":285,"era":"imperial","desc":"Syrian Neoplatonist philosopher (c. 245 – c. 325)","wiki":"https://en.wikipedia.org/wiki/Iamblichus","q":"Q310916","place":"Chalcis (Syria)","occ":["writer","philosopher"],"nworks":5,"core":{"summary":"Iamblichus (Ἰάμβλιχος, Iamblichos, c. 245–c. 325 CE) came from Chalcis in Syria and had a Semitic name. He studied with Porphyry, probably in Rome, and later founded his own school in Syria, perhaps at Apamea. He turned the Neoplatonism of Plotinus and Porphyry in a new direction, giving a central place to theurgy (θεουργία, theourgia, \"divine work\"), the ritual practices through which, he believed, the soul could be united with the gods. Later Neoplatonists called him 'the divine Iamblichus', and his influence runs through Proclus and the emperor Julian.\n\nMuch of his work is lost, including his commentaries on Plato and Aristotle. What survives includes On the Mysteries, a reply to Porphyry's critical letter about ritual, written under the name of an Egyptian priest, Abamon. It also includes four books of a longer series on Pythagoreanism: On the Pythagorean Life, the Protrepticus (an exhortation to philosophy, which preserves large parts of Aristotle's lost Protrepticus), On General Mathematical Science, and a commentary on Nicomachus' Introduction to Arithmetic.\n\nIamblichus' Greek is often heavy and repetitive, and he borrows long passages from earlier writers, which makes him valuable as a source even where his own voice is hard to hear.","timeline":[[245,"Born at Chalcis in Syria (c. 245)"],[275,"Studies with Porphyry"],[300,"Founds his own school in Syria (c. 300)"],[325,"Dies (c. 325)"],[362,"The emperor Julian praises him as the equal of Plato"],[1497,"Marsilio Ficino's Latin paraphrase of On the Mysteries printed"]],"manuscripts":"The Pythagorean works depend mainly on a single Florentine manuscript, on which Nauck based the edition of On the Pythagorean Life used here. On the Mysteries survives in a separate tradition. Many of his lost works are known only from quotations in later Neoplatonists and in the anthology of Stobaeus.","variants":"With the Pythagorean works resting on one manuscript, many corruptions must be corrected by conjecture. Iamblichus' habit of reproducing earlier writers without acknowledgement makes it hard to tell his own words from his sources. His use of Aristotle's Protrepticus is the basis of the modern reconstruction of that lost work. The attribution of On the Mysteries to Iamblichus rests on a note in the manuscripts and on its content, and is generally accepted.","editions":["A. Nauck, De vita Pythagorica (St Petersburg, 1884); E. Pistelli, Protrepticus (Teubner, 1888) and In Nicomachi Arithmeticam (1894); N. Festa, De communi mathematica scientia (1891); G. Parthey, De mysteriis (Berlin, 1857) — the texts used here","L. Deubner, Iamblichi de vita Pythagorica liber (Teubner, 1937)","H. D. Saffrey and A.-P. Segonds, Jamblique: Réponse à Porphyre (De mysteriis) (Budé, 2013)","E. C. Clarke, J. M. Dillon and J. P. Hershbell, Iamblichus: On the Mysteries (Atlanta, 2003)"]}},"tlg1441":{"name":"Iamblichus (Scr. Erot.)","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"2nd century Syrian Greek novelist","wiki":"https://en.wikipedia.org/wiki/Iamblichus_(novelist)","q":"Q666210","place":"Syria","occ":["writer"],"nworks":1},"tlg2140":{"name":"Iamblichus Alchemista","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"alchemical fragment transmitted under the name Iamblichus","wiki":null,"q":"Q110917591","place":null,"occ":["alchemist"],"nworks":1},"tlg1443":{"name":"Ignatius of Antioch","grc":null,"birth":35,"death":108,"floruit":null,"year":71,"era":"imperial","desc":"bishop of Antioch, whose letters were written on his way to martyrdom in Rome (early 2nd century)","wiki":"https://en.wikipedia.org/wiki/Ignatius_of_Antioch","q":"Q44170","place":"Roman Syria","occ":["bishop","presbyter","theologian"],"nworks":2},"tlg1447":{"name":"Irenaeus, Saint, Bishop of Lyon","grc":"Εἰρηναῖος","birth":130,"death":202,"floruit":null,"year":166,"era":"imperial","desc":"bishop of Lyon and theologian, author of Against Heresies (c. 130–c. 202)","wiki":"https://en.wikipedia.org/wiki/Irenaeus","q":"Q182123","place":"Smyrna","occ":["bishop","presbyter","philosopher","Christian theologian"],"nworks":2,"core":{"summary":"Irenaeus (Εἰρηναῖος, Eirēnaios, c. 130–c. 202 CE) grew up in Asia Minor, probably at Smyrna, where as a boy he heard Polycarp, the bishop who was said to have known the apostle John. He moved to Lyon in Gaul and became a presbyter there. During the persecution of 177, when many of the church of Lyon were martyred, he was carrying a letter to Rome. On his return he succeeded the martyred Pothinus as bishop. Around 190 he wrote to Pope Victor urging peace in the dispute over the date of Easter. Nothing certain is known of his death, and the tradition that he was martyred is late.\n\nHis great work, Against Heresies (Ἔλεγχος καὶ ἀνατροπὴ τῆς ψευδωνύμου γνώσεως, \"Refutation and Overthrow of Knowledge Falsely So Called\"), in five books, describes and refutes the Gnostic teachers, especially the Valentinians. Against them he set the four Gospels, the rule of faith and the succession of bishops from the apostles, and he developed a theology of salvation as the 'recapitulation' of humanity in Christ. His shorter Demonstration of the Apostolic Preaching was rediscovered in an Armenian translation in 1904. In 2022 the Catholic Church declared him a Doctor of the Church.\n\nIrenaeus wrote in Greek, but the Greek of Against Heresies is lost except for quotations, especially in Epiphanius and Hippolytus. The complete work survives in an early Latin translation, and parts of it in Armenian and Syriac. His style is plain and energetic, and he apologises for writing among Celts rather than in the schools.","timeline":[[130,"Born in Asia Minor, probably at Smyrna (c. 130)"],[155,"Hears Polycarp preach at Smyrna before Polycarp's martyrdom"],[177,"Persecution at Lyon; Irenaeus carries a letter to Rome and then becomes bishop"],[180,"Against Heresies (c. 180)"],[190,"Writes to Pope Victor about the date of Easter"],[202,"Dies (c. 202)"],[1904,"The Demonstration of the Apostolic Preaching is found in an Armenian manuscript"]],"manuscripts":"Against Heresies survives complete only in a Latin translation, probably made in the fourth century, preserved in several medieval manuscripts. Substantial Greek fragments, especially of Book 1, are quoted by Epiphanius, Hippolytus and Eusebius, and an Armenian translation preserves Books 4 and 5. The Demonstration survives only in Armenian.","variants":"Editors must reconstruct the Greek from the Latin translation and the fragments, and the Latin is sometimes obscure. The date of the translation is debated. Some fragments attributed to Irenaeus in later collections are not his.","editions":["W. W. Harvey, Sancti Irenaei Libros quinque adversus haereses, 2 vols (Cambridge, 1857) — the text used here","M. J. Routh, Reliquiae Sacrae (Oxford, 1846) — the text of the fragment of his synodal letter used here","A. Rousseau, L. Doutreleau and others, Irénée de Lyon: Contre les hérésies, 10 vols (Sources Chrétiennes, 1965–82)","D. J. Unger and others, St Irenaeus of Lyons: Against the Heresies (Ancient Christian Writers, 1992–)"]}},"tlg0017":{"name":"Isaeus","grc":"Ἰσαῖος","birth":-420,"death":-340,"floruit":-370,"year":-370,"era":"classical","desc":"4th-century BC Greek orator","wiki":"https://en.wikipedia.org/wiki/Isaeus","q":"Q365097","place":"Athens","occ":["lawyer","speechwriter","orator"],"nworks":12,"core":{"summary":"Isaeus (Ἰσαῖος, Isaios, c. 420–c. 340 BCE) is an obscure figure. Dionysius of Halicarnassus could say only that he was from Chalcis or Athens, and the tradition that he studied with Isocrates and taught Demosthenes may be no more than a guess based on style. He was a professional speechwriter, and ancient scholars knew some sixty-four speeches under his name, of which they judged fifty genuine.\n\nEleven complete speeches survive, all concerning disputes over inheritances, with a large part of a twelfth, For Euphiletus, about a claim to citizenship, preserved by Dionysius. Athenian law allowed a man without legitimate sons to adopt an heir, and rival relatives fought over estates with forged wills, disputed adoptions and questions about who was legitimate. Isaeus' speeches are therefore our richest source for Athenian family law, property and the private lives of well-off Athenians.\n\nDionysius compared his style with that of Lysias. Isaeus shares Lysias' clear, pure Attic, but he is more openly forceful and argumentative, less concerned to seem artless, and he presses his proofs hard. His speeches are compact and full of legal detail, and they reward readers interested in how Athenians argued about money and family.","timeline":[[-420,"Born (c. 420), at Chalcis or Athens"],[-389,"His earliest datable speeches (c. 389)"],[-344,"His latest datable speech (c. 344)"],[-340,"Dies (c. 340)"],[1513,"First printed in the Aldine Orators (Venice)"]],"manuscripts":"The speeches survive mainly in the early fourteenth-century Codex Crippsianus in the British Library (Burney 95, A) and related manuscripts. For Euphiletus is known only from the extract quoted by Dionysius of Halicarnassus in his essay on Isaeus.","variants":"Because the texts depend on a narrow tradition, many readings are conjectural. The laws and documents quoted in the speeches must be treated with caution. The dates of individual speeches are often uncertain. Scholars also debate how far Isaeus' clients were telling the truth; the commentator William Wyse famously treated him as a skilled but unreliable advocate.","editions":["E. S. Forster, Isaeus (Loeb Classical Library, 1927) — the Greek text and translation used here","W. Wyse, The Speeches of Isaeus (Cambridge, 1904), with commentary","P. Roussel, Isée: Discours (Budé, 1922)","M. Edwards, Isaeus (Austin, 2007), translation"]}},"tlg0070":{"name":"Isidore, of Charax","grc":null,"birth":null,"death":null,"floruit":-25,"year":-25,"era":"imperial","desc":"Greco-Roman geographer of the 1st centuries BCE and CE","wiki":"https://en.wikipedia.org/wiki/Isidore_of_Charax","q":"Q1351420","place":"Charax Spasinu","occ":["geographer","explorer"],"nworks":1},"tlg0010":{"name":"Isocrates","grc":"Ἰσοκράτης","birth":-436,"death":-338,"floruit":null,"year":-386,"era":"classical","desc":"Greek rhetorician and writer","wiki":"https://en.wikipedia.org/wiki/Isocrates","q":"Q221182","place":"Athens","occ":["writer","orator"],"nworks":30,"core":{"summary":"Isocrates (Ἰσοκράτης, Isokratēs, 436–338 BCE) ran the most successful school of rhetoric in Athens for half a century. By his own account a weak voice and nervousness kept him from speaking in public, so he wrote instead. He began with speeches for clients in the law courts, a trade he later preferred to forget, although Aristotle, as Dionysius of Halicarnassus reports, said that booksellers hawked bundles of them. He went on to political essays in the form of speeches, meant to be read.\n\nHis great theme was Greek unity. In the Panegyricus (380 BCE) he called on the Greeks to stop fighting one another and unite against Persia, and in later life he looked to Philip of Macedon as the leader who might bring it about (Philippus, 346 BCE). He called his teaching φιλοσοφία (philosophia), a training in thinking and speaking well for public life, in open rivalry with Plato's Academy; Plato's Phaedrus ends with Socrates praising the young Isocrates' promise, whether sincerely or with irony is debated.\n\nHis long, smoothly balanced sentences are built with great care. He avoids hiatus (a vowel at the end of one word meeting a vowel at the start of the next) almost completely, and pairs clause against clause with μέν … δέ (men … de, \"on the one hand … on the other\"). This style shaped the prose of Cicero and, through him, much of European prose.","timeline":[[-436,"Born in Athens"],[-403,"Writes forensic speeches for clients after the family fortune is lost in the Peloponnesian War"],[-390,"Opens his school in Athens, c. 390 BCE"],[-380,"Panegyricus"],[-353,"Antidosis, an apologia for his career written at the age of eighty-two"],[-346,"Philippus"],[-339,"Completes the Panathenaicus in his late nineties"],[-338,"Dies after Chaeronea, reportedly by starving himself, though a letter to Philip written after the battle, if genuine, strikes a different note"],[1493,"Editio princeps (Milan)"]],"manuscripts":"The principal manuscript, Urbinas gr. 111 in the Vatican (Γ, ninth or tenth century), is far better than the rest. The second family, the 'vulgate', is represented by Laurentianus 87.14 (Λ), Vaticanus gr. 936 (Θ) and Parisinus gr. 2932 (Π). Papyri add earlier evidence, among them a fourth-century CE codex of wooden boards from Kellis in the Egyptian desert containing To Demonicus, To Nicocles and Nicocles.","variants":"Γ often lacks words found in the other family, and editors disagree about which tradition added words and which lost them. Some works in the corpus are of doubtful authenticity: To Demonicus, the first speech in most editions, is widely thought not to be by Isocrates, and whether the Letters and speeches 20 and 21 are genuine is debated.","editions":["G. Norlin and L. Van Hook, Isocrates, 3 vols (Loeb Classical Library, 1928–45) — the Greek text and translation used here","G. Mathieu and É. Brémond, Isocrate: Discours, 4 vols (Budé, 1928–62)","B. G. Mandilaras, Isocrates: Opera Omnia, 3 vols (Teubner, 2003)","D. C. Mirhady and Y. L. Too, Isocrates I (Austin, 2000), and T. L. Papillon, Isocrates II (Austin, 2004), modern translations"]}},"tlg2934":{"name":"John of Damascus, Saint","grc":null,"birth":675,"death":749,"floruit":730,"year":730,"era":"byzantine","desc":"Christian monk, priest, hymnographer and apologist (675/6-749)","wiki":"https://en.wikipedia.org/wiki/John_of_Damascus","q":"Q51884","place":"Damascus","occ":["writer","composer","theologian","cleric","philosopher"],"nworks":1},"tlg4015":{"name":"John Philoponus","grc":null,"birth":490,"death":570,"floruit":null,"year":530,"era":"lateantique","desc":"Byzantine philologist and philosopher (c. 490–c. 570)","wiki":"https://en.wikipedia.org/wiki/John_Philoponus","q":"Q317632","place":"Alexandria","occ":["astronomer","writer","mathematician","theologian","philosopher"],"nworks":8},"tlg2003":{"name":"Julian, Emperor of Rome","grc":"Ἰουλιανός","birth":331,"death":363,"floruit":null,"year":347,"era":"lateantique","desc":"last non-Christian Roman emperor (reigned 361–363) and writer","wiki":"https://en.wikipedia.org/wiki/Julian_(emperor)","q":"Q33941","place":"Constantinople","occ":["writer","politician","philosopher"],"nworks":14,"core":{"summary":"Julian (Ἰουλιανός, Ioulianos, 331–363 CE), nephew of Constantine the Great, was born in Constantinople. When he was six most of his male relatives were killed in the purge that followed Constantine's death. He was brought up as a Christian but educated in Greek literature, and as a young man he turned secretly to Neoplatonic philosophy and the old gods. In 355 his cousin Constantius II made him Caesar and sent him to Gaul, where he won a great victory over the Alamanni at Strasbourg (357). In 360 his troops proclaimed him emperor at Paris, and Constantius' death in 361 left him sole ruler.\n\nIn a reign of just twenty months Julian tried to restore the worship of the gods, reorganise a pagan priesthood, and remove Christian influence from education: his edict of 362 barred Christians from teaching the classical authors. He spent the winter of 362/3 at Antioch, quarrelled with its citizens, and was killed in June 363 during his invasion of Persia. Christians called him 'the Apostate'.\n\nJulian was a prolific writer. His works include panegyrics of Constantius and the empress Eusebia, philosophical hymns to King Helios and to the Mother of the Gods, attacks on the Cynics of his day, the Caesars (a satire in which earlier emperors are judged by the gods), the Misopogon (\"Beard-Hater\", a mock self-attack aimed at the people of Antioch), many letters and a treatise Against the Galilaeans (Christians), known mainly through Cyril of Alexandria's reply. His Greek is fluent, learned Attic, lively and personal in the satires and letters. The story that he died saying \"You have won, Galilaean\" is a later Christian legend.","timeline":[[331,"Born at Constantinople"],[337,"Death of Constantine; most of Julian's male relatives are killed"],[351,"Turns secretly to Neoplatonism and the worship of the gods (c. 351)"],[355,"Studies briefly at Athens; made Caesar and sent to Gaul"],[357,"Defeats the Alamanni at Strasbourg"],[360,"Proclaimed Augustus by his troops at Paris"],[361,"Sole emperor after the death of Constantius II"],[362,"Edict barring Christians from teaching the classics; arrives at Antioch"],[363,"Misopogon written at Antioch; Julian is killed on campaign in Persia (26 June)"],[440,"Cyril of Alexandria's reply preserves much of Against the Galilaeans (c. 440)"]],"manuscripts":"Julian's speeches and letters survive in several groups of medieval manuscripts. The letters are scattered through many collections, some of them including forgeries. Against the Galilaeans survives only in quotations, almost all from Cyril of Alexandria's Against Julian, which is itself partly lost in Greek and partly preserved in Syriac.","variants":"The authenticity of many letters attributed to Julian is disputed, and some are clearly forgeries. The reconstruction of Against the Galilaeans depends on how faithfully Cyril quoted it, and only the first of it
