, arranges the dialogues in nine tetralogies, perhaps building on an earlier arrangement"],[895,"Oxford, Bodleian MS E. D. Clarke 39 (B) copied for Arethas of Caesarea"],[1484,"Marsilio Ficino's Latin translation of the complete dialogues printed in Florence"],[1513,"Aldine editio princeps"],[1578,"Henri Estienne (Stephanus) edition in Geneva; its page numbers become the standard citation system"]],"manuscripts":"The medieval tradition rests on a few primary manuscripts. The oldest dated one is the Bodleian Library's Clarke 39 in Oxford (B), copied in 895 for Arethas of Caesarea and covering the first six tetralogies. Beside it stand a Venice manuscript (Marcianus App. Class. IV.1, T, mid-tenth century), a Vienna manuscript (Suppl. gr. 7, W, eleventh century) and, for the last two tetralogies including the Republic, Parisinus gr. 1807 (A, ninth century) and a later but independent Vienna manuscript (Suppl. gr. 39, F). The arrangement of the dialogues in nine groups of four (tetralogies) goes back to Thrasyllus in the first century CE. Papyri from the third century BCE onward preserve parts of many dialogues, sometimes with readings that differ from the medieval manuscripts.","variants":"Scholars debate whether several works in the collection are genuine. The First Alcibiades, the Greater Hippias, the Clitophon, the Epinomis and most of the Letters are doubted by many; the Seventh Letter, the most important of them, is itself much debated. The Second Alcibiades, the Minos and others are generally considered spurious, and a few short pieces were already classed as spurious in antiquity. Diogenes Laertius reports that the Laws was left on wax tablets and copied out by Plato's pupil Philip of Opus, who may also have written the Epinomis. The text of the Apology and Crito is comparatively secure. Some have argued that Book 1 of the Republic began life as a separate, earlier dialogue.\n\nPassages are cited by Stephanus' page and section letter: Republic 514a, for example, is the opening of the Allegory of the Cave.","editions":["J. Burnet, Platonis Opera, 5 vols (OCT, 1900–07) — the text used here; vol. 1 replaced by E. A. Duke et al. (1995)","H. N. Fowler, W. R. M. Lamb, P. Shorey, R. G. Bury and others, Plato, 12 vols (Loeb Classical Library, 1914–35) — the translations used here","S. R. Slings, Platonis Respublica (OCT, 2003)","The Budé (Les Belles Lettres) series, 1920–64, with introductions and French translation","J. M. Cooper (ed.), Plato: Complete Works (Indianapolis, 1997), modern English translations"]}},"tlg2000":{"name":"Plotinus","grc":"Πλωτῖνος","birth":205,"death":270,"floruit":null,"year":237,"era":"imperial","desc":"Platonist philosopher, founder of Neoplatonism (c. 204/5–270)","wiki":"https://en.wikipedia.org/wiki/Plotinus","q":"Q134189","place":"Lycopolis","occ":["writer","philosopher"],"nworks":1,"core":{"summary":"Plotinus (Πλωτῖνος, Plōtinos, 204/5–270 CE) is known to us almost entirely from the Life written by his pupil Porphyry. He was born in Egypt (a later writer, Eunapius, names Lycopolis). He turned to philosophy at twenty-eight and studied for eleven years at Alexandria with Ammonius Saccas. In 243 he joined the emperor Gordian III's campaign against Persia, hoping to learn the philosophy of the Persians and Indians. After the campaign failed he settled in Rome, where he taught for the rest of his life; he once asked the emperor Gallienus, in vain, to found a city of philosophers, 'Platonopolis'. He died in Campania in 270.\n\nPlotinus saw himself as an interpreter of Plato, but modern scholars regard him as the founder of Neoplatonism. All reality, in his account, flows from a single source, the One (τὸ ἕν, to hen), through Intellect (νοῦς, nous) and Soul (ψυχή, psychē) down to the material world, and the soul's task is to turn back and rise to its origin. He began writing only at about fifty, in 253/4, and produced fifty-four treatises. After his death Porphyry arranged them by subject into six groups of nine, the Enneads (Ἐννεάδες, Enneades, from ἐννέα, \"nine\"), and published them around 301 with the Life. Through Porphyry, Augustine and Ficino his thought shaped late ancient, medieval and Renaissance philosophy, Christian, Jewish and Islamic alike.\n\nHis Greek is hard. Porphyry says that Plotinus wrote as he thought, never reread or corrected his work because of his weak eyes, and paid no attention to spelling (Life 8). The result is compressed, allusive prose that often reads like one side of a seminar discussion, with objections raised and answered in a few words. Most readers do best with a translation beside the Greek.","timeline":[[205,"Born in Egypt (204/5)"],[232,"Begins eleven years of study with Ammonius Saccas at Alexandria"],[243,"Joins Gordian III's campaign against Persia"],[244,"Settles in Rome and begins teaching"],[253,"Begins to write his treatises"],[263,"Porphyry joins his circle"],[270,"Dies in Campania"],[301,"Porphyry publishes the Enneads with his Life of Plotinus (c. 301)"],[850,"Ninth century: an Arabic paraphrase of parts of Enneads IV–VI circulates as the 'Theology of Aristotle'"],[1492,"Marsilio Ficino's Latin translation printed in Florence"],[1580,"Editio princeps of the Greek text (Basel, Pietro Perna), with Ficino's translation"]],"manuscripts":"All the surviving manuscripts go back to a single archetype of Porphyry's edition. Paul Henry and Hans-Rudolf Schwyzer, whose edition was the first to rest on a full study of the tradition, sorted them into a few families. An ancient note (on Ennead IV.4.29) mentions an edition by another pupil, the physician Eustochius, and long passages quoted by Eusebius may derive from it. The Arabic 'Theology of Aristotle' is an independent, if very free, witness to parts of the text.","variants":"Porphyry's arrangement is by subject, not by date, and it sometimes splits a single long work across several treatises. The so-called 'great treatise', for example, is divided among III.8, V.8, V.5 and II.9. The Life gives the order in which the treatises were written, and many readers now follow it. Plotinus' compressed style leaves many sentences open to more than one construction, so translations differ more than usual.","editions":["R. Volkmann, Plotini Enneades, 2 vols (Teubner, 1883–84) — the Greek text used here","P. Henry and H.-R. Schwyzer, Plotini Opera, editio maior (1951–73) and editio minor (OCT, 1964–82)","A. H. Armstrong, Plotinus, 7 vols (Loeb Classical Library, 1966–88)","L. P. Gerson (ed.), Plotinus: The Enneads (Cambridge, 2018), a complete modern translation"]}},"tlg0007":{"name":"Plutarch","grc":"Πλούταρχος","birth":46,"death":120,"floruit":null,"year":80,"era":"imperial","desc":"Greek philosopher, biographer and essayist","wiki":"https://en.wikipedia.org/wiki/Plutarch","q":"Q41523","place":"Chaeronea","occ":["writer","priest","historian","biographer","magistrate","philosopher"],"nworks":145,"core":{"summary":"Plutarch (Πλούταρχος, Ploutarchos, c. 46–after 119 CE) spent most of his life in his small home town of Chaeronea in Boeotia, though he studied in Athens, visited Rome and Alexandria, held Roman citizenship as Lucius Mestrius Plutarchus, and served for many years as one of the two priests of Apollo at Delphi. He was a Platonist philosopher and an enormously productive writer. An ancient list of his works, the Lamprias catalogue, names 227 titles; about fifty Lives and some seventy-eight other works survive.\n\nHis Parallel Lives pair a Greek statesman or general with a Roman one (Alexander with Caesar, Demosthenes with Cicero) to explore character and moral example. As he puts it at the start of the Alexander, \"it is not histories I am writing, but lives\" (οὔτε γὰρ ἱστορίας γράφομεν, ἀλλὰ βίους). The Moralia gathers everything else: essays, dialogues and lectures on ethics, religion, education, politics, natural science and literature. Translated into French by Jacques Amyot and from Amyot into English by Thomas North, whose version Shakespeare used for his Roman plays, Plutarch was one of the most widely read Greek authors in Renaissance and early modern Europe.\n\nHis Greek is learned, leisurely Koine with a large vocabulary and long, balanced sentences. He is no strict Atticist, but like the classical orators he takes care to avoid hiatus.","timeline":[[46,"Born at Chaeronea in Boeotia"],[66,"Studies at Athens under the Platonist Ammonius"],[90,"Visits Rome; lectures there"],[95,"Becomes a priest of Apollo at Delphi"],[100,"Parallel Lives composed over the following two decades"],[120,"Dies at Chaeronea, some time after 119"],[1296,"Maximus Planudes' edition of the Moralia"],[1509,"Aldine editio princeps of the Moralia; Lives printed at Florence, 1517"],[1559,"Jacques Amyot's French translation of the Lives, the source of Thomas North's English version (1579)"]],"manuscripts":"The Lives come down in two arrangements, one in two volumes and one in three. Leading witnesses include two Paris manuscripts, Parisinus gr. 1671 (A, 1296) and Parisinus gr. 1672 (E, fourteenth century), the fullest single manuscript of Plutarch, together with Laurentianus 69.6 in Florence (L) and Marcianus gr. 385 in Venice. For the Moralia, the collection made by the Byzantine scholar Maximus Planudes around 1296 gave the corpus its shape.","variants":"Not all the Lives survive. The pair Epaminondas and Scipio, which probably opened the series, is lost, as are several single Lives named in the Lamprias catalogue. Several works in the Moralia are not his, including On the Education of Children and the Lives of the Ten Orators. The order in which the pairs of Lives are transmitted is not Plutarch's own.","editions":["B. Perrin, Plutarch's Lives, 11 vols (Loeb Classical Library, 1914–26) — the Greek text and translation of the Lives used here","G. N. Bernardakis, Plutarchi Chaeronensis Moralia, 7 vols (Teubner, 1888–96), and the Loeb Moralia (F. C. Babbitt, H. Cherniss, W. C. Helmbold and others) — the Moralia texts used here","W. W. Goodwin (ed.), Plutarch's Morals, 5 vols (Boston, 1870), a revision of the seventeenth-century translation 'by several hands' — also used here","K. Ziegler, Plutarchi Vitae Parallelae (Teubner, 1957–80); Moralia ed. Paton, Pohlenz and others (Teubner, 1925–78)","R. Flacelière and others, Plutarque: Vies (Budé, 1957–83)"]}},"tlg0616":{"name":"Polyaenus Macedo","grc":null,"birth":null,"death":null,"floruit":162,"year":162,"era":"imperial","desc":"2nd-century Greek author and rhetorician","wiki":"https://en.wikipedia.org/wiki/Polyaenus","q":"Q537755","place":"Macedonia","occ":["writer","lawyer","poet","historian","orator"],"nworks":2},"tlg0543":{"name":"Polybius","grc":"Πολύβιος","birth":-200,"death":-118,"floruit":null,"year":-159,"era":"hellenistic","desc":"ancient Greek historian","wiki":"https://en.wikipedia.org/wiki/Polybius","q":"Q131169","place":"Megalopolis","occ":["writer","military personnel","historian"],"nworks":1,"core":{"summary":"Polybius of Megalopolis (Πολύβιος, Polybios, c. 200–c. 118 BCE) was the son of a leading statesman of the Achaean League and himself a politician and cavalry commander of the League. After Rome's victory at Pydna in 168 BCE he was taken to Rome as one of a thousand Achaean detainees, held in Italy without trial for some seventeen years. There he became the friend and mentor of the young Scipio Aemilianus, and he was later present at the destruction of Carthage in 146.\n\nHis Histories, in forty books, set out to explain how the Romans came to rule almost the whole known world \"in not quite fifty-three years\" (220–167 BCE). Polybius calls his method πραγματικὴ ἱστορία (pragmatikē historia, \"political and practical history\"). He insists that history must be useful to statesmen and built on eyewitnesses, documents and first-hand knowledge of places and warfare, and he criticizes earlier historians sharply. Only Books 1–5 survive complete; the rest come in excerpts. His analysis in Book 6 of the Roman constitution as a mixture of monarchy, aristocracy and democracy influenced Montesquieu and the founders of the American republic.\n\nHe writes the educated Koine of the Hellenistic age, not classical Attic: a prose rich in abstract nouns and the language of government and war, careful to avoid hiatus but indifferent to ornament. One word to watch is τύχη (tychē, \"fortune\"), the force he sees at work behind Rome's rise.","timeline":[[-200,"Born at Megalopolis in Arcadia"],[-182,"Carries the ashes of the Achaean general Philopoemen at his funeral"],[-170,"Hipparch (cavalry commander) of the Achaean League"],[-167,"Deported to Rome after Pydna; befriends Scipio Aemilianus"],[-150,"Released with the surviving detainees; travels with Scipio"],[-146,"Present at the destruction of Carthage; after the Achaean War helps settle the affairs of Greece"],[-118,"Dies at eighty-two, reportedly after a fall from a horse"],[950,"Constantine Porphyrogenitus' excerptors preserve much of the lost books"],[1530,"Editio princeps of Books 1–5 (Hagenau)"]],"manuscripts":"Books 1–5 survive complete in Vaticanus gr. 124 (A, tenth or eleventh century) and the manuscripts copied from it. Books 6–18 are known partly from a Byzantine selection of excerpts (the 'Excerpta Antiqua') in Urbinas gr. 102 (F, eleventh century). The rest comes from the collections of excerpts made in the tenth century for the emperor Constantine VII Porphyrogenitus, arranged by theme (on embassies, on virtues and vices, on sayings, on plots), and from quotations in Athenaeus, Strabo and others.","variants":"Because so much of the text survives only in excerpts, the order and placement of the fragments of Books 6–40 are editors' reconstructions, and book numbers for fragments differ between editions. The reconstruction of Book 6 is particularly contested.","editions":["T. Büttner-Wobst, Polybii Historiae, 5 vols (Teubner, 1889–1905) — the Greek text used here","E. S. Shuckburgh, The Histories of Polybius, 2 vols (London, 1889) — the translation used here","W. R. Paton, rev. F. W. Walbank and C. Habicht, Polybius, 6 vols (Loeb Classical Library, 2010–12)","F. W. Walbank, A Historical Commentary on Polybius, 3 vols (Oxford, 1957–79)"]}},"tlg1622":{"name":"Polycarp","grc":null,"birth":70,"death":155,"floruit":null,"year":112,"era":"imperial","desc":"bishop of Smyrna and martyr (69–155)","wiki":"https://en.wikipedia.org/wiki/Polycarp","q":"Q192371","place":null,"occ":["bishop","writer","theologian"],"nworks":1},"tlg1626":{"name":"Polycrates Ephesius","grc":null,"birth":125,"death":196,"floruit":null,"year":160,"era":"imperial","desc":"2nd century bishop of Ephesus","wiki":"https://en.wikipedia.org/wiki/Polycrates_of_Ephesus","q":"Q943719","place":"Ephesus","occ":["bishop","priest"],"nworks":1},"tlg2034":{"name":"Porphyrius","grc":"Πορφύριος","birth":234,"death":305,"floruit":null,"year":267,"era":"imperial","desc":"3rd-century Greek Neoplatonist philosopher","wiki":"https://en.wikipedia.org/wiki/Porphyry_of_Tyre","q":"Q203445","place":"Tyre","occ":["writer","historian","philosopher","music theorist"],"nworks":8,"core":{"summary":"Porphyry (Πορφύριος, Porphyrios, 234–c. 305 CE) was born at Tyre in Phoenicia. His original name, Malchus, means \"king\" in his native Semitic language, and his teacher Longinus turned it into the Greek Porphyrios, \"the purple one\", after the royal colour. After studying with Longinus in Athens he joined Plotinus in Rome in 263. When he fell into a deep depression, Plotinus sent him to Sicily to recover. Around 301 he published Plotinus' treatises as the Enneads, with a Life of his teacher.\n\nPorphyry was a prolific scholar and philosopher: he wrote some sixty works on philosophy, religion, literature, grammar and science. His Isagoge (Εἰσαγωγή, \"Introduction\"), a short guide to the terms used in Aristotle's Categories, became the first book of the logic curriculum for more than a thousand years. Its opening question about the status of genera and species set off the medieval debate over universals. His fifteen books Against the Christians were condemned and burned by imperial order in 448 and survive only in fragments. Among the works in this collection are his Life of Pythagoras, On Abstinence from Animal Food, a Letter to his wife Marcella, a commentary on the Categories in question-and-answer form, and his Homeric Questions.\n\nHis Greek is clear, orderly and learned, the prose of a teacher who wanted to be understood. He is much easier to read than Plotinus, and his introductions and letters are a good way into the language of late Greek philosophy.","timeline":[[234,"Born at Tyre (234)"],[255,"Studies with Longinus at Athens"],[263,"Joins Plotinus' circle in Rome"],[268,"Goes to Sicily on Plotinus' advice to recover from depression"],[301,"Publishes Plotinus' Enneads with his Life of Plotinus (c. 301)"],[305,"Dies (c. 305)"],[448,"His Against the Christians is ordered to be burned"],[510,"Boethius translates the Isagoge into Latin (early 6th century)"]],"manuscripts":"The Isagoge was one of the most copied books of the Middle Ages and survives in a vast number of Greek manuscripts, as well as in Latin (Boethius), Syriac, Arabic and Armenian translations. The other works have much thinner traditions. The Homeric Questions have to be reconstructed from Byzantine collections and from scholia in the margins of Homer manuscripts. Against the Christians is known only from quotations and rebuttals by Christian writers.","variants":"Many of Porphyry's works survive only in fragments whose extent and wording are disputed, and the attribution of some quotations, especially of passages thought to come from Against the Christians, is uncertain. The reconstruction of the Homeric Questions from the scholia is particularly difficult, because Byzantine compilers reworded and combined what they excerpted.","editions":["A. Nauck, Porphyrii Philosophi Platonici Opuscula Tria (Teubner, 1860) — the text used here for the Life of Pythagoras, On Abstinence and the Letter to Marcella","A. Busse, Porphyrii Isagoge et in Aristotelis Categorias Commentarium (Commentaria in Aristotelem Graeca IV.1, Berlin, 1887) — the text used here for the Isagoge and the Categories commentary","H. Schrader, Porphyrii Quaestionum Homericarum ad Iliadem pertinentium reliquiae (Teubner, 1880–82) — the text used here for the Homeric Questions","A. Smith, Porphyrii Philosophi Fragmenta (Teubner, 1993)","J. Bouffartigue, M. Patillon and A.-P. Segonds, Porphyre: De l'abstinence (Budé, 1977–95)","J. Barnes, Porphyry: Introduction (Oxford, 2003), translation and commentary"]}},"tlg4036":{"name":"Proclus","grc":"Πρόκλος","birth":412,"death":485,"floruit":null,"year":448,"era":"lateantique","desc":"5th-century Greek Neoplatonist philosopher","wiki":"https://en.wikipedia.org/wiki/Proclus","q":"Q271809","place":"Constantinople","occ":["writer","mathematician","philosopher","mythographer"],"nworks":2,"core":{"summary":"Proclus (Πρόκλος, Proklos, 412–485 CE) was born in Constantinople to a family from Lycia. After studying rhetoric and philosophy at Alexandria he came to Athens around 430 and studied with Plutarch of Athens and Syrianus. He succeeded Syrianus as head of the Platonic school at Athens, with the title διάδοχος (diadochos, \"successor\"), and led it for almost fifty years. His pupil Marinus wrote his biography, which portrays him as a pagan saint: tireless in teaching, writing and prayer.\n\nProclus gave Neoplatonism its most systematic form. His Elements of Theology derives the whole structure of reality from the One in 211 propositions, set out like a geometry book, and his Platonic Theology is a vast summa of pagan theology. He wrote long commentaries on Plato's Timaeus, Republic, Parmenides, Alcibiades and Cratylus, and on the first book of Euclid, as well as hymns to the gods. His ideas reached the Middle Ages through the Christian writer known as Pseudo-Dionysius and through the Book of Causes, an Arabic adaptation of the Elements of Theology later translated into Latin. The commentary on the Republic in this collection is the only sustained ancient commentary on that dialogue.\n\nThe second work here, the Chrestomathy, is a summary of the lost poems of the Epic Cycle, preserved in manuscripts of Homer. It is transmitted under the name Proclus, but most scholars doubt that the philosopher wrote it and think it the work of an otherwise unknown grammarian, perhaps of the second century CE. Proclus' own Greek is technical and scholastic, with long sentences built around the triad of μονή, πρόοδος, ἐπιστροφή (monē, proodos, epistrophē: \"remaining, procession, reversion\"), the pattern by which everything flows from its cause and returns to it.","timeline":[[412,"Born at Constantinople (412)"],[430,"Comes to Athens to study with Plutarch and Syrianus (c. 430)"],[437,"Succeeds Syrianus as head of the Platonic school"],[485,"Dies at Athens"],[486,"Marinus writes the Life of Proclus"],[1180,"The Book of Causes, an Arabic adaptation of the Elements of Theology, is translated into Latin (12th century)"],[1268,"William of Moerbeke translates the Elements of Theology into Latin"]],"manuscripts":"The Commentary on the Republic survives in essence in a single damaged early manuscript, Laurentianus 80.9 in Florence, and parts of the text are lost or can be read only with difficulty. The Chrestomathy's summaries of the Epic Cycle survive in the prefaces of Homer manuscripts, above all the tenth-century Venetus A; the Byzantine scholar Photius summarised the rest of the work in his Library.","variants":"Because the Republic commentary depends so heavily on one damaged manuscript, editors have had to supply many readings, and later Byzantine copies help only a little. The authorship of the Chrestomathy is disputed, as is how faithfully its summaries reflect the lost epics, which may have been shortened or rearranged to fit around the Iliad and Odyssey.","editions":["W. Kroll, Procli Diadochi in Platonis Rem publicam commentarii, 2 vols (Teubner, 1899–1901) — the text of the Republic commentary used here","B. Clark, edition of the Chrestomathy from the Venetus A for the Homer Multitext project — the text of the Chrestomathy used here","E. R. Dodds, Proclus: The Elements of Theology (Oxford, 1933; 2nd ed. 1963)","H. D. Saffrey and L. G. Westerink, Proclus: Théologie platonicienne, 6 vols (Budé, 1968–97)","D. Baltzly, J. F. Finamore and G. Miles, Proclus: Commentary on Plato's Republic (Cambridge, 2018–), translation"]}},"tlg4029":{"name":"Procopius","grc":"Προκόπιος","birth":500,"death":null,"floruit":null,"year":532,"era":"lateantique","desc":"6th-century historian","wiki":"https://en.wikipedia.org/wiki/Procopius","q":"Q186153","place":"Caesarea Maritima","occ":["writer","lawyer","historian"],"nworks":2,"core":{"summary":"Procopius of Caesarea (Προκόπιος, Prokopios, c. 500–after 554 CE) was born in Caesarea in Palestine and trained as a lawyer. From 527 he served as legal adviser and secretary to Belisarius, Justinian's great general, and went with him on campaign against the Persians, the Vandals in North Africa (533–534) and the Goths in Italy (535–540). He was an eyewitness of much of what he describes. The date of his death is unknown.\n\nHis Wars (Ὑπὲρ τῶν πολέμων, Hyper tōn polemōn), in eight books, recount Justinian's campaigns in the East, Africa and Italy; the first seven books were published around 551 and the eighth a few years later. His Buildings praises the emperor's building programme across the empire. The Secret History (Ἀνέκδοτα, Anekdota, \"Unpublished things\"), written around 550 and not meant for circulation in his lifetime, attacks Justinian, the empress Theodora and Belisarius with astonishing venom. The contrast between the public and private works has made Procopius one of the most discussed writers of late antiquity. The Secret History was first printed in 1623 from Vatican manuscripts, and its authenticity, once doubted, is now generally accepted.\n\nProcopius wrote in classicising Greek modelled on Herodotus and Thucydides. He avoided the everyday Latin and Christian vocabulary of his time, often explaining such terms with a circumlocution as if they were foreign to his readers. His descriptions of the plague of 542 in Constantinople and of the Nika riots of 532 are among the most famous passages of Byzantine prose.","timeline":[[500,"Born at Caesarea in Palestine (c. 500)"],[527,"Becomes legal adviser and secretary to Belisarius"],[532,"Witnesses the Nika riots in Constantinople"],[533,"Accompanies Belisarius against the Vandals in North Africa (533–534)"],[536,"With Belisarius in the Gothic War in Italy (535–540)"],[542,"Describes the great plague at Constantinople"],[550,"Writes the Secret History (c. 550)"],[551,"Publishes Books 1–7 of the Wars (c. 551); Book 8 follows a few years later"],[1623,"Niccolò Alemanni, the Vatican librarian, first publishes the Secret History"]],"manuscripts":"The Wars survive in a number of medieval manuscripts in two main families, and the Buildings has its own tradition. The Secret History was little copied. It was known in Byzantium (the tenth-century Suda cites it), but survives in only a few late manuscripts, from which Alemanni made the first edition in 1623.","variants":"The dating of Procopius' works, especially the Buildings, is debated, and so is how his hostility in the Secret History should be reconciled with the praise of the Buildings. Some scholars once thought the Secret History a later forgery, but its language and knowledge are Procopius' own. The Buildings says almost nothing about Italy, which suggests it was left unfinished.","editions":["H. B. Dewing, Procopius, 7 vols (Loeb Classical Library, 1914–40) — the Greek text and translation of the Wars used here","M. Krascheninnikov, Procopii Caesariensis Anecdota (Yuryev, 1899) — the text of the Secret History used here","J. Haury, Procopii Caesariensis Opera Omnia, 4 vols (Teubner, 1905–13; revised by G. Wirth, 1962–64), the standard edition","A. Kaldellis, Prokopios: The Secret History with Related Texts (Indianapolis, 2010)"]}},"tlg1634":{"name":"Prodicus","grc":null,"birth":-460,"death":-380,"floruit":null,"year":-420,"era":"classical","desc":"Greek philosopher (c. 465 – c. 395 BC)","wiki":"https://en.wikipedia.org/wiki/Prodicus","q":"Q297402","place":"Ceos","occ":["diplomat","philosopher"],"nworks":1},"stoa0033a":{"name":"Pseudo-Aristotle","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"unknown authors of works transmitted under Aristotle's name, such as On the Cosmos","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg0071":{"name":"Pseudo-Arrianus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Periplus of the Erythraean Sea, an anonymous geographical guide to the Red Sea and Indian Ocean trade (1st century CE), once ascribed to Arrian","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0075":{"name":"Pseudo-Arrianus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"anonymous geographical description (periplus) of the Black Sea coast, once ascribed to Arrian and drawing on his Periplus","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1118":{"name":"Pseudo-Dioscorides","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"lapidary transmitted under the name of Dioscorides","wiki":null,"q":"Q15101278","place":null,"occ":[],"nworks":1},"tlg0530":{"name":"Pseudo-Galen","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"medical works transmitted under Galen's name but not by him","wiki":null,"q":"Q95721323","place":null,"occ":[],"nworks":6},"tlg0751":{"name":"Pseudo-Hippocrates","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"medical and other works transmitted under the name of Hippocrates but not by him","wiki":null,"q":"Q118734605","place":null,"occ":[],"nworks":2},"tlg0646":{"name":"Pseudo-Justinus Martyr","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Epistle to Diognetus, an early Christian apology (2nd or 3rd century) once transmitted with Justin's works","wiki":"https://en.wikipedia.org/wiki/Pseudo-Justin","q":"Q107174429","place":null,"occ":["author"],"nworks":1},"tlg0061":{"name":"Pseudo-Lucian","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"author of works anciently ascribed to Lucian","wiki":null,"q":"Q19558843","place":null,"occ":["satirist"],"nworks":8},"tlg0094":{"name":"Pseudo-Plutarch","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"unknown author of ancient texts ascribed to Plutarch","wiki":"https://en.wikipedia.org/wiki/Pseudo-Plutarch","q":"Q2657275","place":null,"occ":["writer"],"nworks":3},"tlg2233":{"name":"Pseudo-Polemon","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"physiognomic treatises transmitted under the name of Polemon of Laodicea","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg0068":{"name":"Pseudo-Scymnus","grc":null,"birth":-170,"death":null,"floruit":null,"year":-130,"era":"hellenistic","desc":"ancient Greek geographer","wiki":"https://en.wikipedia.org/wiki/Pseudo-Scymnus","q":"Q2877686","place":null,"occ":["geographer"],"nworks":1},"tlg0632":{"name":"Pythagoras","grc":null,"birth":-582,"death":-490,"floruit":null,"year":-536,"era":"archaic","desc":"Greek philosopher and mathematician (c. 570 – c. 495 BC)","wiki":"https://en.wikipedia.org/wiki/Pythagoras","q":"Q10261","place":"Samos","occ":["writer","politician","mathematician","philosopher","musicologist","music theorist"],"nworks":1},"tlg2046":{"name":"Quintus Smyrnaeus","grc":"Κόϊντος Σμυρναῖος","birth":null,"death":null,"floruit":300,"year":300,"era":"imperial","desc":"Greek epic poet of the 3rd or 4th century CE","wiki":"https://en.wikipedia.org/wiki/Quintus_Smyrnaeus","q":"Q352702","place":"Smyrna","occ":["poet"],"nworks":1,"core":{"summary":"Quintus of Smyrna (Κόϊντος Σμυρναῖος, Koïntos Smyrnaios, probably 3rd century CE) is known only from his poem. In one passage (Book 12) he claims that the Muses inspired him while he tended sheep near Smyrna, echoing Hesiod's meeting with the Muses. That is all he tells us. Most scholars date him to the third century, though some prefer the fourth.\n\nHis Posthomerica (Τὰ μεθ᾽ Ὅμηρον, Ta meth' Homēron, \"The Events after Homer\"), in fourteen books, fills the gap between the end of the Iliad and the beginning of the Odyssey. It tells the story of the Amazon Penthesilea and the Ethiopian Memnon, the death of Achilles, the contest for his armour and the suicide of Ajax, the arrival of Neoptolemus and Philoctetes, the wooden horse, the sack of Troy and the departure of the Greeks. It is our only complete Greek epic account of these events, which were told in the lost poems of the Epic Cycle.\n\nQuintus imitates Homer closely in language, formulas and similes, but his tone is more reflective and his gods more remote. He is sometimes called Quintus Calaber because the manuscript from which his poem became known was found by Cardinal Bessarion in a monastery near Otranto, in southern Italy, in the mid-fifteenth century.","timeline":[[300,"The Posthomerica written (probably 3rd century CE)"],[1455,"Cardinal Bessarion finds a manuscript of the poem near Otranto (between 1453 and 1462)"],[1504,"Aldine editio princeps, with Tryphiodorus and Colluthus (c. 1504–05)"]],"manuscripts":"All surviving manuscripts of the Posthomerica are of the fifteenth and sixteenth centuries and derive from the lost manuscript found by Bessarion at the monastery of San Nicola di Casole near Otranto.","variants":"Because all the manuscripts go back to one lost exemplar, the text has many gaps and corruptions. The date of the poem is debated, and so is how far Quintus drew directly on the lost Cyclic epics, rather than on later handbooks, tragedy and Latin poetry such as Virgil's.","editions":["A. S. Way, Quintus Smyrnaeus: The Fall of Troy (Loeb Classical Library, 1913) — the Greek text and translation used here","F. Vian, Quintus de Smyrne: La Suite d'Homère, 3 vols (Budé, 1963–69)","A. James, Quintus of Smyrna: The Trojan Epic (Baltimore, 2004), translation","N. Hopkinson, Quintus Smyrnaeus: Posthomerica (Loeb Classical Library, 2018)"]}},"tlg0564":{"name":"Rufus of Ephesus","grc":null,"birth":100,"death":200,"floruit":null,"year":150,"era":"imperial","desc":"late 1st and early 2nd century Greek physician","wiki":"https://en.wikipedia.org/wiki/Rufus_of_Ephesus","q":"Q1049225","place":"Ephesus","occ":["physician writer"],"nworks":1},"tlg0606":{"name":"Rufus Soph.","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"rhetorician","wiki":null,"q":"Q110812700","place":null,"occ":["rhetorician"],"nworks":1},"tlg2049":{"name":"Sallustius","grc":null,"birth":null,"death":null,"floruit":362,"year":362,"era":"lateantique","desc":"Neoplatonist philosopher, friend of the emperor Julian, author of On the Gods and the World (4th century)","wiki":"https://en.wikipedia.org/wiki/Sallustius_(Neoplatonist)","q":"Q782401","place":null,"occ":["writer","philosopher"],"nworks":1},"tlg5019":{"name":"Scholia in Dionysium Periegetam","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient commentary (scholia) on Dionysius of Byzantium and Dionysius Periegetes","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg5022":{"name":"Scholia in Euclidem","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine commentary (scholia) on Euclid","wiki":null,"q":null,"place":null,"occ":[],"nworks":6},"tlg5023":{"name":"Scholia in Euripidem","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine commentary (scholia) on Euripides, with the ancient Lives of the poet","wiki":null,"q":null,"place":null,"occ":[],"nworks":8},"tlg5026":{"name":"Scholia in Homerum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine marginal commentary (scholia) on the Iliad and Odyssey, preserving much Alexandrian scholarship","wiki":null,"q":"Q123915878","place":null,"occ":[],"nworks":2},"tlg5028":{"name":"Scholia in Isocratem","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient commentary (scholia) on Isocrates","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg5029":{"name":"Scholia in Lucianum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine commentary (scholia) on Lucian","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg5031":{"name":"Scholia in Nicandrum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine commentary (scholia) and glosses on Nicander","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg5034":{"name":"Scholia in Pindarum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine commentary (scholia) on Pindar's victory odes","wiki":null,"q":null,"place":null,"occ":[],"nworks":4},"tlg5037":{"name":"Scholia in Sophoclem","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient commentary (scholia) on Sophocles","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0065":{"name":"Scylax of Caryanda","grc":null,"birth":-600,"death":-500,"floruit":null,"year":-550,"era":"archaic","desc":"Greek explorer and writer of the late 6th and early 5th centuries BCE","wiki":"https://en.wikipedia.org/wiki/Scylax_of_Caryanda","q":"Q453311","place":"Caryanda","occ":["writer","historian","navigator","biographer","explorer"],"nworks":1},"tlg1664":{"name":"Seniores Alexandrini","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"sayings of unnamed Alexandrian elders (presbyters) quoted by Clement of Alexandria","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1665":{"name":"Seniores Apud Irenaeum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"sayings of the unnamed elders (presbyters) of Asia Minor quoted by Irenaeus","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1669":{"name":"Serapion Astrologus","grc":null,"birth":null,"death":null,"floruit":null,"year":0,"era":"imperial","desc":"astrologer known from fragments; his date is uncertain","wiki":null,"q":"Q104163113","place":null,"occ":["astrologer"],"nworks":1},"tlg2970":{"name":"Severus Philosophus","grc":null,"birth":100,"death":null,"floruit":null,"year":140,"era":"imperial","desc":"ancient middle Platonic philosopher","wiki":null,"q":"Q1314034","place":null,"occ":["philosopher"],"nworks":1},"tlg0544":{"name":"Sextus Empiricus","grc":"Σέξτος Ἐμπειρικός","birth":null,"death":null,"floruit":200,"year":200,"era":"imperial","desc":"Pyrrhonist sceptic philosopher and physician (late 2nd century CE)","wiki":"https://en.wikipedia.org/wiki/Sextus_Empiricus","q":"Q236594","place":null,"occ":["writer","physician","physician writer","philosopher"],"nworks":2,"core":{"summary":"Sextus Empiricus (Σέξτος Ἐμπειρικός, Sextos Empeirikos, fl. c. 200 CE) was a doctor and a Pyrrhonist sceptic. His surname means that he belonged to the Empiric school of medicine, which relied on experience rather than theory. Almost nothing else is known about him: his date is inferred from the authors he mentions and from later references, and even where he lived and taught is unknown.\n\nHis surviving works are the Outlines of Pyrrhonism (Πυρρώνειοι ὑποτυπώσεις, Pyrrhōneioi hypotypōseis), in three books, and the larger treatise known as Against the Professors (Πρὸς μαθηματικούς, Pros mathēmatikous). The latter contains six books attacking the liberal arts (grammar, rhetoric, geometry, arithmetic, astrology and music) and five against the dogmatic philosophers. Sextus sets out the sceptic's method: for every argument an equal and opposite argument can be found, so the sceptic suspends judgement (ἐποχή, epochē) and thereby reaches tranquillity (ἀταραξία, ataraxia). In doing so he records the arguments of many earlier philosophers whose works are lost, and he is our main source for ancient scepticism.\n\nHis Greek is plain and technical. When his Outlines were translated into Latin and printed in 1562, they had an extraordinary effect on modern philosophy, from Montaigne to Descartes and Hume.","timeline":[[200,"Active as a sceptic philosopher and Empiric physician (c. 200)"],[1350,"A medieval Latin translation of the Outlines circulates (14th century)"],[1562,"Henri Estienne's Latin translation of the Outlines printed at Paris"],[1621,"Editio princeps of the Greek text"]],"manuscripts":"The Greek manuscripts are all late, of the fourteenth to sixteenth centuries, and go back to a single lost archetype. A medieval Latin translation of the Outlines, made from a Greek manuscript older than any that survive, is an important independent witness.","variants":"With a narrow tradition the text contains many corruptions and has been repaired by conjecture. The numbering of Against the Professors is confusing: the five books against the dogmatists are often cited as books 7–11, continuing the six against the arts, though they may originally have been a separate work. Scholars debate how original Sextus was, and how far he simply compiled earlier sceptical handbooks.","editions":["H. Mutschmann and J. Mau, Sexti Empirici Opera, 3 vols (Teubner, 1912–54) — the Greek text used here","R. G. Bury, Sextus Empiricus, 4 vols (Loeb Classical Library, 1933–49) — the translation used here","J. Annas and J. Barnes, Sextus Empiricus: Outlines of Scepticism (Cambridge, 1994; 2nd ed. 2000)","R. Bett, translations with commentary of Against the Ethicists (1997), Against the Logicians (2005) and other books"]}},"tlg4013":{"name":"Simplicius","grc":"Σιμπλίκιος","birth":480,"death":560,"floruit":530,"year":530,"era":"lateantique","desc":"6th-century Greek pagan philosopher","wiki":"https://en.wikipedia.org/wiki/Simplicius_of_Cilicia","q":"Q351518","place":"Cilicia","occ":["astronomer","mathematician","philosopher"],"nworks":4,"core":{"summary":"Simplicius (Σιμπλίκιος, Simplikios, c. 480–c. 560 CE) came from Cilicia and studied with Ammonius at Alexandria and with Damascius, the last head of the Platonic school at Athens. When the emperor Justinian stopped pagans from teaching philosophy in 529, Simplicius, Damascius and five other philosophers went to the court of the Persian king Khosrow I. They returned in 532, when a peace treaty between Rome and Persia guaranteed their freedom to live by their beliefs. Where Simplicius then lived and wrote is unknown; one theory places him at Harran in Mesopotamia, but it is disputed.\n\nHis commentaries on Aristotle's Categories, Physics and On the Heavens, and on Epictetus' Handbook, are among the longest and most learned works of ancient philosophy. They are also a treasury of quotations. Simplicius copied out long passages of earlier philosophers because, he said, their books had become rare. Much of what we have of the Presocratics comes from him, including the longest surviving portions of Parmenides' poem and important fragments of Empedocles and Anaxagoras. The commentary on Aristotle's On the Soul transmitted under his name may be by his contemporary Priscian of Lydia.\n\nSimplicius wrote clear, careful scholarly Greek, and his commentaries show the last generation of pagan philosophers defending the harmony of Plato and Aristotle against Christian critics such as John Philoponus.","timeline":[[480,"Born in Cilicia (c. 480)"],[500,"Studies with Ammonius at Alexandria and Damascius at Athens"],[529,"Justinian bars pagans from teaching; the Athenian school closes"],[531,"Goes with Damascius and others to the court of Khosrow I of Persia (c. 531)"],[532,"Returns to the Roman empire under the terms of the 'Eternal Peace'"],[540,"Writes his commentaries on Aristotle (after 532)"],[560,"Dies (c. 560)"]],"manuscripts":"Each commentary survives in several medieval manuscripts. Because the commentaries quote earlier philosophers at length, their manuscripts are also the main witnesses for many Presocratic fragments, and editors of Parmenides or Empedocles must rely on Simplicius' text.","variants":"The authorship of the commentary on On the Soul is disputed; many scholars now assign it to Priscian of Lydia. The quotations of the Presocratics sometimes differ from other sources, and editors must decide whether Simplicius had a better text or has miscopied. His whereabouts after 532, and the idea of a surviving Platonic school at Harran, remain debated.","editions":["H. Diels, Simplicii in Aristotelis Physicorum libros commentaria (Commentaria in Aristotelem Graeca IX–X, 1882–95) — the text of the Physics commentary used here","J. L. Heiberg (De caelo, 1894), K. Kalbfleisch (Categories, 1907) and M. Hayduck (De anima, 1882), in Commentaria in Aristotelem Graeca — the other texts used here","I. Hadot, Simplicius: Commentaire sur le Manuel d'Épictète (Leiden, 1996)","The Ancient Commentators on Aristotle, ed. R. Sorabji (London, 1987–), English translations"]}},"tlg0636":{"name":"Socrates Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the philosopher Socrates, composed in the Roman period","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg2057":{"name":"Socrates Scholasticus","grc":null,"birth":380,"death":440,"floruit":null,"year":410,"era":"lateantique","desc":"5th century Greek Christian church historian","wiki":"https://en.wikipedia.org/wiki/Socrates_of_Constantinople","q":"Q336198","place":"Constantinople","occ":["writer","historian","theologian","church historian"],"nworks":1},"tlg0637":{"name":"Socraticorum Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to Socrates' followers, the Socratic philosophers, composed in the Roman period","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1681":{"name":"Solonis Epistulae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the Athenian lawgiver and poet Solon, later forgeries","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg0011":{"name":"Sophocles","grc":"Σοφοκλῆς","birth":-497,"death":-406,"floruit":null,"year":-450,"era":"classical","desc":"ancient Greek playwright","wiki":"https://en.wikipedia.org/wiki/Sophocles","q":"Q7235","place":"Colonus","occ":["writer","priest","politician","playwright","tragedy writer"],"nworks":8,"core":{"summary":"Sophocles (Σοφοκλῆς, Sophoklēs, c. 497–406 BCE) spent his long life in Athens, where he was a public figure as well as a dramatist: he served as a treasurer of the Athenian empire and as a general alongside Pericles, and after his death he was honoured with a hero cult. He wrote more than 120 plays and was the most successful of the three great tragedians in competition, winning first prize eighteen or twenty-four times (the ancient sources differ) and, it was said, never coming last.\n\nSeven of his tragedies survive complete: Ajax, Antigone, Oedipus the King, Women of Trachis, Electra, Philoctetes and Oedipus at Colonus, which was staged after his death. Aristotle's Poetics treats Oedipus the King as the model of a tragic plot. Sophocles' heroes are proud, stubborn people who will not bend, and his plays show what that costs them. A large part of a satyr play, the Trackers, was recovered from a papyrus in the twentieth century.\n\nHis Greek is lucid on the surface and full of double meanings beneath, which suits a dramatist of irony. The famous ode in the Antigone begins πολλὰ τὰ δεινὰ κοὐδὲν ἀνθρώπου δεινότερον πέλει (polla ta deina kouden anthrōpou deinoteron pelei, 332–33), and δεινός (deinos) means both \"wonderful\" and \"terrible\": \"Many things are wondrous and dreadful, and none more so than man.\" As in all tragedy, the choral songs have a Doric colouring.","timeline":[[-497,"Born at Colonus near Athens"],[-480,"Said to have led the boys' chorus celebrating the victory at Salamis"],[-468,"First victory, defeating Aeschylus"],[-443,"Serves as one of the treasurers (Hellenotamiai) of the Athenian empire"],[-442,"Antigone (approximate date)"],[-441,"Serves as general with Pericles in the Samian War"],[-429,"Oedipus Tyrannus (approximate date)"],[-409,"Philoctetes wins first prize"],[-406,"Dies in Athens; Oedipus at Colonus produced posthumously by his grandson in 401"],[1502,"Aldine editio princeps"],[1912,"Grenfell and Hunt publish the papyrus of the Trackers"]],"manuscripts":"The same Florentine manuscript that preserves Aeschylus, Laurentianus 32.9 (L, tenth century), is the principal witness, with a palimpsest in Leiden (BPG 60A, around 950). Three plays, Ajax, Electra and Oedipus the King, formed the Byzantine school 'triad' and survive in nearly 200 manuscripts; the other four in far fewer. Parisinus gr. 2712 (A, thirteenth century) is an important independent witness. The Trackers survives only on a second-century CE papyrus from Oxyrhynchus, published in 1912.","variants":"Editors disagree about how independent L and A are, and about the value of Demetrius Triclinius' fourteenth-century edition. The date of the Antigone rests on a doubtful ancient story that its success won Sophocles his generalship. Some passages have long been suspected as interpolations, above all Antigone 904–920, where Antigone argues that she would not have done for a husband or a child what she did for her brother. Goethe hoped that passage would be proved spurious, but Aristotle already quotes it in the Rhetoric, and most modern editors keep it.","editions":["F. Storr, Sophocles, 2 vols (Loeb Classical Library, 1912–13) — the main Greek text used here, with A. C. Pearson's OCT (1924) and C. A. Lobeck's Ajax (1866) for that play","R. C. Jebb, Sophocles: The Plays and Fragments, 7 vols (Cambridge, 1883–96) — the translation used here; for the Trackers, A. Mahoney's translation made for Perseus","H. Lloyd-Jones and N. G. Wilson, Sophoclis Fabulae (OCT, 1990), with their Sophoclea (1990)","A. Dain and P. Mazon, Sophocle (Budé, 1955–60)","H. Lloyd-Jones, Sophocles, 3 vols (Loeb Classical Library, 1994–96)"]}},"tlg4030":{"name":"Sophonias","grc":null,"birth":1250,"death":1350,"floruit":null,"year":1300,"era":"byzantine","desc":"Byzantine philosopher (13th-14th century)","wiki":"https://en.wikipedia.org/wiki/Sophonias_(commentator)","q":"Q7563126","place":null,"occ":["monk","philosopher"],"nworks":1},"tlg0565":{"name":"Soranus","grc":null,"birth":98,"death":200,"floruit":138,"year":138,"era":"imperial","desc":"1st/2nd century AD Greek physician","wiki":"https://en.wikipedia.org/wiki/Soranus_of_Ephesus","q":"Q446595","place":"Ephesus","occ":["writer","physician","gynecologist"],"nworks":4},"tlg2048":{"name":"Sozomenus","grc":null,"birth":400,"death":450,"floruit":null,"year":425,"era":"lateantique","desc":"church historian at Constantinople (5th century)","wiki":"https://en.wikipedia.org/wiki/Sozomen","q":"Q354350","place":"Bethelia (near Gaza)","occ":["writer","lawyer","jurist","historian","rhetorician","church historian"],"nworks":1},"tlg1692":{"name":"Speusippus","grc":null,"birth":-407,"death":-339,"floruit":null,"year":-373,"era":"classical","desc":"4th-century BC Greek philosopher","wiki":"https://en.wikipedia.org/wiki/Speusippus","q":"Q325955","place":"Athens","occ":["mathematician","philosopher"],"nworks":1},"tlg0077":{"name":"Stadiasmus Magni Maris","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Stadiasmus of the Great Sea, an anonymous geographical sailing guide to the Mediterranean coast, with distances in stades (later 3rd century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg9019":{"name":"Stephanus of Alexandria","grc":null,"birth":600,"death":622,"floruit":null,"year":611,"era":"lateantique","desc":"philosopher and astronomer from Alexandria, public teacher at Constantinople under Heraclius (early 7th century)","wiki":"https://en.wikipedia.org/wiki/Stephanus_of_Alexandria","q":"Q330289","place":"Alexandria","occ":["astronomer","physician","mathematician","philosopher","alchemist"],"nworks":1},"tlg0099":{"name":"Strabo","grc":"Στράβων","birth":-64,"death":24,"floruit":null,"year":-20,"era":"imperial","desc":"Greek geographer, philosopher and historian (64/63 BC–c.24 AD)","wiki":"https://en.wikipedia.org/wiki/Strabo","q":"Q45936","place":"Amasia","occ":["writer","historian","geographer","philosopher"],"nworks":2,"core":{"summary":"Strabo (Στράβων, Strabōn, 64/63 BCE–c. 24 CE) came from Amaseia in Pontus, in northern Asia Minor, from a family that had served the kings of Pontus. He studied with the grammarian Tyrannion and the Aristotelian Xenarchus, leaned towards Stoic philosophy, and spent long periods in Rome. In 25–24 BCE he travelled up the Nile to the border of Ethiopia with his friend Aelius Gallus, the prefect of Egypt. His Historical Sketches, a continuation of Polybius in forty-seven books, are lost.\n\nHis Geography (Γεωγραφικά, Geōgraphika), in seventeen books, is the only large work of ancient geography to survive nearly complete. Books 1–2 set out his principles and criticise earlier geographers, especially Eratosthenes. Books 3–10 describe Europe from Iberia to Greece, Books 11–16 Asia, and Book 17 Egypt and Libya. Strabo wrote for statesmen, not specialists. He mixes physical description with history, myth, local customs and the famous men of each city, and he treats Homer as the founder of geography, defending the accuracy of his descriptions. The work was barely read in antiquity and was first widely used by Byzantine scholars. It was completed late in his life, after 18 CE.\n\nHis Greek is the plain, educated prose of the Augustan age, easy to follow but not elegant. The long quotations from earlier writers make the Geography a treasure-house of lost works.","timeline":[[-64,"Born at Amaseia in Pontus (64/63 BCE)"],[-44,"First stay in Rome"],[-29,"In Rome again"],[-25,"Travels up the Nile with Aelius Gallus, prefect of Egypt (25–24 BCE)"],[18,"Revises the Geography, which mentions events of 18–23 CE"],[24,"Dies (c. 24 CE)"],[1469,"Latin translation by Guarino of Verona and Gregorio Tifernate printed at Rome"],[1516,"Aldine editio princeps, printed from a poor manuscript"],[2002,"Stefan Radt's ten-volume edition with German translation and commentary begins (2002–11)"]],"manuscripts":"The oldest evidence is a fifth-century palimpsest in the Vatican (Vat. gr. 2306 with 2061A), fragmentary but independent of the medieval tradition. For the first nine books the chief witness is a tenth-century Paris manuscript (Parisinus gr. 1397, A). For the last eight we depend on later manuscripts of the thirteenth and fourteenth centuries. A Byzantine epitome and the excerpts known as the Chrestomathy, included in this collection, sometimes preserve readings lost elsewhere.","variants":"The text has gaps, especially at the end of Book 7, which survives only in fragments preserved in the epitome and the Chrestomathy. The Aldine edition was printed from a poor manuscript, and its errors persisted in later editions until the manuscripts were collated afresh. Place names and numbers are often corrupt. Scholars also debate when and where Strabo wrote the work, at Rome or at home in Amaseia, and how far he revised it.","editions":["A. Meineke, Strabonis Geographica, 3 vols (Teubner, 1877) — the Greek text used here","H. L. Jones, The Geography of Strabo, 8 vols (Loeb Classical Library, 1917–32), and H. C. Hamilton and W. Falconer's translation (Bohn, 1854–57) — the translations used here","C. Müller, Geographi Graeci Minores, 2 vols (Paris, 1855–61) — the text of the Chrestomathy used here","S. Radt, Strabons Geographika, 10 vols (Göttingen, 2002–11), the standard edition","G. Aujac, F. Lasserre and others, Strabon: Géographie (Budé, 1966–)"]}},"tlg9010":{"name":"Suda","grc":null,"birth":976,"death":1028,"floruit":null,"year":1002,"era":"byzantine","desc":"10th-century Byzantine encyclopaedic lexicon","wiki":"https://en.wikipedia.org/wiki/Suda","q":"Q216299","place":null,"occ":["writer","historian","lexicographer"],"nworks":1},"tlg3118":{"name":"Syntipas","grc":null,"birth":null,"death":null,"floruit":1090,"year":1090,"era":"byzantine","desc":"frame-tale romance, the Book of Syntipas the Philosopher, translated from Syriac into Greek by Michael Andreopoulos (late 11th century)","wiki":null,"q":"Q127250656","place":null,"occ":["translator"],"nworks":2},"tlg4017":{"name":"Syrianus","grc":null,"birth":null,"death":437,"floruit":430,"year":430,"era":"lateantique","desc":"5th-century Greek Neoplatonist philosopher","wiki":"https://en.wikipedia.org/wiki/Syrianus","q":"Q1373037","place":"Alexandria","occ":["philosopher"],"nworks":1},"tlg1766":{"name":"Tatianus","grc":null,"birth":120,"death":173,"floruit":null,"year":146,"era":"imperial","desc":"2nd century Assyrian Christian writer and theologian","wiki":"https://en.wikipedia.org/wiki/Tatian","q":"Q272087","place":"Assyria","occ":["writer","theologian","philosopher"],"nworks":1},"tlg1699":{"name":"Teles Megarenesis","grc":null,"birth":-250,"death":null,"floruit":-240,"year":-240,"era":"hellenistic","desc":"ancient Greek Cynic philosopher","wiki":"https://en.wikipedia.org/wiki/Teles_of_Megara","q":"Q2367894","place":"Megara","occ":["philosopher"],"nworks":8},"tlg1701":{"name":"Testamentum Abrahae","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Testament of Abraham, a Jewish apocryphal expansion of the biblical story of Abraham's death (1st–2nd century CE)","wiki":null,"q":null,"place":null,"occ":[],"nworks":2},"tlg1705":{"name":"Thales","grc":null,"birth":-625,"death":-546,"floruit":null,"year":-585,"era":"archaic","desc":"Milesian philosopher and mathematician (6th century BCE); the letters under his name are later forgeries","wiki":"https://en.wikipedia.org/wiki/Thales_of_Miletus","q":"Q36303","place":"Miletus","occ":["philosopher"],"nworks":1},"tlg2001":{"name":"Themistius","grc":null,"birth":317,"death":388,"floruit":null,"year":352,"era":"lateantique","desc":"Roman statesman, rhetorician and philosopher (317–c.388)","wiki":"https://en.wikipedia.org/wiki/Themistius","q":"Q365183","place":"Paphlagonia","occ":["writer","politician","philosopher","orator"],"nworks":7},"tlg0055":{"name":"Themistocles","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"letters ascribed to the Athenian statesman Themistocles, an epistolary novel of the Roman period","wiki":null,"q":"Q116960081","place":null,"occ":[],"nworks":1},"tlg0005":{"name":"Theocritus","grc":"Θεόκριτος","birth":null,"death":null,"floruit":-275,"year":-275,"era":"hellenistic","desc":"3rd-century BCE Greek poet","wiki":"https://en.wikipedia.org/wiki/Theocritus","q":"Q219484","place":"Syracuse","occ":["writer","poet"],"nworks":3,"core":{"summary":"Theocritus (Θεόκριτος, Theokritos, active in the early third century BCE) came from Syracuse in Sicily and worked on the island of Cos and at the court of Ptolemy II in Alexandria. He is the inventor of pastoral poetry. His Idylls (the name, from εἰδύλλιον, eidyllion, \"short piece\", was given later) are hexameter poems in which herdsmen compete in song, lovers pine, and the countryside of Sicily and Cos is lovingly evoked.\n\nThe collection is wider than pastoral. It includes mimes of city life, such as the Syracusan Women (Idyll 15), where two housewives push through the crowds of Alexandria to a festival of Adonis; short epics about heroes; and poems in praise of Hieron II of Syracuse and Ptolemy II. Virgil's Eclogues answer Theocritus directly, and through Virgil he became the founder of the whole European pastoral tradition.\n\nMost of the Idylls are written in a literary Doric, though a few use Aeolic or epic Ionic. The first line of Idyll 1 shows the flavour: Ἁδύ τι τὸ ψιθύρισμα καὶ ἁ πίτυς, αἰπόλε, τήνα (Hady ti to psithyrisma kai ha pitys, aipole, tēna, \"Sweet is the whispering of that pine, goatherd\"), with ἁδύ and ἁ where Attic has ἡδύ and ἡ, and τήνα for ἐκείνη, \"that\".","timeline":[[-300,"Born at Syracuse (approximate)"],[-275,"Idyll 16 addressed to Hieron II of Syracuse (c. 275)"],[-272,"Idyll 17 in praise of Ptolemy II Philadelphus (c. 273–270); active in Alexandria"],[-260,"His latest datable poems belong to the 270s; nothing is known of his death"],[-50,"Artemidorus of Tarsus gathers the bucolic poets into one collection"],[1481,"Editio princeps of Idylls 1–18 (Milan, c. 1480); Aldine 1495"]],"manuscripts":"The Idylls survive together with the other bucolic poets, Moschus and Bion, in three families of manuscripts: the Ambrosian (Ambrosianus C 222 inf., K, thirteenth century), the Vatican (Vaticanus gr. 915 and related manuscripts) and the Laurentian (Laurentianus 32.16 and 32.37). Papyri, notably the Antinoë papyrus (fifth century CE) with its ancient commentary, confirm the ancient text. Scribes often normalized Theocritus' Doric forms.","variants":"Most editors regard Idylls 8, 9, 19, 20, 21, 23, 25 and 27 as not by Theocritus, while the poem for Ptolemy (Idyll 17) and the Syracusan Women (15) are securely his. The Syrinx, a pattern poem laid out in the shape of a panpipe, is also of doubtful authorship. Editions differ markedly in how much Doric colouring they restore.","editions":["R. J. Cholmeley, The Idylls of Theocritus (London, 1901; 2nd ed. 1919) — the text of the Idylls and Epigrams used here","A. S. F. Gow, Bucolici Graeci (OCT, 1952) — the text of the Syrinx used here","A. S. F. Gow, Theocritus, 2 vols (Cambridge, 1950; 2nd ed. 1952), with commentary","C. Gallavotti, Theocritus quique feruntur Bucolici Graeci (Rome, 3rd ed. 1993)","N. Hopkinson, Theocritus, Moschus, Bion (Loeb Classical Library, 2015)","R. Hunter, Theocritus: A Selection (Cambridge, 1999), with commentary"]}},"tlg4089":{"name":"Theodoret, Bishop of Cyrus","grc":null,"birth":393,"death":466,"floruit":null,"year":429,"era":"lateantique","desc":"5th century Byzantine theologian and bishop","wiki":"https://en.wikipedia.org/wiki/Theodoret","q":"Q317029","place":"Antioch","occ":["bishop","writer","historian","presbyter","church historian"],"nworks":2},"tlg1719":{"name":"Theodosius of Bithynia","grc":null,"birth":-160,"death":-90,"floruit":null,"year":-125,"era":"hellenistic","desc":"ancient Greek astronomer","wiki":"https://en.wikipedia.org/wiki/Theodosius_of_Bithynia","q":"Q1266186","place":"Bithynia","occ":["astronomer","mathematician"],"nworks":1},"tlg1724":{"name":"Theon Smyrnaeus","grc":null,"birth":70,"death":135,"floruit":null,"year":102,"era":"imperial","desc":"2nd century Greek mathematician and philosopher","wiki":"https://en.wikipedia.org/wiki/Theon_of_Smyrna","q":"Q705950","place":"Smyrna","occ":["astronomer","mathematician","philosopher","musicologist","music theorist"],"nworks":1},"tlg1725":{"name":"Theophilus","grc":null,"birth":null,"death":183,"floruit":180,"year":180,"era":"imperial","desc":"bishop of Antioch (c. 169–c. 183) and Christian apologist, author of To Autolycus","wiki":"https://en.wikipedia.org/wiki/Theophilus_of_Antioch","q":"Q220787","place":null,"occ":["bishop","presbyter"],"nworks":1},"tlg0093":{"name":"Theophrastus","grc":"Θεόφραστος","birth":-371,"death":-287,"floruit":null,"year":-310,"era":"hellenistic","desc":"Greek philosopher and botanist, Aristotle's successor","wiki":"https://en.wikipedia.org/wiki/Theophrastus","q":"Q160362","place":"Eresus","occ":["writer","botanist","philosopher"],"nworks":18,"core":{"summary":"Theophrastus of Eresus on Lesbos (Θεόφραστος, Theophrastos, c. 371–287 BCE) was Aristotle's closest colleague and his successor as head of the Lyceum, which he led for some thirty-five years, reportedly with about two thousand students. Diogenes Laertius says his real name was Tyrtamus, and that Aristotle renamed him Theophrastus, roughly \"divine speaker\", for the grace of his speech.\n\nLike Aristotle he wrote on almost everything, but two achievements have lasted. His Enquiry into Plants and On the Causes of Plants describe and classify some five hundred plants, from Greece to India (drawing on reports from Alexander's campaigns), and founded botany as a science; Book 9 of the Enquiry, on medicinal plants and their uses, is an important early text of ancient pharmacology. His Characters, thirty sharp sketches of social types (the Flatterer, the Chatterbox, the Penny-pincher), were imitated from La Bruyère onward and have influenced European literature ever since. His short work On the Senses is also one of our main sources for what the Presocratic philosophers thought about perception.\n\nEach of the Characters opens with a definition and then a portrait built on one formula: \"the Flatterer is the sort of man who …\", τοιοῦτός τις, οἷος … (toioutos tis, hoios …), followed by a run of infinitives describing what he does. The sketches are full of the everyday vocabulary of fourth-century Athens, the market, the assembly and the dinner party, and they are excellent reading practice.","timeline":[[-371,"Born at Eresus on Lesbos"],[-347,"With Aristotle at Assos and Lesbos"],[-322,"Succeeds Aristotle as head of the Lyceum"],[-319,"Characters (probable date)"],[-307,"Briefly leaves Athens when a law restricts the philosophical schools; returns the next year when it is repealed"],[-287,"Dies; bequeaths Aristotle's library to Neleus of Scepsis"],[1483,"Theodore Gaza's Latin translation of the botanical works printed at Treviso"],[1497,"Editio princeps (Aldus, in the Aristotle volumes)"]],"manuscripts":"The Enquiry into Plants rests chiefly on Urbinas gr. 61 in the Vatican (U, tenth or eleventh century) and a fifteenth-century Paris manuscript (Parisinus gr. 2069, P). Theodore Gaza's Latin translation, printed in 1483, was made from a manuscript now lost and sometimes preserves better readings. The Characters have a separate and complicated history: Byzantine excerptors split the sketches into two groups (1–15 and 16–30) that were copied separately.","variants":"The order of the books of the Enquiry is disputed, and Book 9, on medicinal plants, may include later material. Many plant names are corrupt in the manuscripts, and some identifications remain uncertain. In Byzantine times the Characters were padded with moralizing introductions and conclusions, and given a spurious dedicatory preface, which editors now remove. The short weather-lore treatise On Weather Signs is probably by a later member of the school.","editions":["F. Wimmer, Theophrasti Eresii Opera (Teubner/Didot, 1854–66) — the text used here for most works","A. Hort, Theophrastus: Enquiry into Plants, with the minor works On Odours and Weather Signs, 2 vols (Loeb Classical Library, 1916) — the text used here for those works","H. Diels, Theophrasti Characteres (OCT, 1909) — the text of the Characters used here","S. Amigues, Théophraste: Recherches sur les plantes, 5 vols (Budé, 1988–2006), with commentary","J. Diggle, Theophrastus: Characters (Cambridge, 2004), with commentary","W. W. Fortenbaugh et al., Theophrastus of Eresus: Sources for his Life, Writings, Thought and Influence, 2 vols (Leiden, 1992)"]}},"tlg3129":{"name":"Theophylactus","grc":null,"birth":1055,"death":1126,"floruit":null,"year":1090,"era":"byzantine","desc":"Byzantine archbishop and saint","wiki":"https://en.wikipedia.org/wiki/Theophylact_of_Ohrid","q":"Q1247278","place":"Chalcis","occ":["writer","archbishop"],"nworks":1},"tlg0003":{"name":"Thucydides","grc":"Θουκυδίδης","birth":-460,"death":-400,"floruit":null,"year":-427,"era":"classical","desc":"5th-century BCE Athenian historian and general","wiki":"https://en.wikipedia.org/wiki/Thucydides","q":"Q41683","place":"Halimous","occ":["writer","historian"],"nworks":1,"core":{"summary":"Thucydides (Θουκυδίδης, Thoukydidēs, c. 460–c. 400 BCE) was an Athenian who lived through the Peloponnesian War between Athens and Sparta (431–404 BCE). He set out to record it from the very beginning, convinced it would be the greatest war yet. He caught the plague that struck Athens in 430 and survived it. In 424, as a general, he failed to save the city of Amphipolis and was exiled for twenty years, which gave him time, and access to both sides.\n\nHis history is analytical and austere. He looks for the real causes behind events, naming Sparta's fear of Athens' growing power as \"the truest cause\" (ἀληθεστάτη πρόφασις, alēthestatē prophasis, 1.23) of the war. He gives his speakers set-piece speeches that lay bare the arguments of each moment, among them Pericles' Funeral Oration and the Melian Dialogue, and he meant the whole to be \"a possession for all time\" (κτῆμα ἐς αἰεί, ktēma es aiei, 1.22). The narrative breaks off in 411 BCE; Xenophon's Hellenica and other historians picked up the story.\n\nHis Greek is famously compressed and difficult, full of abstract nouns, neuter participles used as nouns, and sentences that pack antithesis into antithesis. It is also an older Attic than Plato's: he writes ξύν (xyn) for σύν (\"with\") and -σσ- where later Attic has -ττ-, as in the first sentence of the work, Θουκυδίδης Ἀθηναῖος ξυνέγραψε τὸν πόλεμον (\"Thucydides the Athenian wrote up the war\").","timeline":[[-460,"Born in Athens, of a family with Thracian connections"],[-431,"Outbreak of the Peloponnesian War; begins his record"],[-430,"Catches and survives the plague at Athens"],[-424,"As general fails to save Amphipolis; exiled for twenty years"],[-411,"The narrative breaks off abruptly at 8.109, in the summer of 411"],[-404,"End of the Peloponnesian War; Thucydides probably returns to Athens"],[-400,"Dies, the work unfinished"],[1452,"Lorenzo Valla completes his Latin translation for Pope Nicholas V"],[1502,"Aldine editio princeps"],[1629,"Thomas Hobbes publishes the first English translation made directly from the Greek"]],"manuscripts":"Seven primary manuscripts of the tenth to fourteenth centuries survive: Laurentianus 69.2 in Florence (C, tenth century), Vaticanus gr. 126 (B, eleventh century), Parisinus gr. 1734 (A), Palatinus gr. 252 in Heidelberg (E), two Munich manuscripts (Monacensis gr. 430, F, and gr. 228, G, the latter much later) and British Library Add. 11727 (M). They fall into two families, ABEFM and CG, though in the last books B follows an independent source of its own. Papyri, notably P.Oxy. 16 and 17, show a text very close to the medieval one.","variants":"The division into eight books was made by later editors, not by Thucydides; ancient readers also knew divisions into nine and thirteen books. Book 8, and parts of Book 5, have no speeches in direct form and seem unrevised. The grim chapter on civil war at Corcyra, 3.84, is rejected by most editors, as it already was by ancient commentators. The speeches, with their strained syntax, still contain sentences whose exact wording is uncertain despite centuries of emendation.","editions":["H. S. Jones and J. E. Powell, Thucydidis Historiae, 2 vols (OCT, rev. 1942) — the Greek text used here","C. F. Smith, Thucydides, 4 vols (Loeb Classical Library, 1919–23), with the translations of Richard Crawley (1874), Henry Dale (1851–52) and Thomas Hobbes (1629) — the English translations used here, alongside French, German, Italian and Latin versions","G. B. Alberti, Thucydidis Historiae, 3 vols (Rome, 1972–2000), the fullest apparatus","S. Hornblower, A Commentary on Thucydides, 3 vols (Oxford, 1991–2008)"]}},"tlg2601":{"name":"Tiberius Rhetor","grc":null,"birth":null,"death":null,"floruit":350,"year":350,"era":"lateantique","desc":"rhetorician (3rd-4th century AD)","wiki":null,"q":"Q11951801","place":null,"occ":["rhetorician"],"nworks":1},"tlg0647":{"name":"Tryphiodorus","grc":null,"birth":null,"death":null,"floruit":275,"year":275,"era":"imperial","desc":"Greek epic poet from Panopolis in Egypt, author of The Sack of Troy (3rd or early 4th century CE)","wiki":"https://en.wikipedia.org/wiki/Tryphiodorus","q":"Q1371938","place":"Egypt","occ":["poet"],"nworks":1},"tlg0609":{"name":"Tryphon I Grammaticus","grc":null,"birth":null,"death":null,"floruit":-50,"year":-50,"era":"hellenistic","desc":"ancient Greek grammarian","wiki":"https://en.wikipedia.org/wiki/Tryphon_(grammarian)","q":"Q1294734","place":"Alexandria","occ":["grammarian"],"nworks":1},"tlg1763":{"name":"Tryphon II Grammaticus","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient Greek grammarian","wiki":null,"q":"Q106226507","place":null,"occ":["grammarian"],"nworks":1},"tlg2027":{"name":"Valerius Apsines","grc":null,"birth":190,"death":250,"floruit":235,"year":235,"era":"imperial","desc":"Greek rhetorician","wiki":"https://en.wikipedia.org/wiki/Apsines","q":"Q649082","place":"Gadara","occ":["politician","orator"],"nworks":2},"tlg1802":{"name":"Versus heroici","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"epic verses ascribed to Homer by ancient writers but not found in the Iliad, Odyssey, Hymns or Epic Cycle","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1764":{"name":"Vettius Valens","grc":null,"birth":120,"death":175,"floruit":null,"year":147,"era":"imperial","desc":"2nd-century Greek astrologer","wiki":"https://en.wikipedia.org/wiki/Vettius_Valens","q":"Q1051470","place":"Antioch","occ":["astronomer","writer","astrologer"],"nworks":1},"tlg1765":{"name":"Vitae Aesopi","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Aesop Romance: the anonymous comic Life of Aesop (1st–2nd century CE) and its later versions","wiki":null,"q":null,"place":null,"occ":[],"nworks":3},"tlg1749":{"name":"Vitae Hesiodi Particula","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"biographical notices on Hesiod","wiki":null,"q":null,"place":null,"occ":[],"nworks":1},"tlg1805":{"name":"Vitae Homeri","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient biographical Lives of Homer, including those ascribed to Herodotus and Plutarch","wiki":null,"q":null,"place":null,"occ":[],"nworks":10},"tlg4170":{"name":"Vitae Pindari et varia de Pindaro","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"ancient and Byzantine biographical Lives of Pindar and related notices","wiki":null,"q":null,"place":null,"occ":[],"nworks":4},"tlg1750":{"name":"Vitae Prophetarum","grc":null,"birth":null,"death":null,"floruit":null,"year":null,"era":null,"desc":"Lives of the Prophets, a collection of legends about the biblical prophets","wiki":"https://en.wikipedia.org/wiki/Pseudo-Dorotheus","q":"Q7254404","place":null,"occ":["writer"],"nworks":4},"tlg0634":{"name":"Xenocrates of Chalcedon","grc":null,"birth":-396,"death":-314,"floruit":null,"year":-355,"era":"classical","desc":"4th-century BC Greek philosopher, mathematician and scholarch","wiki":"https://en.wikipedia.org/wiki/Xenocrates","q":"Q214121","place":"Chalcedon","occ":["writer","teacher","mathematician","philosopher"],"nworks":1},"tlg0032":{"name":"Xenophon","grc":"Ξενοφῶν","birth":-430,"death":-354,"floruit":null,"year":-391,"era":"classical","desc":"Greek historian, philosopher and soldier","wiki":"https://en.wikipedia.org/wiki/Xenophon","q":"Q129772","place":"Erchia","occ":["writer","military personnel","mercenary","historian","philosopher"],"nworks":14,"core":{"summary":"Xenophon of Athens (Ξενοφῶν, Xenophōn, c. 430–after 355 BCE) was a soldier, landowner and writer, and a devoted follower of Socrates. In 401 BCE he joined the Greek mercenaries hired by the Persian prince Cyrus the Younger to seize his brother's throne. When Cyrus was killed at Cunaxa and the Greek generals were then murdered, Xenophon helped lead the Ten Thousand on an epic retreat through the mountains to the Black Sea, the story he tells in the Anabasis; its most famous moment is the soldiers' shout of θάλαττα θάλαττα (thalatta thalatta, \"the sea! the sea!\", 4.7.24) when they finally see it. Exiled from Athens, he lived for years on an estate near Olympia given to him by the Spartans.\n\nHe wrote in many forms: history (the Hellenica, which continues Thucydides, opening simply \"After this …\"), memoir (the Anabasis), Socratic works (the Memorabilia, Symposium, Oeconomicus and his own Apology), an idealized life of the Persian king Cyrus the Great (the Cyropaedia), and treatises on horsemanship, hunting, finance and running an estate.\n\nAncient critics admired the sweetness of his style; Diogenes Laertius says he was called \"the Attic Muse\". His Attic is clear and plain, though it admits poetic and non-Attic words that later purists frowned on, a hint of the Koine to come. That clarity made the Anabasis the first real Greek text for generations of students.","timeline":[[-430,"Born at Athens"],[-401,"Joins Cyrus the Younger's expedition; leads the Ten Thousand home after Cunaxa"],[-399,"Socrates is tried and executed while Xenophon is in Asia"],[-396,"Serves with the Spartan king Agesilaus in Asia Minor"],[-394,"Fights with Sparta at Coronea; exiled from Athens, perhaps by now or earlier"],[-390,"Settles on an estate at Scillus near Olympia"],[-371,"Spartan defeat at Leuctra forces him to leave Scillus"],[-362,"His son Gryllus dies fighting for Athens at Mantinea; the Hellenica ends with this battle"],[-355,"Ways and Means, his proposals for Athenian finances, his latest datable work"],[-354,"Dies, probably at Corinth"],[1516,"Editio princeps (Giunta, Florence)"]],"manuscripts":"The manuscript tradition differs from work to work. For the Anabasis the chief witnesses are Parisinus gr. 1640 (C, 1320) and an older family represented by Vaticanus gr. 1335 (A) and Vaticanus gr. 987 (B). For the Hellenica they are Parisinus gr. 1738 (B) and Marcianus gr. 368 (M). Numerous papyri survive, a sign of Xenophon's popularity in schools.","variants":"The Constitution of the Athenians, transmitted among Xenophon's works, is by an unknown earlier writer nicknamed 'the Old Oligarch', and Xenophon's authorship of On Hunting (Cynegeticus) is doubted. The short summaries at the start of several books of the Anabasis are later additions. In the Hellenica (3.1.2) Xenophon refers readers to an account of the expedition by 'Themistogenes of Syracuse', probably a pen-name for himself. The uneven quality of the Hellenica has led to theories that it was written in stages.","editions":["E. C. Marchant, Xenophontis Opera Omnia, 5 vols (OCT, 1900–20) — the Greek text used here","Loeb Classical Library translations by C. L. Brownson, E. C. Marchant, O. J. Todd and W. Miller (1914–25) — the translations used here; Brownson's Anabasis was revised by J. Dillery (1998)","P. Masqueray, Xénophon: Anabase (Budé, 1930–31)"]}},"tlg0641":{"name":"Xenophon of Ephesus","grc":"Ξενοφῶν Ἐφέσιος","birth":null,"death":null,"floruit":150,"year":150,"era":"imperial","desc":"Greek novelist, author of the Ephesian Tale (probably 2nd century CE)","wiki":"https://en.wikipedia.org/wiki/Xenophon_of_Ephesus","q":"Q463564","place":"Ephesus","occ":["writer","philosopher"],"nworks":1,"core":{"summary":"Xenophon of Ephesus (Ξενοφῶν Ἐφέσιος, Xenophōn Ephesios, probably 2nd century CE) is known only from his novel and a short notice in the Byzantine Suda. His name, like the novel's style, may be a tribute to the classical Xenophon. A reference to a police official in Cilicia, apparently the eirenarch, an office first attested under Trajan, suggests a date in the second century CE.\n\nThe Ephesian Tale (Ἐφεσιακά, Ephesiaka), in five books, tells how two beautiful young Ephesians, Habrocomes and Anthia, fall in love at a festival of Artemis, marry, and are separated on a voyage. Through pirates, shipwreck, slavery, brothels, attempted murders and unwanted suitors in Asia Minor, Egypt, Italy and Sicily, each stays faithful to the other until they are reunited at Rhodes. The plot is crowded with incident, and the pace rarely slows.\n\nXenophon's Greek is the simplest of all the novels: short sentences strung together with καί (kai, \"and\"), few subordinate clauses, repeated formulas and little description. Some scholars have taken this bareness, and the Suda's statement that the novel had ten books rather than five, as signs that our text is an abridgement. Others think the Suda's number is a simple error and that Xenophon wrote in a deliberately plain, popular style.","timeline":[[117,"The office of eirenarch, apparently mentioned in the novel, is first attested under Trajan (98–117)"],[150,"The Ephesian Tale written (probably 2nd century CE)"],[1000,"The Suda describes the novel as having ten books (10th century)"],[1250,"The Florentine manuscript, the only witness to the text, is copied (13th century)"],[1726,"Editio princeps by Antonio Cocchi (London)"]],"manuscripts":"The Ephesian Tale survives only in the thirteenth-century Laurentianus Conventi Soppressi 627 in Florence (F), the same manuscript that preserves Chariton. All other copies derive from it, and no papyrus of the novel has yet been identified.","variants":"With a single manuscript, the text contains many corruptions and some gaps that can only be repaired by conjecture. The chief debate is whether the novel is an epitome of a longer original, as some nineteenth-century scholars argued. Many now doubt it, explaining the Suda's 'ten books' as a copying error for 'five'.","editions":["R. Hercher, Erotici Scriptores Graeci, vol. 1 (Teubner, 1858) — the Greek text used here","A. D. Papanikolaou, Xenophon Ephesius: Ephesiacorum libri V (Teubner, 1973)","J. N. O'Sullivan, Xenophon Ephesius: De Anthia et Habrocome Ephesiacorum libri V (Teubner, 2005)","J. Henderson, Longus: Daphnis and Chloe; Xenophon of Ephesus: Anthia and Habrocomes (Loeb Classical Library, 2009)"]}},"tlg0098":{"name":"Zenobius Sophista","grc":null,"birth":null,"death":null,"floruit":130,"year":130,"era":"imperial","desc":"2nd-century Greek sophist and author","wiki":"https://en.wikipedia.org/wiki/Zenobius","q":"Q189699","place":null,"occ":["rhetorician","paremiographer"],"nworks":1},"tlg3135":{"name":"Zonaras","grc":null,"birth":1074,"death":1145,"floruit":null,"year":1109,"era":"byzantine","desc":"12th century Byzantine chronicler and theologian","wiki":"https://en.wikipedia.org/wiki/Joannes_Zonaras","q":"Q32052","place":null,"occ":["writer","historian","monk","theologian","canon law jurist"],"nworks":3},"tlg4084":{"name":"Zosimus","grc":"Ζώσιμος","birth":null,"death":null,"floruit":500,"year":500,"era":"lateantique","desc":"late 5th/early 6th century Byzantine historian","wiki":"https://en.wikipedia.org/wiki/Zosimus_(historian)","q":"Q226858","place":null,"occ":["writer","historian"],"nworks":1,"core":{"summary":"Zosimus (Ζώσιμος, Zōsimos, fl. c. 500 CE) is described in the title of his work as a count and a former advocate of the treasury. He wrote after 498, since he mentions the abolition of a tax in that year, and he was a pagan in an empire that had long been Christian. Nothing else is known of him.\n\nHis New History (Ἱστορία νέα, Historia nea), in six books, runs from a brief sketch of Augustus and the early empire to a detailed account of the fourth century and the years up to 410, breaking off just before Alaric's sack of Rome. As the Greek historian Polybius had explained Rome's rise, Zosimus set out to explain its decline, which he blamed on the abandonment of the old gods and above all on Constantine. He relied closely on two lost historians, Eunapius for the period up to 404 and Olympiodorus after that; the Byzantine scholar Photius remarked that he had copied rather than written his history.\n\nHis value lies in what he preserves of his lost sources and in his rare pagan view of the Christian empire. His Greek is plain and straightforward, with little of the classicising display of his contemporaries.","timeline":[[312,"Constantine's victory at the Milvian Bridge, which Zosimus treats as the start of Rome's decline"],[404,"The end of Eunapius' history, his main source up to this point"],[410,"His narrative breaks off shortly before Alaric's sack of Rome"],[498,"Abolition of the chrysargyron tax, which he mentions as past"],[500,"Writes the New History (c. 500)"],[1000,"The single surviving manuscript, Vaticanus gr. 156, is copied (10th–11th century)"]],"manuscripts":"The New History survives in a single medieval manuscript, Vaticanus gr. 156, probably copied at the Studios monastery in Constantinople in the tenth or eleventh century. All other copies derive from it. The work is incomplete: the end of Book 6 is lost, and the text breaks off in the year 410.","variants":"With a single manuscript, errors can only be corrected by conjecture, and lost leaves have left gaps, the largest between Books 1 and 2, where the years 282–305, including the reign of Diocletian, are missing. Scholars debate whether Zosimus left the work unfinished or whether its end was lost, and how closely each section reproduces Eunapius or Olympiodorus.","editions":["L. Mendelssohn, Zosimi Comitis et Exadvocati Fisci Historia Nova (Teubner, 1887) — the Greek text used here","F. Paschoud, Zosime: Histoire nouvelle, 3 vols in 5 (Budé, 1971–89; revised 2000–)","R. T. Ridley, Zosimus: New History (Canberra, 1982), translation and commentary"]}}}}</script>
