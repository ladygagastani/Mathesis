# Builds the site and publishes it to GitHub Pages every time something is
# uploaded to the main branch. It can also be started by hand from the
# repository's Actions tab ("Run workflow").
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two uploads happen close together, finish the running publish before
# starting the next, rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fable (which turns the F# into JavaScript) needs .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: |
          npm ci
          dotnet tool restore

      - name: Build the site
        # Accounts, sync and the forum: the Supabase project's address and
        # public key, set as repository variables (see supabase/README.md).
        # They are only used while the repository variable ACCOUNTS is "on";
        # otherwise the site builds without accounts (no Sign in button; the
        # forum and account pages say accounts aren't switched on yet).
        env:
          VITE_SUPABASE_URL: ${{ vars.ACCOUNTS == 'on' && vars.SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.ACCOUNTS == 'on' && vars.SUPABASE_ANON_KEY || '' }}
        run: |
          dotnet fable src
          npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
